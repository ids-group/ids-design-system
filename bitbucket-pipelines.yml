# CI/CD for @ids-group-ltd/ids-design-system. Build and lint logic lives in
# infrastructure/scripts/*.sh — see its README for the branch model and the release flow.
#
# NPM_TOKEN is a granular token that must have Bypass 2FA ON — npm defaults it off, and publish
# then fails EOTP. It must be rotated quarterly: npm caps a write-enabled granular token at 90
# days, and Bitbucket is not an npm trusted publisher, so there is no OIDC route that would avoid
# it. npm removes direct publish for bypass-2FA tokens in January 2027; staged publishing, where
# CI stages and a maintainer approves with 2FA, is the replacement.

image: node:22-alpine

definitions:
  caches:
    npm:
      key:
        files:
          - bun.lock
      path: ~/.npm
    bun-bin:
      path: ~/.bun/bin
    bun-cache:
      key:
        files:
          - bun.lock
      path: ~/.bun/install/cache
    # Paired with `cli.cache.environment: "all"` in angular.json: the default there is "local",
    # which switches Angular's build cache off whenever CI=true. Without that half this entry
    # caches a directory nothing writes.
    angular:
      key:
        files:
          - bun.lock
          - angular.json
      path: .angular/cache
    # eslint and stylelint `--cache` (package.json scripts). Their cache sees a file's content and the
    # config, not the code of the repo's own rule plugins, so those are in the key; locally, delete
    # `.cache/` after editing a rule under eslint/, eslint-rules/ or stylelint/.
    lint:
      key:
        files:
          - bun.lock
          - eslint.config.mjs
          - .stylelintrc.json
          - eslint/**
          - eslint-rules/**
          - stylelint/**
      path: .cache
    dist-ds:
      key:
        files:
          - bun.lock
          - tsconfig.lib.prod.json
          - src/**
      path: dist/ds

  steps:
    - step: &build
        name: Build library + docs
        caches:
          - npm
          - bun-bin
          - bun-cache
          - angular
          - dist-ds
        script:
          - sh infrastructure/scripts/build-docs.sh

pipelines:
  tags:
    'v*':
      - step:
          name: Publish to npm
          caches:
            - npm
            - bun-bin
            - bun-cache
            - angular
            - dist-ds
          script:
            - sh infrastructure/scripts/build-lib.sh
            - sh infrastructure/scripts/publish.sh
            - sh infrastructure/scripts/trigger-after-release.sh

  custom:
    # On demand, not on every PR. To make it automatic, add a top-level `pull-requests:` section
    # pointing a step at ci-pr.sh.
    validate:
      - step:
          name: Validate (build + lint)
          caches:
            - npm
            - bun-bin
            - bun-cache
            - angular
            - dist-ds
            - lint
          script:
            - sh infrastructure/scripts/ci-pr.sh

    # Run from branch `dev`. These do NOT publish — the tag they push does, via `tags: v*`.
    # Needs Secured RELEASE_TOKEN (repository:write) and DOCS_DEPLOY_TOKEN (pipeline:write).
    # `## Unreleased` must be filled on dev; preflight enforces it.
    release-patch:
      - step:
          name: Release (patch)
          caches:
            - bun-bin
            - bun-cache
          script:
            - sh infrastructure/scripts/cut-release.sh patch
    release-minor:
      - step:
          name: Release (minor)
          caches:
            - bun-bin
            - bun-cache
          script:
            - sh infrastructure/scripts/cut-release.sh minor
    release-major:
      - step:
          name: Release (major)
          caches:
            - bun-bin
            - bun-cache
          script:
            - sh infrastructure/scripts/cut-release.sh major
    release-beta:
      - step:
          name: Release (beta prerelease)
          caches:
            - bun-bin
            - bun-cache
          script:
            - sh infrastructure/scripts/cut-release.sh beta

    # Rebuilds what is generated from source. Kept out of cut-release.sh because that script
    # pushes main halfway through and must not be able to fail on an install or a build.
    #
    # Needs the AWS keys pinkmoon uses (IDS_DOCKER_AWS_ACCESS_KEY_ID, ..._SECRET_ACCESS_KEY) and
    # RELEASE_TOKEN, because the bundle step commits the tree it regenerates. That push starts
    # nothing: there is no `branches:` trigger.
    #
    # The bundle runs beside the DEPLOY, not beside the docs build. A parallel group must finish
    # before the next step, so pairing it with the build would let a bundle failure block the
    # deploy — the thing this ordering exists to prevent.
    after-release:
      - step:
          <<: *build
          name: Build ds-docs showcase
          artifacts:
            - dist/ds-docs/**
      - parallel:
        - step:
            name: Deploy ds-docs to IDS prototypes CDN
            image: amazon/aws-cli
            script:
              - export AWS_ACCESS_KEY_ID=$IDS_DOCKER_AWS_ACCESS_KEY_ID
              - export AWS_SECRET_ACCESS_KEY=$IDS_DOCKER_AWS_SECRET_ACCESS_KEY
              - export AWS_DEFAULT_REGION=eu-west-2
              - PROTO_S3_BUCKET="ids-prototypes"
              - PROTO_CF_DISTRIBUTION_ID="E1P3IR95745IWV"
              # Only hashed filenames may be immutable. A stable name cached for a year
              # cannot be dislodged by any redeploy — that is what served a stale /changelog.
              - >
                aws s3 sync dist/ds-docs/browser/ s3://$PROTO_S3_BUCKET/ids-ds/
                --delete
                --cache-control "public, max-age=31536000, immutable"
                --exclude "index.html"
                --exclude "CHANGELOG.md"
                --exclude "favicon.ico"
                --exclude "favicon.svg"
                --exclude "apple-touch-icon.png"
              - >
                aws s3 sync dist/ds-docs/browser/ s3://$PROTO_S3_BUCKET/ids-ds/
                --cache-control "public, max-age=0, must-revalidate"
                --exclude "*"
                --include "CHANGELOG.md"
                --include "favicon.ico"
                --include "favicon.svg"
                --include "apple-touch-icon.png"
              - >
                aws s3 cp dist/ds-docs/browser/index.html s3://$PROTO_S3_BUCKET/ids-ds/index.html
                --cache-control "public, max-age=0, must-revalidate"
                --content-type "text/html"
              - >
                aws cloudfront create-invalidation
                --distribution-id $PROTO_CF_DISTRIBUTION_ID
                --paths "/ids-ds/index.html" "/ids-ds/CHANGELOG.md" "/ids-ds/favicon.ico" "/ids-ds/favicon.svg" "/ids-ds/apple-touch-icon.png"
        - step:
            name: Build Claude Design bundle
            caches:
              - npm
              - bun-bin
              - bun-cache
              - angular
            artifacts:
              - .design-sync/elements/dist/**
            script:
              - sh infrastructure/scripts/build-design-sync.sh
      - step:
          name: Sync dev with main
          script:
            - sh infrastructure/scripts/sync-dev.sh
