# CI/CD for @ids-group-ltd/ids-design-system.
#
# Build/lint logic lives in infrastructure/scripts/*.sh (see its README); this
# file only wires images, caches, and triggers.
#
#   pull-requests  -> lint || build quality gate
#   tags v*        -> build the library and publish to npm
#   custom         -> deploy the ds-docs showcase to the IDS prototypes CDN
#
# Publish auth: a Secured repository variable NPM_TOKEN — an npm granular access
# token with read+write on the @ids-group-ltd scope and "Bypass 2FA" enabled.
# Write-enabled granular tokens expire in 90 days max (npm policy since Oct 2025),
# so NPM_TOKEN must be rotated quarterly. Bitbucket is not yet an npm trusted
# publisher (no OIDC), so a token is currently the only option. The .npmrc below
# stores the literal string ${NPM_TOKEN}; npm substitutes the env var at runtime,
# so the token value is never written to disk.
#
# Release flow:
#   npm run release:minor                 # bumps version, commits, creates vX.Y.Z tag
#   git push origin main --follow-tags    # the tag push triggers the publish pipeline

image: node:22-alpine

definitions:
  caches:
    npm:
      key:
        files:
          - package-lock.json
      path: ~/.npm
    bun-bin:
      path: ~/.bun/bin
    bun-cache:
      key:
        files:
          - package-lock.json
      path: ~/.bun/install/cache
    angular:
      key:
        files:
          - package-lock.json
          - angular.json
      path: .angular/cache
    dist-ds:
      key:
        files:
          - package-lock.json
          - tsconfig.lib.prod.json
          - src/**
      path: dist/ds

  steps:
    # report-only while the repo carries pre-existing lint debt; the build step
    # is the hard gate. Flip to blocking (drop the arg) once the codebase is clean.
    - step: &lint
        name: Lint (format + stylelint + eslint, report-only)
        caches:
          - npm
          - bun-bin
          - bun-cache
        script:
          - sh infrastructure/scripts/lint.sh report-only

    - step: &build
        name: Build library + docs
        caches:
          - npm
          - bun-bin
          - bun-cache
          - angular
          - dist-ds
        script:
          - sh infrastructure/scripts/build-docs.sh

pipelines:
  pull-requests:
    '**':
      - parallel:
          - step: *lint
          - step: *build

  tags:
    'v*':
      - step:
          name: Build & publish to npm
          caches:
            - npm
            - bun-bin
            - bun-cache
            - angular
            - dist-ds
          script:
            - sh infrastructure/scripts/build-lib.sh
            - echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > .npmrc
            - npm publish ./dist/ds

  custom:
    # Manual deploy of the ds-docs showcase to the IDS prototypes CDN, mirroring
    # the pinkmoon prototype deploy: shared bucket ids-prototypes + CloudFront
    # E1P3IR95745IWV in eu-west-2, served under /ids-ds/ alongside /pm-admin and
    # /pm-field. Requires the same Secured repository variables pinkmoon uses:
    # IDS_DOCKER_AWS_ACCESS_KEY_ID, IDS_DOCKER_AWS_SECRET_ACCESS_KEY.
    deploy-docs:
      - step:
          <<: *build
          name: Build ds-docs showcase
          artifacts:
            - dist/ds-docs/**
      - step:
          name: Deploy ds-docs to IDS prototypes CDN
          image: amazon/aws-cli
          script:
            - export AWS_ACCESS_KEY_ID=$IDS_DOCKER_AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$IDS_DOCKER_AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=eu-west-2
            - PROTO_S3_BUCKET="ids-prototypes"
            - PROTO_CF_DISTRIBUTION_ID="E1P3IR95745IWV"
            # Hashed assets — long immutable cache
            - >
              aws s3 sync dist/ds-docs/browser/ s3://$PROTO_S3_BUCKET/ids-ds/
              --delete
              --cache-control "public, max-age=31536000, immutable"
              --exclude "index.html"
            # SPA entry point — always revalidate
            - >
              aws s3 cp dist/ds-docs/browser/index.html s3://$PROTO_S3_BUCKET/ids-ds/index.html
              --cache-control "public, max-age=0, must-revalidate"
              --content-type "text/html"
            # Invalidate the entry point (hashed assets need no invalidation)
            - >
              aws cloudfront create-invalidation
              --distribution-id $PROTO_CF_DISTRIBUTION_ID
              --paths "/ids-ds/index.html"
