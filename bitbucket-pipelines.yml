# Publishes @ids-group-ltd/ids-design-system to npm when a vX.Y.Z git tag is pushed.
#
# Auth: a Secured repository variable NPM_TOKEN — an npm granular access token
# with read+write on the @ids-group-ltd scope and "Bypass 2FA" enabled.
# Set it under: Repository settings -> Repository variables.
#
# NOTE: write-enabled granular tokens expire in 90 days max (npm policy since
# Oct 2025), so NPM_TOKEN must be rotated quarterly. Bitbucket is not yet an
# npm trusted publisher (no OIDC), so a token is currently the only option.
#
# The .npmrc below stores the literal string ${NPM_TOKEN}; npm substitutes the
# env var at runtime, so the token value is never written to disk (npm docs).
#
# Release flow:
#   npm run release:minor                 # bumps version, commits, creates vX.Y.Z tag
#   git push origin main --follow-tags    # the tag push triggers this pipeline

image: node:22-alpine

definitions:
  caches:
    npm:
      key:
        files:
          - package-lock.json
      path: ~/.npm

pipelines:
  tags:
    'v*':
      - step:
          name: Build & publish to npm
          caches:
            - npm
          script:
            - npm ci
            - npm run build
            - echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > .npmrc
            - npm publish ./dist/ds

  custom:
    # Manual deploy of the ds-docs showcase to the IDS prototypes CDN, mirroring
    # the pinkmoon prototype deploy: shared bucket ids-prototypes + CloudFront
    # E1P3IR95745IWV in eu-west-2, served under /ids-ds/ alongside /pm-admin and
    # /pm-field. No dedicated infra needed. Requires the same Secured repository
    # variables pinkmoon uses: IDS_DOCKER_AWS_ACCESS_KEY_ID, IDS_DOCKER_AWS_SECRET_ACCESS_KEY.
    deploy-docs:
      - step:
          name: Build ds-docs showcase
          caches:
            - npm
          script:
            - npm ci
            - npm run build:docs
          artifacts:
            - dist/ds-docs/**
      - step:
          name: Deploy ds-docs to IDS prototypes CDN
          image: amazon/aws-cli
          script:
            - export AWS_ACCESS_KEY_ID=$IDS_DOCKER_AWS_ACCESS_KEY_ID
            - export AWS_SECRET_ACCESS_KEY=$IDS_DOCKER_AWS_SECRET_ACCESS_KEY
            - export AWS_DEFAULT_REGION=eu-west-2
            - PROTO_S3_BUCKET="ids-prototypes"
            - PROTO_CF_DISTRIBUTION_ID="E1P3IR95745IWV"
            # Hashed assets — long immutable cache
            - >
              aws s3 sync dist/ds-docs/browser/ s3://$PROTO_S3_BUCKET/ids-ds/
              --delete
              --cache-control "public, max-age=31536000, immutable"
              --exclude "index.html"
            # SPA entry point — always revalidate
            - >
              aws s3 cp dist/ds-docs/browser/index.html s3://$PROTO_S3_BUCKET/ids-ds/index.html
              --cache-control "public, max-age=0, must-revalidate"
              --content-type "text/html"
            # Invalidate the entry point (hashed assets need no invalidation)
            - >
              aws cloudfront create-invalidation
              --distribution-id $PROTO_CF_DISTRIBUTION_ID
              --paths "/ids-ds/index.html"
