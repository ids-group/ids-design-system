<section class="dashboard">
  <h1>Dashboard</h1>

  <ds-tabs
    [selectedIndex]="selectedIndex()"
    (selectedIndexChange)="onTabChange($event)"
  >
    <ds-tab label="Overview">
      <ds-card>
        <p>Welcome, {{ user()?.fullName }}.</p>
        <p>This starter runs on a mock backend — no server required.</p>
      </ds-card>
    </ds-tab>
    <ds-tab label="Activity">
      <ds-card>
        <p>
          Nothing here yet — the active tab is stored in the URL
          (?tab=activity).
        </p>
      </ds-card>
    </ds-tab>
  </ds-tabs>
</section>
