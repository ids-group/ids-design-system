<header class="head">
  <h1>Items</h1>
  <ds-button
    routerLink="new"
    size="sm"
  >
    Add item
  </ds-button>
</header>

<form
  class="search"
  (submit)="$event.preventDefault(); applySearch()"
>
  <ds-input
    placeholder="Search name or category…"
    [(value)]="searchTerm"
  />
  <ds-button
    type="submit"
    variant="outline"
    size="sm"
  >
    Search
  </ds-button>
</form>

@if (loading()) {
  <p>Loading…</p>
} @else if (items().length === 0) {
  <p>No items match.</p>
} @else {
  <table class="table">
    <thead>
      <tr>
        <th>
          <button
            type="button"
            class="sort"
            (click)="sortBy('name')"
          >
            Name
            @if (params().sortField === 'name') {
              <span>{{ params().sortOrder === 'Asc' ? '▲' : '▼' }}</span>
            }
          </button>
        </th>
        <th>
          <button
            type="button"
            class="sort"
            (click)="sortBy('category')"
          >
            Category
            @if (params().sortField === 'category') {
              <span>{{ params().sortOrder === 'Asc' ? '▲' : '▼' }}</span>
            }
          </button>
        </th>
        <th>
          <button
            type="button"
            class="sort"
            (click)="sortBy('quantity')"
          >
            Qty
            @if (params().sortField === 'quantity') {
              <span>{{ params().sortOrder === 'Asc' ? '▲' : '▼' }}</span>
            }
          </button>
        </th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (item of items(); track item.id) {
        <tr>
          <td>{{ item.name }}</td>
          <td>{{ item.category }}</td>
          <td>
            <app-quantity-cell [quantity]="item.quantity" />
          </td>
          <td class="actions">
            <ds-button
              variant="tertiary"
              size="sm"
              [routerLink]="[item.id, 'edit']"
            >
              Edit
            </ds-button>
            <ds-button
              variant="tertiary"
              size="sm"
              (click)="remove(item)"
            >
              Delete
            </ds-button>
          </td>
        </tr>
      }
    </tbody>
  </table>
}
