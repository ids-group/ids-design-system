<form
  class="login"
  (submit)="onSubmit($event)"
>
  <h1 class="title">Sign in</h1>

  <ds-input
    label="Email"
    type="email"
    placeholder="you@example.com"
    [(value)]="email"
  />
  <ds-input
    label="Password"
    type="password"
    [(value)]="password"
  />

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  <ds-button
    type="submit"
    [loading]="loading()"
  >
    Sign in
  </ds-button>

  <p class="hint">Mock auth — any credentials work.</p>
</form>
