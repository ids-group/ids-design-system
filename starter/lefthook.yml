# Git hooks (lefthook). Pre-commit: format + lint staged code.
# Install once after clone: `bunx lefthook install` (or `npx lefthook install`).
pre-commit:
  parallel: true
  commands:
    prettier:
      glob: 'projects/**/*.{ts,html,scss,css,json,md}'
      run: bunx prettier --check {staged_files}
    stylelint:
      glob: 'projects/**/*.{scss,css}'
      run: bunx stylelint {staged_files}
    eslint:
      glob: 'projects/**/*.{ts,html}'
      run: bunx eslint {staged_files}
