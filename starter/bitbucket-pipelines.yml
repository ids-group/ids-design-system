# CI for the app starter. The gate (lint incl. Sheriff boundaries + build) lives
# in infrastructure/scripts/ci-validate.sh so it runs identically locally and in CI.
#
# Note: this consumes @ids-group-ltd/ids-design-system from the private registry.
# Configure NPM_TOKEN (Secured repo variable) + uncomment the scope line in .npmrc.
image: oven/bun:1

definitions:
  caches:
    bun-cache:
      key:
        files:
          - bun.lock
      path: ~/.bun/install/cache
    angular:
      key:
        files:
          - bun.lock
          - angular.json
      path: .angular/cache
  steps:
    - step: &validate
        name: Lint + build
        caches:
          - bun-cache
          - angular
        script:
          - bash infrastructure/scripts/ci-validate.sh

pipelines:
  pull-requests:
    '**':
      - step: *validate
  branches:
    main:
      - step: *validate
