<div class="tweaks-panel" [class.open]="open()">
  <button class="toggle" type="button" (click)="toggle()">
    {{ open() ? '✕' : '⚙' }} Tweaks
  </button>
  @if (open()) {
    <div class="body">
      <div class="row">
        <label class="label">Density</label>
        <div class="segmented">
          <button type="button" [class.active]="density() === 'compact'" (click)="setDensity('compact')">Compact</button>
          <button type="button" [class.active]="density() === 'cozy'" (click)="setDensity('cozy')">Cozy</button>
          <button type="button" [class.active]="density() === 'comfy'" (click)="setDensity('comfy')">Comfy</button>
        </div>
      </div>
      <div class="row">
        <label class="label">Brand preview</label>
        <div class="segmented">
          <button type="button" [class.active]="brand() === 'default'" (click)="setBrand('default')">Default</button>
          <button type="button" [class.active]="brand() === 'manage-my'" (click)="setBrand('manage-my')">ManageMy</button>
        </div>
      </div>
      <div class="row">
        <label class="label">Brand H ({{ brandH() }}°)</label>
        <input type="range" min="0" max="360" [value]="brandH()" (input)="setBrandH($any($event.target).value)" />
      </div>
      <div class="row">
        <label class="label">Brand S ({{ brandS() }}%)</label>
        <input type="range" min="0" max="100" [value]="brandS()" (input)="setBrandS($any($event.target).value)" />
      </div>
      <div class="row">
        <label class="label">Brand L ({{ brandL() }}%)</label>
        <input type="range" min="0" max="100" [value]="brandL()" (input)="setBrandL($any($event.target).value)" />
      </div>
      <div class="row">
        <label class="label">Secondary H ({{ secondaryH() }}°)</label>
        <input type="range" min="0" max="360" [value]="secondaryH()" (input)="setSecondaryH($any($event.target).value)" />
      </div>
      <div class="row">
        <label class="label">Secondary S ({{ secondaryS() }}%)</label>
        <input type="range" min="0" max="100" [value]="secondaryS()" (input)="setSecondaryS($any($event.target).value)" />
      </div>
      <div class="row">
        <label class="label">Secondary L ({{ secondaryL() }}%)</label>
        <input type="range" min="0" max="100" [value]="secondaryL()" (input)="setSecondaryL($any($event.target).value)" />
      </div>
      <div class="row">
        <label class="label">Root font-size ({{ rootFs() }}px)</label>
        <input type="range" min="12" max="20" [value]="rootFs()" (input)="setFs($any($event.target).value)" />
      </div>
      <div class="row">
        <button type="button" class="reset" (click)="reset()">Reset</button>
      </div>
    </div>
  }
</div>
