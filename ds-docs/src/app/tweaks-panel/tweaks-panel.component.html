<ds-button
  class="tweaks-trigger"
  color="neutral"
  variant="ghost"
  (pressed)="open.set(true)"
>
  ⚙ Tweaks
</ds-button>

<ds-drawer
  title="Tweaks"
  placement="right"
  size="sm"
  [(open)]="open"
>
  <ng-container drawer-body>
    <div class="row">
      <label class="label">
        Theme
      </label>

      <ds-segmented
        ariaLabel="Theme"
        [options]="themeOptions"
        [value]="theme()"
        (valueChange)="setTheme($any($event))"
      />
    </div>

    <div class="row">
      <label class="label">
        Density
      </label>

      <ds-segmented
        ariaLabel="Density"
        [options]="densityOptions"
        [value]="density()"
        (valueChange)="setDensity($any($event))"
      />
    </div>

    <div class="row">
      <label class="label">
        Brand preview
      </label>

      <ds-segmented
        ariaLabel="Brand preview"
        [options]="brandOptions"
        [value]="brand()"
        (valueChange)="setBrand($any($event))"
      />
    </div>

    <div class="row">
      <label class="label">
        Neutrals
      </label>

      <ds-segmented
        ariaLabel="Neutrals"
        [options]="neutralsOptions"
        [value]="neutrals()"
        (valueChange)="setNeutrals($any($event))"
      />
    </div>

    <div class="row">
      <label class="label">
        Primary H ({{ primaryH() }}°)
      </label>

      <ds-slider
        ariaLabel="Primary hue"
        [min]="0"
        [max]="360"
        [value]="primaryH()"
        (valueChange)="setPrimaryH($any($event))"
      />
    </div>

    <div class="row">
      <label class="label">
        Primary S ({{ primaryS() }}%)
      </label>

      <ds-slider
        ariaLabel="Primary saturation"
        [min]="0"
        [max]="100"
        [value]="primaryS()"
        (valueChange)="setPrimaryS($any($event))"
      />
    </div>

    <div class="row">
      <label class="label">
        Primary L ({{ primaryL() }}%)
      </label>

      <ds-slider
        ariaLabel="Primary lightness"
        [min]="0"
        [max]="100"
        [value]="primaryL()"
        (valueChange)="setPrimaryL($any($event))"
      />
    </div>

    <div class="row">
      <label class="label">
        Secondary H ({{ secondaryH() }}°)
      </label>

      <ds-slider
        ariaLabel="Secondary hue"
        [min]="0"
        [max]="360"
        [value]="secondaryH()"
        (valueChange)="setSecondaryH($any($event))"
      />
    </div>

    <div class="row">
      <label class="label">
        Secondary S ({{ secondaryS() }}%)
      </label>

      <ds-slider
        ariaLabel="Secondary saturation"
        [min]="0"
        [max]="100"
        [value]="secondaryS()"
        (valueChange)="setSecondaryS($any($event))"
      />
    </div>

    <div class="row">
      <label class="label">
        Secondary L ({{ secondaryL() }}%)
      </label>

      <ds-slider
        ariaLabel="Secondary lightness"
        [min]="0"
        [max]="100"
        [value]="secondaryL()"
        (valueChange)="setSecondaryL($any($event))"
      />
    </div>

    <div class="row">
      <label class="label">
        Root font-size ({{ rootFs() }}px)
      </label>

      <ds-slider
        ariaLabel="Root font size"
        [min]="12"
        [max]="20"
        [value]="rootFs()"
        (valueChange)="setFs($any($event))"
      />
    </div>
  </ng-container>

  <ng-container drawer-footer>
    <ds-button
      color="neutral"
      variant="outline"
      (pressed)="reset()"
    >
      Reset
    </ds-button>
  </ng-container>
</ds-drawer>
