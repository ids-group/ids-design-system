<docs-section
  data-claude-design
  anchor="surface-levels"
  eyebrow="Foundations"
  title="Surface levels">
  <span lede>
    Ten surface roles: composable lanes, not elevation tiers. A canvas card can
    hold a subtle hover lane and a muted code block.
  </span>

  <div class="grid">
    @for (s of surfaces; track s.token) {
      <div class="cell">
        <div
          class="swatch"
          [style.background]="'var(' + s.token + ')'">
        </div>

        <div class="t-s-bold cell-name">
          {{ s.name }}
        </div>

        <code class="t-mono-inline cell-tok">
          {{ s.token }}
        </code>

        <div class="t-xs cell-desc">
          {{ s.desc }}
        </div>
      </div>
    }
  </div>
</docs-section>
