<docs-section
  anchor="surface-levels"
  eyebrow="Foundations"
  title="Surface levels"
>
  <span lede>
    Eight surface roles. They're not strict elevation tiers — they're contextual
    lanes that compose. A card on the canvas can have a subtle hover lane and a
    muted code block inside it.
  </span>

  <div class="grid">
    @for (s of surfaces; track s.token) {
      <div class="cell">
        <div
          class="swatch"
          [style.background]="'var(' + s.token + ')'"
        ></div>

        <div class="t-s-bold cell__name">
          {{ s.name }}
        </div>

        <code class="t-mono-inline cell__tok">
          {{ s.token }}
        </code>

        <div class="t-xs cell__desc">
          {{ s.desc }}
        </div>
      </div>
    }
  </div>
</docs-section>
