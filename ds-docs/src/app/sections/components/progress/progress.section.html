<docs-section
  anchor="progress"
  eyebrow="Components"
  title="Progress"
>
  <docs-truncation [rules]="truncationRules" />

  <span lede>
    Horizontal progress bar. Value 0..100 for determinate. Four status variants
    match the global colour roles, plus an indeterminate sweep for unknown
    duration.
  </span>

  <h3 class="block-title t-h4">
    Variants
  </h3>

  <div class="states">
    <div class="state">
      <code class="t-mono-inline state__lbl">
        default · 30%
      </code>

      <ds-progress [value]="30" />
    </div>

    <div class="state">
      <code class="t-mono-inline state__lbl">
        default · 70%
      </code>

      <ds-progress [value]="70" />
    </div>

    <div class="state">
      <code class="t-mono-inline state__lbl">
        success · 70%
      </code>

      <ds-progress
        variant="success"
        [value]="70"
      />
    </div>

    <div class="state">
      <code class="t-mono-inline state__lbl">
        warning · 92%
      </code>

      <ds-progress
        variant="warning"
        [value]="92"
      />
    </div>

    <div class="state">
      <code class="t-mono-inline state__lbl">
        error · 100%
      </code>

      <ds-progress
        variant="error"
        [value]="100"
      />
    </div>

    <div class="state">
      <code class="t-mono-inline state__lbl">
        indeterminate
      </code>

      <ds-progress indeterminate />
    </div>
  </div>
</docs-section>
