<docs-section
  anchor="combobox"
  eyebrow="Components"
  title="Combobox &middot; multi-select"
>
  <docs-truncation [rules]="truncationRules" />

  <span lede>
    Text input that filters a token-tagged list. Single-select for picking a
    record (a Member, a venue); multi-select for picking a set (allowed
    products, audience tags). Distinct from
    <code class="t-mono-inline"> &lt;ds-select&gt; </code> (fixed-list dropdown)
    and Command palette (global search).
  </span>

  <h3 class="block-title t-h4">Single</h3>

  <div class="field-stack">
    <label class="field-label t-s"> Member </label>

    <ds-combobox
      placeholder="Pick a member…"
      [options]="members"
      [(value)]="memberValue"
    />
  </div>

  <h3 class="block-title t-h4">Multi</h3>

  <div class="field-stack">
    <label class="field-label t-s"> Allowed products </label>

    <ds-combobox
      placeholder="Add product…"
      [options]="products"
      [multiple]="true"
      [(value)]="productsValue"
    />
  </div>
</docs-section>
