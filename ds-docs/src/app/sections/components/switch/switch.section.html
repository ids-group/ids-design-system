<docs-section
  anchor="switch"
  eyebrow="Components"
  title="Switch">
  <div class="stack">
    <ds-switch label="Sync with Inventory service" />

    <ds-switch
      label="Auto-recompute"
      [checked]="true" />

    <ds-switch
      variant="success"
      label="Live"
      [checked]="true" />

    <ds-switch
      variant="error"
      label="Locked"
      [checked]="true" />
  </div>

  <!-- Live ds-switch; pin-focus on the stage reads bare role token via ::ng-deep.
       success/error/disabled use real variant/disabled inputs. -->
  <h3 class="block-title t-h4">Switch states showcase</h3>

  <div class="states states--cols-4">
    <div class="state-cell">
      <div class="state-cell-stage">
        <ds-switch ariaLabel="Off" />
      </div>

      <div class="state-cell-label">Off</div>
    </div>

    <div class="state-cell">
      <div class="state-cell-stage pin-focus">
        <ds-switch ariaLabel="Off · focus" />
      </div>

      <div class="state-cell-label">Off · focus</div>
    </div>

    <div class="state-cell">
      <div class="state-cell-stage">
        <ds-switch
          [checked]="true"
          ariaLabel="On" />
      </div>

      <div class="state-cell-label">On</div>
    </div>

    <div class="state-cell">
      <div class="state-cell-stage pin-focus">
        <ds-switch
          [checked]="true"
          ariaLabel="On · focus" />
      </div>

      <div class="state-cell-label">On · focus</div>
    </div>

    <div class="state-cell">
      <div class="state-cell-stage">
        <ds-switch
          variant="success"
          [checked]="true"
          ariaLabel="Success · on" />
      </div>

      <div class="state-cell-label">Success · on</div>
    </div>

    <div class="state-cell">
      <div class="state-cell-stage">
        <ds-switch
          variant="error"
          [checked]="true"
          ariaLabel="Error · on" />
      </div>

      <div class="state-cell-label">Error · on</div>
    </div>

    <div class="state-cell">
      <div class="state-cell-stage">
        <ds-switch
          [disabled]="true"
          ariaLabel="Disabled · off" />
      </div>

      <div class="state-cell-label">Disabled · off</div>
    </div>

    <div class="state-cell">
      <div class="state-cell-stage">
        <ds-switch
          [disabled]="true"
          [checked]="true"
          ariaLabel="Disabled · on" />
      </div>

      <div class="state-cell-label">Disabled · on</div>
    </div>
  </div>

  <h3 class="block-title t-h4">Sizes</h3>

  <div class="sw-size-row">
    <ds-switch
      size="sm"
      label="Small" />

    <ds-switch
      size="md"
      label="Medium" />

    <ds-switch
      size="lg"
      label="Large" />
  </div>

  <h3 class="block-title t-h4">Required</h3>

  <div class="stack">
    <ds-switch
      label="Accept usage data"
      [required]="true" />
  </div>

  <h3 class="block-title t-h4">Validation states</h3>

  <p class="block-desc t-s">
    Use <code class="t-mono-inline">hint</code> for helper text and
    <code class="t-mono-inline"> [invalid]="true" </code> to surface an error.
  </p>

  <div class="stack">
    <ds-switch
      label="Email notifications"
      hint="Notifications are sent to your registered email." />

    <ds-switch
      label="Email notifications"
      error="At least one notification channel must remain active." />
  </div>
</docs-section>
