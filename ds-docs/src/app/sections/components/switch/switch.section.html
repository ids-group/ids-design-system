<docs-section
  anchor="switch"
  eyebrow="Components"
  title="Switch"
>
  <div class="stack">
    <label class="control-row">
      <ds-switch /> Sync with Inventory service
    </label>

    <label class="control-row">
      <ds-switch [checked]="true" /> Auto-recompute
    </label>

    <label class="control-row">
      <ds-switch
        variant="success"
        [checked]="true"
      />
      Live
    </label>

    <label class="control-row">
      <ds-switch
        variant="error"
        [checked]="true"
      />
      Locked
    </label>
  </div>

  <!-- ============================================================ Switch states showcase -->
  <!-- Live ds-switch; pin-focus on the stage reads bare role token via ::ng-deep.
       success/error/disabled use real variant/disabled inputs. -->
  <h3 class="block-title t-h4">
    Switch states showcase
  </h3>

  <div class="states states--cols-4">
    <div class="state-cell">
      <div class="state-cell__stage">
        <ds-switch />
      </div>

      <div class="state-cell__label">
        Off
      </div>
    </div>

    <div class="state-cell">
      <div class="state-cell__stage pin-focus">
        <ds-switch />
      </div>

      <div class="state-cell__label">
        Off · focus
      </div>
    </div>

    <div class="state-cell">
      <div class="state-cell__stage">
        <ds-switch [checked]="true" />
      </div>

      <div class="state-cell__label">
        On
      </div>
    </div>

    <div class="state-cell">
      <div class="state-cell__stage pin-focus">
        <ds-switch [checked]="true" />
      </div>

      <div class="state-cell__label">
        On · focus
      </div>
    </div>

    <div class="state-cell">
      <div class="state-cell__stage">
        <ds-switch
          variant="success"
          [checked]="true"
        />
      </div>

      <div class="state-cell__label">
        Success · on
      </div>
    </div>

    <div class="state-cell">
      <div class="state-cell__stage">
        <ds-switch
          variant="error"
          [checked]="true"
        />
      </div>

      <div class="state-cell__label">
        Error · on
      </div>
    </div>

    <div class="state-cell">
      <div class="state-cell__stage">
        <ds-switch [disabled]="true" />
      </div>

      <div class="state-cell__label">
        Disabled · off
      </div>
    </div>

    <div class="state-cell">
      <div class="state-cell__stage">
        <ds-switch
          [disabled]="true"
          [checked]="true"
        />
      </div>

      <div class="state-cell__label">
        Disabled · on
      </div>
    </div>
  </div>
</docs-section>
