<docs-section
  anchor="checkbox"
  eyebrow="Components"
  title="Checkbox"
>

  <div class="stack">
    <ds-checkbox label="Default" />

    <ds-checkbox
      label="Checked"
      [checked]="true"
    />

    <ds-checkbox
      label="Indeterminate"
      [indeterminate]="true"
    />

    <ds-checkbox
      label="Disabled"
      [disabled]="true"
    />
  </div>

  <!-- ============================================================ Checkbox states showcase -->
  <!-- Live ds-checkbox; pin classes on the stage read bare role tokens via
       ::ng-deep (see styles). API-expressible states use real inputs. -->
  <h3 class="block-title t-h4">
    Checkbox states showcase
  </h3>

  <div class="states states--cols-4">
    <div class="state-cell">
      <div class="state-cell__stage">
        <ds-checkbox />
      </div>

      <div class="state-cell__label">
        Default
      </div>
    </div>

    <div class="state-cell">
      <div class="state-cell__stage pin-hover">
        <ds-checkbox />
      </div>

      <div class="state-cell__label">
        Hover
      </div>
    </div>

    <div class="state-cell">
      <div class="state-cell__stage pin-focus">
        <ds-checkbox />
      </div>

      <div class="state-cell__label">
        Focus
      </div>
    </div>

    <div class="state-cell">
      <div class="state-cell__stage">
        <ds-checkbox [checked]="true" />
      </div>

      <div class="state-cell__label">
        Checked
      </div>
    </div>

    <div class="state-cell">
      <div class="state-cell__stage pin-focus">
        <ds-checkbox [checked]="true" />
      </div>

      <div class="state-cell__label">
        Checked · focus
      </div>
    </div>

    <div class="state-cell">
      <div class="state-cell__stage">
        <ds-checkbox [indeterminate]="true" />
      </div>

      <div class="state-cell__label">
        Indeterminate
      </div>
    </div>

    <div class="state-cell">
      <div class="state-cell__stage">
        <ds-checkbox [disabled]="true" />
      </div>

      <div class="state-cell__label">
        Disabled
      </div>
    </div>

    <div class="state-cell">
      <div class="state-cell__stage">
        <ds-checkbox
          [disabled]="true"
          [checked]="true"
        />
      </div>

      <div class="state-cell__label">
        Disabled · checked
      </div>
    </div>
  </div>

  <!-- ============================================================ Sizes -->
  <h3 class="block-title t-h4">
    Sizes
  </h3>

  <div class="cb-size-row">
    <ds-checkbox
      size="sm"
      label="Small"
    />

    <ds-checkbox
      size="md"
      label="Medium"
    />

    <ds-checkbox
      size="lg"
      label="Large"
    />
  </div>

  <!-- ============================================================ Required -->
  <h3 class="block-title t-h4">
    Required
  </h3>

  <div class="stack">
    <ds-checkbox
      label="Acknowledge terms"
      [required]="true"
    />
  </div>

  <!-- ============================================================ Validation states -->
  <h3 class="block-title t-h4">
    Validation states
  </h3>

  <p class="block-desc t-s">
    Use <code class="t-mono-inline">hint</code> to add helper text below the
    checkbox, and <code class="t-mono-inline">[invalid]="true"</code> to switch
    it to an error message.
  </p>

  <div class="stack">
    <ds-checkbox
      label="Acknowledge terms"
      hint="Required for contract sign-off."
    />

    <ds-checkbox
      label="Acknowledge terms"
      hint="You must accept the terms to continue."
      [invalid]="true"
    />
  </div>

</docs-section>
