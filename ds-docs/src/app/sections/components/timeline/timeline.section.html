<docs-section
  anchor="timeline"
  eyebrow="Components"
  title="Timeline"
  [apiKeys]="['timeline:TimelineItemComponent']">
  <span lede>
    A vertical activity feed of events in sequence.
  </span>

  <h3
    data-claude-design
    class="block-title t-h4">
    Activity feed
  </h3>

  <p class="block-desc t-s">
    Each step takes <code>heading</code>, <code>time</code>, optional
    <code>
      icon
    </code> and a semantic-colour <code>tone</code>.
  </p>

  <div class="demo-panel">
    <ds-timeline>
      <ds-timeline-item
        heading="Order confirmed"
        time="Today · 09:41"
        icon="check"
        tone="primary" />

      <ds-timeline-item
        heading="Packed &amp; ready"
        time="Today · 11:20"
        icon="folder"
        tone="success">
        3 items · Warehouse B
      </ds-timeline-item>

      <ds-timeline-item
        heading="Out for delivery"
        time="Pending"
        icon="clock"
        tone="muted" />

      <ds-timeline-item
        heading="Delivered"
        time="Estimated: Tomorrow"
        icon="flag"
        tone="default" />
    </ds-timeline>
  </div>

  <h3
    data-claude-design
    class="block-title t-h4"
    data-for="timeline-item">
    Tone variants
  </h3>

  <p class="block-desc t-s">
    Tones: <code>primary</code> · <code>success</code> ·
    <code>
      warning
    </code> · <code>error</code> · <code>muted</code> ·
    <code>
      default
    </code>.
  </p>

  <div class="states is-cols-3">
    <div class="state-cell">
      <div class="state-cell-stage">
        <ds-timeline>
          <ds-timeline-item
            heading="Confirmed"
            time="09:41"
            icon="check"
            tone="primary" />
        </ds-timeline>
      </div>

      <div class="state-cell-label">
        primary
      </div>
    </div>

    <div class="state-cell">
      <div class="state-cell-stage">
        <ds-timeline>
          <ds-timeline-item
            heading="Complete"
            time="11:20"
            icon="check"
            tone="success" />
        </ds-timeline>
      </div>

      <div class="state-cell-label">
        success
      </div>
    </div>

    <div class="state-cell">
      <div class="state-cell-stage">
        <ds-timeline>
          <ds-timeline-item
            heading="Delayed"
            time="14:05"
            icon="bell"
            tone="warning" />
        </ds-timeline>
      </div>

      <div class="state-cell-label">
        warning
      </div>
    </div>

    <div class="state-cell">
      <div class="state-cell-stage">
        <ds-timeline>
          <ds-timeline-item
            heading="Failed"
            time="15:30"
            icon="flag"
            tone="error" />
        </ds-timeline>
      </div>

      <div class="state-cell-label">
        error
      </div>
    </div>

    <div class="state-cell">
      <div class="state-cell-stage">
        <ds-timeline>
          <ds-timeline-item
            heading="Pending"
            time="—"
            icon="clock"
            tone="muted" />
        </ds-timeline>
      </div>

      <div class="state-cell-label">
        muted
      </div>
    </div>

    <div class="state-cell">
      <div class="state-cell-stage">
        <ds-timeline>
          <ds-timeline-item
            heading="Scheduled"
            time="Tomorrow"
            icon="flag"
            tone="default" />
        </ds-timeline>
      </div>

      <div class="state-cell-label">
        default
      </div>
    </div>
  </div>
</docs-section>
