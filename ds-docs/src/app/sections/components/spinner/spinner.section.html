<docs-section

    <div class="size-cell">
      <ds-spinner />

      <code class="t-mono-inline">
        size="md" · 16 px
      </code>

    <div class="size-cell">
      <ds-spinner size="lg" />

      <code class="t-mono-inline">
        size="lg" · 24 px
      </code>
    </div>
  </div>

  <h3
    data-claude-design
    class="block-title t-h4">
    Inline usage
  </h3>

  <div class="inline-demo">
    <ds-spinner size="sm" />

      Saving changes…
    </span>
