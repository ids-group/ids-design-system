<docs-section
  anchor="w3w"
  eyebrow="Components"
  title="w3w">
  <span lede>
    Pill for what3words addresses: monospace accent body, error-red
    <code class="t-mono-inline">
      prefix
    </code> mark (default
    <code class="t-mono-inline">
      ///
    </code>). Click, Enter or Space copies
    <code class="t-mono-inline">
      prefix + address
    </code> and emits
    <code class="t-mono-inline">
      (copied)
    </code> with the address;
    <code class="t-mono-inline">
      [copyable]="false"
    </code> makes it static.
  </span>

  <h3
    data-claude-design
    class="block-title t-h4">
    Specimen
  </h3>

  <div class="row">
    <ds-w3w address="daring.lion.race" />
  </div>

  <h3 class="block-title t-h4">
    Non-copyable
  </h3>

  <div class="row">
    <ds-w3w
      address="static.island.bay"
      [copyable]="false" />
  </div>
</docs-section>
