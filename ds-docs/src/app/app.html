<ds-app-layout
  #layout
  railLabel="Navigation"
  [restoreScroll]="true"
  [(railOpen)]="navOpen"
>
  <div
    sidenav
    class="side"
  >
    <app-sidebar (navigated)="navOpen.set(false)"></app-sidebar>
  </div>

  <header
    topbar
    class="mob-bar"
  >
    <ds-topbar>
      <span
        title
        class="mob-brand"
      >
        <ds-icon-button
          variant="standard"
          icon="menu"
          ariaLabel="Open navigation"
          [ariaExpanded]="layout.railOverlay() ? layout.railOpen() : null"
          [ariaControls]="layout.railOverlay() ? layout.railId : null"
          (pressed)="navOpen.set(!navOpen())"
        />

        <span class="mob-name">Design System</span>
      </span>

      <span actions>
        <ds-button
          color="neutral"
          variant="ghost"
          size="sm"
          (pressed)="tweaks.openPanel()"
        >
          ⚙ Tweaks
        </ds-button>
      </span>
    </ds-topbar>
  </header>

  <router-outlet></router-outlet>
</ds-app-layout>

<tweaks-panel #tweaks></tweaks-panel>
