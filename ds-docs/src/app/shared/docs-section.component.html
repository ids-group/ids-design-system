<section
  class="section"
  [id]="'section-' + anchor()"
  [attr.data-anchor]="anchor()">
  <div class="eyebrow t-overline">
    {{ eyebrow() }}
  </div>

  <h2 class="t-h2">
    {{ title() }}
  </h2>

  <!-- `data-key` is unused by the docs site. It is what lets a Claude Design card keep the chip of
       the component it is ABOUT and drop the chapter's: a ToggleButton card used to open with
       Button's name and tag. -->
  @if (metaKeys().length) {
    <details class="editor tagrow">
      <summary>
        {{ metaKeys().length > 1 ? 'Selectors' : 'Selector' }}
      </summary>

      <div class="body">
        @for (key of metaKeys(); track key) {
          <docs-component-meta
            [key]="key"
            [attr.data-key]="key" />
        }
      </div>
    </details>
  }

  @for (summary of summaries(); track summary) {
    <p class="summary">
      {{ summary }}
    </p>
  }

  <p class="lede t-m">
    <ng-content select="[lede]" />
  </p>

  <ng-content />

  @for (name of serviceNames(); track name) {
    <docs-api-table [service]="name" />
  }
</section>
