<ds-button
  type="submit"
  [disabled]="saving()"
  [loading]="saving()">
  Save
</ds-button>

<ds-button
  [loading]="exporting()"
  (click)="export()">
  Export
</ds-button>

<ds-button
  color="error"
  [disabled]="deleting() || saving()"
  [loading]="deleting()"
  (pressed)="remove()">
  Delete
</ds-button>
