<div
  class="col"
  role="listbox"
  aria-label="Hours"
>
  @for (cell of hourCells(); track cell.value; let i = $index) {
    <button
      #hourOpt
      type="button"
      role="option"
      class="opt"
      [class.is-selected]="cell.selected"
      [attr.aria-selected]="cell.selected"
      [attr.tabindex]="i === hourEntry() ? 0 : -1"
      [disabled]="cell.disabled"
      (click)="selectHour(cell)"
      (keydown)="onKey($event, 'hours', i)"
    >
      {{ cell.label }}
    </button>
  }
</div>

  <div

    role="listbox"
    aria-label="AM/PM"

        [attr.tabindex]="i === periodEntry() ? 0 : -1"

        (click)="selectPeriod(cell)"
        (keydown)="onKey($event, 'period', i)"
      >
        {{ cell.label }}
      </button>
    }
  </div>
}
