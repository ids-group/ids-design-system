<div class="stat">
  <div class="label">{{ label() }}</div>
  <div class="value">{{ value() }}{{ unit() }}</div>
  @if (delta() !== null) {
    <div [class]="deltaClasses()">
      @if (deltaIcon(); as icon) {
        <ds-icon [name]="icon" [size]="12"></ds-icon>
      }
      <span>{{ deltaText() }}</span>
    </div>
  } @else if (caption()) {
    <div class="caption">{{ caption() }}</div>
  }
</div>
