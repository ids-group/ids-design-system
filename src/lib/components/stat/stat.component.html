<div class="stat">
  <div
    class="label"
    dsTooltipWhenClipped>
    {{ label() }}
  </div>

  <div
    class="value"
    dsTooltipWhenClipped>
    <ng-content select="[dsStatValue]">{{ value() }}{{ unit() }}</ng-content>
  </div>

  @if (delta() !== null) {
    <div [class]="deltaClasses()">
      @if (deltaIcon(); as icon) {
        <ds-icon
          [name]="icon"
          [size]="12">
        </ds-icon>
      }

      <ng-content select="[delta]">{{ deltaText() }}</ng-content>
    </div>
  } @else if (caption()) {
    <div class="caption">
      {{ caption() }}
    </div>
  }
</div>
