<button
  type="button"
  class="head"
  [id]="headId"
  [attr.aria-expanded]="expanded()"
  [attr.aria-controls]="bodyId"
  (click)="toggle()"
>
  <span>{{ title() }}</span>
  <ng-content select="[badge]"></ng-content>
  <ds-icon name="chevronRight" class="chev" [size]="16" />
</button>
@if (expanded()) {
  <div class="body" role="region" [id]="bodyId" [attr.aria-labelledby]="headId">
    <ng-content></ng-content>
  </div>
}
