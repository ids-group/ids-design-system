<ul [class]="'rules cols-' + columns()">
  @for (row of rows(); track row.label) {
    <li
      class="rule {{ row.state }}"
      role="listitem"
    >
      <ds-icon
        [name]="row.icon"
        [size]="14"
      />

      <span class="label">
        {{ row.label }}
      </span>
    </li>
  }
</ul>
