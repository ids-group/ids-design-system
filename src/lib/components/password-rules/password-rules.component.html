<!-- role="list" on the <ul> itself: `list-style: none` plus a flex/grid display
     strips list semantics in WebKit, so the native role cannot be relied on.
     aria-live="polite" so a rule turning met is announced as the reader types,
     without interrupting them mid-word. -->
<ul
  role="list"
  aria-live="polite"
  [id]="listId()"
  [class]="'rules cols-' + columns()">
  @for (row of rows(); track row.label) {
    <li class="rule {{ row.state }}">
      <ds-icon
        [name]="row.icon"
        [size]="14" />

      <span class="label">
        {{ row.label }}
      </span>

      <span class="visually-hidden">
        — {{ row.announced }}
      </span>
    </li>
  }
</ul>
