<!-- role="list" on the <ul> itself: `list-style: none` with a flex/grid display strips list semantics in WebKit. aria-live="polite" announces a rule turning met without interrupting mid-word. -->
<ul
  role="list"
  aria-live="polite"
  [id]="listId()"
  [class]="'rules cols-' + columns()">
  @for (row of rows(); track row.label) {
    <li class="rule {{ row.state }}">
      <ds-icon
        [name]="row.icon"
        [size]="14" />

      <span class="label">
        {{ row.label }}
      </span>

      <span class="visually-hidden"> — {{ row.announced }} </span>
    </li>
  }
</ul>
