<!-- Explicit role="list": `list-style: none` with a flex/grid display strips list semantics in WebKit. -->
<ul
  role="list"
  aria-live="polite"
  [id]="listId()"
  [class]="'rules cols-' + columns()">
  @for (row of rows(); track row.label) {
    <li class="rule {{ row.state }}">
      <ds-icon
        [name]="row.icon"
        [size]="14" />

      <span class="label">
        {{ row.label }}
      </span>

      <span class="visually-hidden">
        — {{ row.announced }}
      </span>
    </li>
  }
</ul>
