<!-- The error variant is a separate branch so it mounts as a FRESH node with
     role="alert" already set — screen readers reliably announce a live region
     on insertion, but not when role="alert" is toggled onto an existing node. -->
@if (text()) {
  @if (state() === 'error') {
    <span
      class="field-message error"
      role="alert"
      [id]="messageId()">
      @if (iconResolved(); as glyph) {
        <ds-icon
          class="message-icon"
          [name]="glyph"
          [size]="14" />
      }
      {{ text() }}
    </span>
  } @else {
    <span
      class="field-message {{ state() }}"
      [id]="messageId()">
      @if (iconResolved(); as glyph) {
        <ds-icon
          class="message-icon"
          [name]="glyph"
          [size]="14" />
      }
      {{ text() }}
    </span>
  }
} @else if (reserve()) {
  <span
    class="field-message reserve-placeholder"
    aria-hidden="true">
  </span>
}
