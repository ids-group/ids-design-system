<!-- Error is a separate branch so it mounts as a fresh node with role="alert" already set; screen
     readers announce a live region on insertion, not when the role is toggled onto an existing node. -->
@if (text()) {
  @if (state() === 'error') {
    <span
      class="field-message error"
      role="alert"
      [id]="messageId()">
      @if (iconResolved(); as glyph) {
        <ds-icon
          class="message-icon"
          [name]="glyph"
          [size]="14" />
      }
      {{ text() }}
      <ng-container [ngTemplateOutlet]="changedMark" />
    </span>
  } @else {
    <span
      class="field-message {{ state() }}"
      [id]="messageId()">
      @if (iconResolved(); as glyph) {
        <ds-icon
          class="message-icon"
          [name]="glyph"
          [size]="14" />
      }
      {{ text() }}
      <ng-container [ngTemplateOutlet]="changedMark" />
    </span>
  }
} @else if (changed()) {
  <span
    class="field-message changed-only"
    [id]="messageId()">
    <ng-container [ngTemplateOutlet]="changedMark" />
  </span>
} @else if (reserve()) {
  <span
    class="field-message reserve-placeholder"
    aria-hidden="true">
  </span>
}

<ng-template #changedMark>
  @if (changed()) {
    <span class="changed">
      {{ changedText() }}
    </span>
  }
</ng-template>
