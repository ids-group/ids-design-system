@if (label()) {
  <span class="label">
    {{ label() }}
    <ds-field-status
      [pending]="pendingShown()"
      [changed]="changedShown()" />
  </span>
}

<div class="track">
  @for (option of options(); track option.value; let i = $index) {
    <button
      #seg
      type="button"
      role="radio"
      class="segment"
      [class.selected]="option.value === value()"
      [attr.aria-checked]="option.value === value()"
      [attr.tabindex]="option.value === focusableValue() ? 0 : -1"
      [disabled]="option.disabled || isDisabled()"
      (click)="select(option)"
      (keydown)="onKeydown($event, i)"
      (blur)="markTouched()">
      @if (option.icon; as icon) {
        <ds-icon
          [name]="icon"
          [size]="16" />
      }

      <span class="seg-label">
        {{ option.label }}
      </span>
    </button>
  }
</div>

@if (!label()) {
  <ds-field-status
    [pending]="pendingShown()"
    [changed]="changedShown()" />
}

<ds-field-message
  [icon]="messageIcon()"
  [text]="message().text"
  [state]="message().state"
  [messageId]="hintId()"
  [reserve]="reserveMessageResolved()"
  [changed]="changedShown()" />
