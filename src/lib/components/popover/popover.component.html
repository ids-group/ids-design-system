<!-- Projected content is captured once and stamped into the active render site; duplicating ng-content across branches breaks projection. -->
<ng-template #content>
  <ng-content />
</ng-template>

@if (preview.staticPreview()) {
  <div
    class="popover"
    [attr.role]="panelRole()"
    [attr.aria-label]="panelLabel()"
    [class.has-arrow]="arrow()"
    [attr.data-placement]="arrow() ? placement() : null">
    @if (arrow()) {
      <span class="arrow"></span>
    }

    <ng-container [ngTemplateOutlet]="content" />
  </div>
}

<ng-template #panel>
  <div
    class="popover"
    [attr.id]="panelId"
    [attr.role]="panelRole()"
    [attr.aria-label]="panelLabel()"
    [class.has-arrow]="arrow()"
    [attr.data-placement]="arrow() ? resolvedPlacement() : null"
    [cdkTrapFocus]="!!panelRole()">
    @if (arrow()) {
      <span class="arrow"></span>
    }

    <ng-container [ngTemplateOutlet]="content" />
  </div>
</ng-template>
