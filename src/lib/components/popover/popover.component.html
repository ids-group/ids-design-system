<!-- Projected content is captured ONCE here and stamped into whichever render
     site is active — duplicating ng-content across branches breaks projection. -->
<ng-template #content><ng-content /></ng-template>

@if (preview.staticPreview()) {
  <div
    class="popover"
    [attr.role]="panelRole()"
    [attr.aria-label]="panelLabel()"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </div>
}

<ng-template #panel>
  <div
    class="popover"
    [attr.role]="panelRole()"
    [attr.aria-label]="panelLabel()"
    [cdkTrapFocus]="!!panelRole()"
    [cdkTrapFocusAutoCapture]="!!panelRole()"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </div>
</ng-template>
