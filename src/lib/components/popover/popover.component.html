@if (preview.staticPreview()) {
  <div
    class="popover"
    [attr.role]="panelRole()"
    [attr.aria-label]="panelLabel()"
  >
    <ng-content></ng-content>
  </div>
} @else {
  <ng-template #panel>
    <div
      class="popover"
      [attr.role]="panelRole()"
      [attr.aria-label]="panelLabel()"
      [cdkTrapFocus]="!!panelRole()"
      [cdkTrapFocusAutoCapture]="!!panelRole()"
    >
      <ng-content></ng-content>
    </div>
  </ng-template>
}
