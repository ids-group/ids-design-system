<div
  role="tablist"
  [class]="tablistClasses()"
  [attr.aria-orientation]="orientation()">
  @for (tab of tabs(); track $index) {
    <button
      type="button"
      role="tab"
      [id]="tabId($index)"
      [class]="tabClasses($index, tab.disabled())"
      [attr.aria-selected]="$index === selectedIndex()"
      [attr.aria-controls]="panelId($index)"
      [attr.tabindex]="$index === selectedIndex() ? 0 : -1"
      [disabled]="tab.disabled()"
      (click)="select($index, tab.disabled())"
      (keydown)="onKeydown($event, $index)">
      @if (tab.icon()) {
        <ds-icon
          [name]="tab.icon()!"
          [size]="14">
        </ds-icon>
      }

      <span>
        {{ tab.label() }}
      </span>

      @if (tab.count() !== null) {
        <span class="badge neutral count">
          {{ tab.count() }}
        </span>
      }

      @if (closable()) {
        <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- mouse affordance; keyboard closes the focused tab via Delete (see onKeydown) -->
        <span
          class="tab-close"
          [attr.aria-label]="'Close ' + tab.label()"
          (click)="onCloseClick($event, $index)">
          <ds-icon
            name="x"
            [size]="12">
          </ds-icon>
        </span>
      }
    </button>
  }
</div>

@for (tab of tabs(); track $index) {
  @if (isPanelVisible($index)) {
    <div
      class="panel"
      role="tabpanel"
      tabindex="0"
      [id]="panelId($index)"
      [attr.aria-labelledby]="tabId($index)"
      [hidden]="$index !== selectedIndex()">
      <ng-container *ngTemplateOutlet="tab.content()"></ng-container>
    </div>
  }
}
