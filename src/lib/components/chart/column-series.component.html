<svg:g
  class="columns"
  [class.dims-others]="dimOthers()"
  [class.is-dimmed]="dimmedBySeries()"
  [style.--_column-chart-column-share]="markWidthPx()"
  [style.--_column-chart-slot-step]="slotStepPx()"
  [style.--_column-slot]="slot()"
  [style.--_column-slots]="slotCount()"
  (pointerover)="onMarkOver($event)"
  (pointerout)="onMarkOut($event)"
  (focusin)="onMarkFocus($event)"
  (focusout)="onMarkBlur($event)"
  (keydown)="onMarkKey($event)"
  (click)="onMarkClick($event)">
  <!-- `userSpaceOnUse`, so the stripe pitch is the same on a tall column and a short one: with the
       default object bounding box it would scale with each mark and read as a different texture
       per bar. -->
  <svg:defs>
    <svg:pattern
      class="hatch"
      patternUnits="userSpaceOnUse"
      width="8"
      height="8"
      patternTransform="rotate(45)"
      [attr.id]="hatchId">
      <svg:rect
        class="hatch-ground"
        width="8"
        height="8" />

      <svg:line
        class="hatch-stripe"
        x1="0"
        y1="0"
        x2="0"
        y2="8" />
    </svg:pattern>
  </svg:defs>

  @for (mark of marks(); track mark.key; let index = $index) {
    <svg:g
      class="column"
      [class.interactive]="interactive()"
      [class.below-baseline]="mark.below"
      [class.is-pinned]="activeMark.pinned() && activeMark.index() === index"
      [style.--_chart-mark-stagger]="markStagger(index)"
      [style.--_column-mark-height]="mark.height + 'px'"
      [style.--_column-baseline-y]="mark.baseline + 'px'"
      [style.--_column-x]="mark.x + 'px'"
      [attr.data-mark-index]="index"
      [attr.role]="interactive() ? 'button' : null"
      [attr.tabindex]="
        interactive() ? (index === roving.tabStop() ? 0 : -1) : null
      "
      [attr.aria-label]="interactive() ? entryLabel(mark) : null"
      (animate.leave)="leaveMark($event)">
      <!-- The box that catches the pointer is the whole category slot, not the drawn column: a
           column two pixels tall is otherwise unreachable, and a pointer that has to find the
           mark is a pointer that misses it. -->
      @let hit = hitBox(mark);

      <svg:rect
        class="hit-area"
        [attr.y]="hit.y"
        [attr.height]="hit.height" />

      <svg:g
        class="bar"
        [style.transform-origin]="mark.origin">
        <!-- Under the capped rect, not beside it: `rx` rounds all four corners, and the cap
             belongs on the free end alone. This one fills the two corners at the baseline back
             in, and both keep `y` and `height` a plain interpolable length, which a `<path>`
             would not. -->
        <svg:rect
          class="bar-base"
          [attr.fill]="mark.color" />

        <svg:rect
          class="bar-cap"
          [attr.y]="mark.top"
          [attr.height]="mark.height"
          [attr.fill]="mark.color" />

        <!-- Stripes OVER the painted mark, not a pattern in place of its fill: a pattern carries
             its own colour, so one shared definition cannot take each mark's. Painting the surface
             colour through it leaves the mark's own hue showing between the stripes. -->
        @if (mark.hatched) {
          <svg:rect
            class="bar-hatch"
            [attr.y]="mark.top"
            [attr.height]="mark.height"
            [attr.fill]="'url(#' + hatchId + ')'" />
        }
      </svg:g>

      @if (showValues()) {
        <svg:text
          class="value"
          text-anchor="middle"
          [attr.y]="mark.labelY">
          {{ mark.formattedValue }}
        </svg:text>
      }

      @if (activeMark.pinned() && activeMark.index() === index) {
        <svg:g
          class="pin-marker"
          aria-hidden="true"
          [attr.transform]="'translate(0,' + mark.pinY + ')'">
          <svg:circle
            class="pin-disc"
            [attr.r]="pinDiscRadius" />

          <svg:svg
            class="pin-glyph"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            [attr.x]="pinGlyphOffset"
            [attr.y]="pinGlyphOffset"
            [attr.width]="pinGlyphSize"
            [attr.height]="pinGlyphSize"
            [innerHTML]="pinGlyph" />
        </svg:g>
      }
    </svg:g>
  }
</svg:g>
