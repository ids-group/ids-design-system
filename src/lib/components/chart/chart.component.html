<figure
  class="chart"
  dsChartStates
  morphGrowth="up"
  messageAxes
  [unpin]="drawsUnpin"
  [pinned]="cursorPinned()"
  [caption]="caption()"
  [error]="error()"
  [errorText]="errorTextResolved()"
  [pending]="(loading() && isEmpty()) || !renderReady()"
  [reloading]="loading()"
  [empty]="isEmpty()"
  [emptyText]="emptyTextResolved()"
  [skeleton]="skeleton"
  [body]="body"
  (release)="releaseCursor()">
</figure>

<ng-template #skeleton>
  <ds-chart-skeleton
    [count]="skeletonMarks()"
    [plotHeight]="plotHeight() + 'px'"
    [valueSpace]="valueSpace()"
    [axisGutter]="axisGutter()"
    [shimmer]="loading()" />
</ng-template>

<ng-template #body>
  <div
    class="plot"
    [attr.role]="interactive() ? 'group' : 'img'"
    [attr.aria-label]="accessibleName()"
    [dsChartTooltip]="tooltipContext()"
    [dsChartTooltipSwatches]="tooltipSwatchesResolved()"
    [dsChartTooltipExtraGap]="tooltipGap()"
    [dsChartTooltipPinned]="tooltipPinned()"
    [dsChartTooltipOrigin]="tooltipOrigin()"
    [dsChartTooltipTemplate]="tooltipTemplate()">
    <svg
      #canvasEl
      class="canvas"
      preserveAspectRatio="xMidYMid meet"
      [class.pins]="bandPins()"
      [class.selects-range]="selectRange()"
      [style.block-size.px]="viewHeight()"
      [attr.viewBox]="viewBox()">
      <rect
        class="plot-bg"
        [attr.x]="plot().left"
        [attr.y]="plot().top"
        [attr.width]="plot().width"
        [attr.height]="plot().height" />

      @if (secondaryPlot().top !== plot().top) {
        <rect
          class="plot-bg"
          [attr.x]="secondaryPlot().left"
          [attr.y]="secondaryPlot().top"
          [attr.width]="secondaryPlot().width"
          [attr.height]="secondaryPlot().height" />
      }

      @if (cursorBand(); as band) {
        <rect
          #cursorBandEl
          class="cursor-anchor"
          aria-hidden="true"
          [class.on-reading]="readingY() !== null"
          [style.--_reading-y.px]="readingY()"
          [attr.x]="band.x"
          [attr.y]="band.top"
          [attr.width]="band.width"
          [attr.height]="band.bottom - band.top" />
      }

      @if (highlightBand(); as band) {
        <g
          class="cursor"
          aria-hidden="true"
          dsChartPlaced
          animate.enter="cursor-in"
          animate.leave="cursor-out"
          [style.transform]="'translateX(' + band.x + 'px)'">
          <rect
            class="category-band"
            [attr.y]="band.top"
            [attr.width]="band.width"
            [attr.height]="band.bottom - band.top" />

          <line
            class="cursor-line"
            [attr.x1]="band.width / 2"
            [attr.x2]="band.width / 2"
            [attr.y1]="band.top"
            [attr.y2]="band.bottom" />
        </g>
      }

      @if (
          pinnedLine() &&
          cursorPinned() &&
          cursorBand(); as band
        ) {
        <line
          class="cursor-line pinned-line"
          aria-hidden="true"
          dsChartPlaced
          animate.enter="cursor-in"
          animate.leave="cursor-out"
          [style.transform]="'translateX(' + (band.x + band.width / 2) + 'px)'"
          [attr.y1]="band.top"
          [attr.y2]="band.bottom" />
      }

      <!-- Not on the svg: an aria-hidden ancestor leaves a focusable projected mark
           reachable by Tab yet invisible to a reader. -->
      <g
        class="axes"
        aria-hidden="true">
        @for (tick of ticks(); track tick.value) {
          <line
            class="grid-line"
            [attr.x1]="plot().left"
            [attr.x2]="plotRight()"
            [style.transform]="'translateY(' + tick.y + 'px)'" />
        }

        <line
          class="axis-line"
          [attr.x1]="plot().left"
          [attr.x2]="plotRight()"
          [attr.y1]="plotBottom()"
          [attr.y2]="plotBottom()" />

        <line
          class="axis-line"
          [attr.x1]="plot().left"
          [attr.x2]="plot().left"
          [attr.y1]="plot().top"
          [attr.y2]="plotBottom()" />

        @if (showSecondaryGridlines()) {
          @for (tick of secondaryTicks(); track tick.value) {
            <line
              class="grid-line is-secondary"
              [attr.x1]="plot().left"
              [attr.x2]="plotRight()"
              [style.transform]="'translateY(' + tick.y + 'px)'" />
          }
        }

        @if (stacked()) {
          <line
            class="axis-line"
            [attr.x1]="plot().left"
            [attr.x2]="plotRight()"
            [attr.y1]="secondaryPlotBottom()"
            [attr.y2]="secondaryPlotBottom()" />

          <line
            class="axis-line"
            [attr.x1]="plot().left"
            [attr.x2]="plot().left"
            [attr.y1]="secondaryPlot().top"
            [attr.y2]="secondaryPlotBottom()" />
        }

        @if (reachesBelowZero()) {
          <line
            class="zero-line"
            [attr.x1]="plot().left"
            [attr.x2]="plotRight()"
            [attr.y1]="zeroOffset()"
            [attr.y2]="zeroOffset()" />
        }
      </g>

      @if (rangeBand(); as range) {
        <rect
          class="range-band"
          aria-hidden="true"
          dsChartPlaced
          animate.enter="cursor-in"
          animate.leave="cursor-out"
          [attr.x]="range.x"
          [attr.y]="range.top"
          [attr.width]="range.width"
          [attr.height]="range.height" />
      }

      @if (shownReadout(); as readout) {
        <g
          class="readout"
          aria-hidden="true"
          dsChartPlaced
          animate.enter="cursor-in"
          animate.leave="cursor-out"
          [style.transform]="'translateY(' + readout.y + 'px)'">
          <line
            class="readout-guide"
            [attr.x1]="readout.x1"
            [attr.x2]="readout.x2" />
        </g>
      }

      <!-- Two slots so a reference line paints under the marks in any source order. Both stay
           inside `.marks`, which the boot transition guard is keyed on. -->
      <g class="marks">
        <ng-content select="[dsReferenceLine]" />

        <ng-content />
      </g>

      <!-- After the marks, so a stop's ring paints over them. -->
      @if (keyboardStops()) {
        <g
          class="category-stops"
          (keydown)="onStopKey($event)">
          @for (stop of categoryStops(); track stop.index) {
            <rect
              class="category-stop"
              [attr.data-category-index]="stop.index"
              [attr.x]="stop.x"
              [attr.y]="plot().top"
              [attr.width]="stop.width"
              [attr.height]="plot().height"
              [attr.tabindex]="stop.index === focusedCategory() ? 0 : -1"
              [attr.aria-label]="stopLabel(stop.index)"
              (focus)="onStopFocus(stop.index, $event)"
              (blur)="onStopBlur($event)" />
          }

          <!-- One ring for every stop, so focus glides to the next category with the panel. -->
          <rect
            class="stop-ring"
            aria-hidden="true"
            dsChartPlaced
            [attr.y]="plot().top"
            [attr.width]="bandWidth()"
            [attr.height]="plot().height"
            [style.transform]="'translateX(' + focusedStopX() + 'px)'" />
        </g>
      }

      <g
        class="labels"
        aria-hidden="true">
        @if (axisLabel()) {
          <text
            class="axis-title"
            text-anchor="middle"
            [style.fill]="axisLabelFill()"
            [attr.transform]="
              'rotate(-90 ' +
              axisTitleX() +
              ' ' +
              (plot().top + plot().height / 2) +
              ')'
            "
            [attr.x]="axisTitleX()"
            [attr.y]="plot().top + plot().height / 2">
            {{ axisLabel() }}
          </text>
        }

        @if (secondaryAxisLabel() && hasSecondaryAxis()) {
          <text
            class="axis-title"
            text-anchor="middle"
            [style.fill]="secondaryAxisLabelFill()"
            [attr.transform]="
              'rotate(90 ' +
              secondaryTitleX() +
              ' ' +
              (plot().top + plot().height / 2) +
              ')'
            "
            [attr.x]="secondaryTitleX()"
            [attr.y]="plot().top + plot().height / 2">
            {{ secondaryAxisLabel() }}
          </text>
        }

        @for (tick of ticks(); track tick.value) {
          <text
            class="axis-label is-primary"
            text-anchor="end"
            [style.fill]="axisLabelFill()"
            [attr.x]="axisLabelX()"
            [style.transform]="'translateY(' + tick.y + 'px)'">
            {{ tick.label }}
          </text>
        }

        @for (tick of secondaryTicks(); track tick.value) {
          <text
            class="axis-label is-secondary"
            [style.fill]="secondaryAxisLabelFill()"
            [attr.text-anchor]="secondaryLabelAnchor()"
            [attr.x]="secondaryLabelX()"
            [style.transform]="'translateY(' + tick.y + 'px)'">
            {{ tick.label }}
          </text>
        }

        <!-- Keyed by category and placed by `transform`, so a label glides with its column when
             another category comes or goes. -->
        @for (label of categoryLabels(); track label.key) {
          <text
            class="category-label"
            [class.is-hot]="label.index === hotCategory()"
            [class.is-rotated]="categoryLabelsRotated()"
            [attr.text-anchor]="categoryLabelsRotated() ? 'end' : 'middle'"
            [style.transform]="
              'translate(' +
              label.x +
              'px, ' +
              categoryLabelY() +
              'px)' +
              (categoryLabelsRotated() ? ' rotate(-45deg)' : '')
            "
            (animate.leave)="leaveMark($event)"
            (pointerenter)="onCategoryLabelEnter(label.index, $event)"
            (pointerleave)="onCategoryLabelLeave()">
            {{ label.text }}
          </text>
        }

        <!-- Over the marks so an annotation's name survives a column drawn through it. -->
        <ng-content select="[dsReferenceLabel], [dsSeriesAnnotation]" />
      </g>

      <!-- Over the tick labels it covers; its guide stays under the marks. -->
      @if (shownReadout(); as readout) {
        <g
          class="readout"
          aria-hidden="true"
          dsChartPlaced
          animate.enter="cursor-in"
          animate.leave="cursor-out"
          [style.transform]="'translateY(' + readout.y + 'px)'">
          <rect
            class="pill"
            [attr.x]="readout.pillX"
            [attr.width]="readout.pillWidth" />

          <text
            class="readout-text pill-text"
            text-anchor="middle"
            [attr.x]="readout.pillX + readout.pillWidth / 2">
            {{ readout.label }}
          </text>
        </g>
      }

      @if (rangeBand(); as range) {
        <g
          class="range-pill"
          aria-hidden="true"
          animate.enter="cursor-in"
          animate.leave="cursor-out"
          [style.transform]="
            'translate(' + range.pillX + 'px, ' + range.pillY + 'px)'
          ">
          <rect
            class="pill"
            [attr.x]="-range.pillWidth / 2"
            [attr.width]="range.pillWidth" />

          <text
            class="range-text pill-text"
            text-anchor="middle">
            {{ range.label }}
          </text>
        </g>
      }

      <!-- Keyed by category: another category takes a new pin that pops in; the same one glides with the data. -->
      @for (pinnedCategory of pinnedCategories(); track pinnedCategory) {
        @if (cursorBand(); as band) {
          <g
            class="band-pin"
            [style.transform]="
              'translateX(' + (band.x + band.width / 2) + 'px)'
            ">
            <g
              dsChartPinMarker
              [attr.transform]="'translate(0,' + bandPinY() + ')'">
            </g>
          </g>
        }
      }
    </svg>
  </div>
</ng-template>
