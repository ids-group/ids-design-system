<figure class="line-chart">
  @if (pinnedCategory()) {
    <button
      class="pin-reset"
      type="button"
      (click)="releaseCategoryPin()">
      Unpin
    </button>
  }

  @if (caption()) {
    <figcaption>
      {{ caption() }}
    </figcaption>
  }

  @if (error()) {
    <p
      class="empty is-error"
      role="status">
      {{ errorTextResolved() }}
    </p>
  } @else if (loading()) {
    <div
      class="skeleton"
      aria-hidden="true">
      <ds-skeleton height="var(--_line-chart-plot-height)" />

      @if (skeletonSeries().length > 1) {
        <div class="skeleton-legend">
          @for (placeholder of skeletonSeries(); track $index) {
            <ds-skeleton
              width="var(--space-16)"
              height="var(--space-3)" />
          }
        </div>
      }
    </div>
  } @else if (isEmpty()) {
    <p class="empty">
      {{ emptyTextResolved() }}
    </p>
  } @else if (noVisibleSeries()) {
    <p
      class="empty"
      role="status">
      {{ noVisibleSeriesText() }}
    </p>

    <ds-chart-legend
      [items]="legendItems()"
      [toggleable]="legendFilters()"
      [mode]="legendMode()"
      [(hidden)]="hiddenSeries"
      [(highlighted)]="highlightedSeries" />
  } @else {
    <ds-chart
      frame="none"
      cursor="category"
      [categories]="categories()"
      [tickCount]="tickCount()"
      [valueFormat]="axisFormat()"
      [interactive]="interactive()"
      [summary]="accessibleName()"
      [max]="axisMax()"
      [maxSecondary]="axisMaxSecondary()"
      [secondaryAxisMode]="yAxisMode()"
      [axisLabel]="yAxisLabel()"
      [secondaryAxisLabel]="secondaryAxisLabel()"
      [axisColor]="primaryAxisFill()"
      [secondaryAxisColor]="secondaryAxisFill()"
      [cursorPin]="pinOnClick()"
      [tooltipLingerMs]="tooltipLingerMs()"
      [plotHeight]="plotHeight()">
      <svg:g
        #mark="dsLineSeries"
        dsLineSeries
        [data]="markSeries()"
        [showMarkers]="showMarkers()"
        [interactive]="interactive()"
        [pinOnClick]="pinOnClick()"
        [dimOthers]="dimOthers()"
        [highlighted]="highlightedSeries()"
        [patterns]="dashPatterns()"
        [stacked]="stacksSeries()"
        [staggerMs]="staggerMs()"
        [gaps]="gaps()"
        [curve]="curve()"
        [tooltip]="tooltip()"
        [tooltipAnchor]="markAnchor()"
        [tooltipLingerMs]="tooltipLingerResolved()"
        [valueFormat]="valueFormatResolved()"
        [dsChartTooltip]="mark.tooltipContext()"
        [dsChartTooltipPreferBelow]="
          pinnedCategory() || mark.activeMark.pinned()
        "
        [dsChartTooltipOrigin]="mark.tooltipOrigin()"
        [dsChartTooltipTemplate]="tooltipTemplate() ?? null"
        (pointClicked)="onPointClicked($event)" />

      <svg:g
        dsSeriesAnnotation
        [annotations]="markAnnotations()" />
    </ds-chart>

    @if (showLegend()) {
      <ds-chart-legend
        [items]="legendItems()"
        [toggleable]="legendFilters()"
        [mode]="legendMode()"
        [(hidden)]="hiddenSeries"
        [(highlighted)]="highlightedSeries" />
    }

    @if (dataTableResolved() !== 'none') {
      <ds-chart-data-table
        [columns]="dataTableColumns()"
        [rows]="dataTableRows()"
        [caption]="caption()"
        [open]="dataTableResolved() === 'visible'" />
    }
  }
</figure>
