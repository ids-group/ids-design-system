<figure
  class="line-chart"
  dsChartStates
  messageAxes
  [pinned]="pinnedCategory()"
  [caption]="caption()"
  [error]="error()"
  [errorText]="errorTextResolved()"
  [pending]="(loading() && isEmpty()) || !renderReady()"
  [reloading]="loading()"
  [dataTable]="dataTableResolved() !== 'none'"
  [shimmer]="loading()"
  [empty]="isEmpty()"
  [emptyText]="emptyTextResolved()"
  [skeleton]="skeleton"
  [body]="body"
  (release)="releaseCategoryPin()">
</figure>

<ng-template #skeleton>
  <div
    class="skeleton"
    aria-hidden="true">
    <ds-chart-skeleton
      marks="line"
      [plotHeight]="skeletonPlotHeight"
      [count]="skeletonPoints()"
      [valueSpace]="skeletonValueSpace"
      [axisGutter]="skeletonAxisGutter"
      [shimmer]="loading()" />

    @if (skeletonSeries().length > 1) {
      <div class="skeleton-legend">
        @for (placeholder of skeletonSeries(); track $index) {
          <ds-skeleton
            width="var(--space-16)"
            height="var(--space-3)"
            [shimmer]="loading()" />
        }
      </div>
    }
  </div>
</ng-template>

<ng-template #body>
  @if (noVisibleSeries()) {
    <p
      class="empty"
      role="status">
      {{ noVisibleSeriesTextResolved() }}
    </p>

    <ds-chart-legend
      [items]="legendItems()"
      [toggleable]="legendFilters()"
      [mode]="legendMode()"
      [(hidden)]="hiddenSeries"
      [(highlighted)]="highlightedSeries" />
  } @else {
    <ds-chart
      frame="none"
      [cursor]="plotCursor()"
      [tooltipSwatches]="tooltipSwatches()"
      [tooltipTemplate]="tooltipTemplate() ?? null"
      [categories]="categories()"
      [tickCount]="tickCount()"
      [valueFormat]="axisFormat()"
      [interactive]="interactive()"
      [selectRange]="selectRange()"
      [summary]="accessibleName()"
      [max]="axisMax()"
      [maxSecondary]="axisMaxSecondary()"
      [secondaryAxisMode]="yAxisMode()"
      [axisLabel]="yAxisLabel()"
      [secondaryAxisLabel]="secondaryAxisLabel()"
      [axisColor]="primaryAxisFill()"
      [secondaryAxisColor]="secondaryAxisFill()"
      [pinOnClick]="pinOnClick()"
      [tooltipLingerMs]="tooltipLingerMs()"
      [plotHeight]="plotHeight()">
      <svg:g
        #mark="dsLineSeries"
        dsLineSeries
        [data]="markSeries()"
        [showMarkers]="showMarkers()"
        [outline]="outline()"
        [interactive]="interactive()"
        [pinOnClick]="pinOnClick()"
        [dimOthers]="dimOthers()"
        [highlighted]="highlightedSeries()"
        [patterns]="dashPatterns()"
        [showChange]="showChange()"
        [stacked]="stacksSeries()"
        [staggerMs]="staggerMs()"
        [gaps]="gaps()"
        [curve]="curve()"
        [tooltip]="tooltip()"
        [tooltipAnchor]="tooltipAnchor()"
        [tooltipLingerMs]="tooltipLingerResolved()"
        [valueFormat]="valueFormatResolved()"
        (pointClicked)="onPointClicked($event)" />

      @if (markAnnotations().length) {
        <svg:g
          dsSeriesAnnotation
          [annotations]="markAnnotations()" />
      }
    </ds-chart>

    @if (showLegend()) {
      <ds-chart-legend
        [items]="legendItems()"
        [toggleable]="legendFilters()"
        [mode]="legendMode()"
        [(hidden)]="hiddenSeries"
        [(highlighted)]="highlightedSeries" />
    }

    @if (dataTableResolved() !== 'none') {
      <ds-chart-data-table
        [columns]="dataTableColumns()"
        [rows]="dataTableRows()"
        [caption]="caption()"
        [open]="dataTableResolved() === 'visible'" />
    }
  }
</ng-template>
