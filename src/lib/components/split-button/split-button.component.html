<button
  type="button"
  class="main"
  [disabled]="disabled()"
  (click)="pressed.emit($event)"
>
  @if (icon(); as name) {
    <ds-icon
      [name]="name"
      [size]="18"
    />
  }

  @if (label()) {
    <span class="label">
      {{ label() }}
    </span>
  }

  <ng-content></ng-content>
</button>

<button
  #trigger
  type="button"
  class="toggle"
  aria-haspopup="menu"
  [class.open]="pop.opened()"
  [attr.aria-expanded]="pop.opened()"
  [attr.aria-label]="menuLabel()"
  [disabled]="disabled()"
  (click)="pop.toggle(trigger)"
  (keydown)="onTriggerKeydown($event, pop, trigger)"
>
  <ds-icon
    class="chevron"
    name="chevronDown"
    [size]="18"
  />
</button>

<ds-popover
  #pop
  align="end"
  panelRole="presentation"
>
  <ds-menu>
    @for (item of menuItems(); track item) {
      <ds-menu-item
        [icon]="item.icon ?? null"
        [disabled]="item.disabled ?? false"
        [error]="item.error ?? false"
        (pressed)="onItemSelect(item)"
      >
        {{ item.label }}
      </ds-menu-item>
    }
  </ds-menu>
</ds-popover>
