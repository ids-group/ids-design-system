<div
  class="node-col"
  aria-hidden="true">
  <span class="node">
    @if (status() === 'running') {
      <ds-spinner />
    } @else if (nodeIcon(); as name) {
      <ds-icon
        [name]="name"
        [size]="15" />
    }
  </span>

  <span class="spine"></span>
</div>

<div class="content">
  <div class="head">
    @if (statusLabel()) {
      <span class="visually-hidden">
        {{ statusLabel() }}:
      </span>
    }

    @if (heading()) {
      <span class="heading">
        {{ heading() }}
      </span>
    }

    <span class="trailing">
      <ng-content select="[trailing]"></ng-content>

      <button
        type="button"
        class="toggle"
        [attr.aria-label]="detailsLabel()"
        [attr.aria-expanded]="expanded()"
        [attr.aria-controls]="detailsId"
        (click)="toggle()">
        <ds-icon
          class="chev"
          name="chevronRight"
          [size]="16" />
      </button>
    </span>
  </div>

  <ng-content></ng-content>

  @if (time()) {
    <span class="time">
      {{ time() }}
    </span>
  }

  <div
    class="details"
    [id]="detailsId"
    [hidden]="!expanded()">
    <ng-content select="[details]"></ng-content>
  </div>
</div>
