<div [class]="fieldClass()">
  <span
    class="control-line"
    [class.is-disabled]="effectiveDisabled()"
  >
    <input
      #inputRef
      type="radio"
      class="radio"
      [checked]="isChecked()"
      [disabled]="effectiveDisabled()"
      [attr.name]="effectiveName() || null"
      [attr.value]="value() ?? null"
      [attr.id]="controlId()"
      [attr.tabindex]="tabIndexAttr"
      [attr.aria-invalid]="invalidResolved() ? 'true' : null"
      [attr.aria-describedby]="hintId()"
      [attr.aria-required]="required() ? 'true' : null"
      (change)="onSelect()"
    />

    @if (label()) {
      <label
        class="control-text"
        [attr.for]="controlId()"
      >
        {{ label() }}
        @if (required()) {
          <span
            class="req"
            aria-hidden="true"
          >
            *
          </span>
        }
      </label>
    }

    @if (devMode) {
      <span dsProjectionDropped="ds-radio">
        <ng-content></ng-content>
      </span>
    }
  </span>

  <ds-field-message
    [text]="message().text"
    [state]="message().state"
    [messageId]="hintId()"
    [reserve]="reserveMessageResolved()"
  />
</div>
