<div [class]="fieldClass()">
  <span
    class="control-line"
    [class.is-disabled]="effectiveDisabled()"
  >
    <input
      #inputRef
      type="radio"
      class="radio"
      [checked]="isChecked()"
      [disabled]="effectiveDisabled()"
      [attr.name]="effectiveName() || null"
      [attr.value]="value() ?? null"
      [attr.id]="controlId()"
      [attr.tabindex]="tabIndexAttr"
      [attr.aria-invalid]="invalidResolved() ? 'true' : null"
      [attr.aria-describedby]="hintId()"
      [attr.aria-required]="required() ? 'true' : null"
      (change)="onSelect()"
    />

    <label
      class="control-text"
      [attr.for]="controlId()"
    >
      @if (label()) {
        {{ label() }}
        @if (required()) {
          <span
            class="req"
            aria-hidden="true"
          >
            *
          </span>
        }
      } @else {
        <ng-content></ng-content>
      }
    </label>

  </span>

  <ds-field-message
    [icon]="messageIcon()"
    [text]="message().text"
    [state]="message().state"
    [messageId]="hintId()"
    [reserve]="reserveMessageResolved()"
  />
</div>
