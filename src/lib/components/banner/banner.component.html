<div
  #banner
  [class]="classes()">
  <ds-icon
    class="icon"
    [name]="icon() ?? defaultIcon()"
    [size]="20">
  </ds-icon>

  <div class="body">
    @if (title()) {
      <div class="title">
        {{ title() }}
      </div>
    }

    <!-- Wrapper lets `:empty` answer "is there a body?"; a bare projected text node is otherwise invisible to selectors. -->
    <span class="text">
      <ng-content></ng-content>
    </span>
  </div>

  <div class="actions">
    <ng-content select="[actions]"></ng-content>
  </div>

  @if (dismissible()) {
    <button
      class="close"
      type="button"
      [attr.aria-label]="intl().dialog.dismiss"
      (click)="onDismiss(banner)">
      <ds-icon
        name="x"
        [size]="16">
      </ds-icon>
    </button>
  }
</div>
