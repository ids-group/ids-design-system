@for (entry of visibleNodes(); track entry.node.id; let index = $index) {
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -- Enter and Space reach the host keydown handler, which activates the focused row -->
  <div
    class="row"
    role="treeitem"
    [attr.data-node-id]="entry.node.id"
    [attr.aria-level]="entry.level + 1"
    [attr.aria-expanded]="entry.hasChildren ? entry.expanded : null"
    [attr.aria-selected]="isSelected(entry.node.id)"
    [attr.aria-disabled]="entry.node.disabled ? 'true' : null"
    [attr.aria-labelledby]="idPrefix + '-' + index"
    [attr.aria-describedby]="
      trailing() ? idPrefix + '-' + index + '-trailing' : null
    "
    [attr.tabindex]="isActive(entry.node.id) ? 0 : -1"
    [class.selected]="isSelected(entry.node.id)"
    [style.--_level]="entry.level"
    (click)="onRowClick(entry, $event)"
    (focus)="onRowFocus(entry)"
    (pointerenter)="hover(entry.node)">
    @if (entry.hasChildren) {
      <ds-icon
        class="caret"
        [name]="entry.expanded ? 'chevronDown' : 'chevronRight'"
        [size]="16" />
    } @else if (!entry.node.icon) {
      <span class="caret-spacer"></span>
    }

    @if (entry.node.icon; as icon) {
      <ds-icon
        class="node-icon"
        [name]="icon"
        [size]="16" />
    }

    @if (label(); as label) {
      <span
        class="custom-label"
        [id]="idPrefix + '-' + index">
        <ng-container
          *ngTemplateOutlet="
            label.template;
            context: {
              $implicit: entry.node,
              node: entry.node,
              level: entry.level,
              selected: isSelected(entry.node.id),
              disabled: !!entry.node.disabled,
            }
          " />
      </span>
    } @else {
      <span
        class="label"
        [id]="idPrefix + '-' + index">
        {{ entry.node.label }}
      </span>
    }

    @if (trailing(); as trailing) {
      <span
        class="trailing"
        [id]="idPrefix + '-' + index + '-trailing'">
        <ng-container
          *ngTemplateOutlet="
            trailing.template;
            context: { $implicit: entry.node, node: entry.node }
          " />
      </span>
    }
  </div>
}
