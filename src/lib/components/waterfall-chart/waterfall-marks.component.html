<svg:g
  class="waterfall-marks"
  aria-hidden="true">
  @if (showConnectors()) {
    @for (connector of connectors(); track connector.key) {
      <svg:line
        class="connector"
        data-morph="hold"
        [attr.x1]="connector.x1"
        [attr.x2]="connector.x2"
        [style.transform]="'translateY(' + connector.y + 'px)'"
        [style.--_chart-mark-stagger]="connector.stagger"
        (animate.leave)="leaveMark($event)" />
    }
  }

  @if (showValues()) {
    @for (label of labels(); track label.key) {
      <svg:text
        class="value"
        data-morph="hold"
        text-anchor="middle"
        [style.transform]="'translate(' + label.x + 'px, ' + label.y + 'px)'"
        [style.--_chart-mark-stagger]="label.stagger"
        (animate.leave)="leaveMark($event)">
        {{ label.text }}
      </svg:text>
    }
  }
</svg:g>
