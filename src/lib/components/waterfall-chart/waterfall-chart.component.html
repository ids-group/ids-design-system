<figure class="waterfall-chart">
  @if (pinned()) {
    <button
      class="pin-reset"
      type="button"
      (click)="series()?.activeMark?.release()">
      {{ intl().chart.unpin }}
    </button>
  }

  @if (caption()) {
    <figcaption>
      {{ caption() }}
    </figcaption>
  }

  @if (error()) {
    <p
      class="empty is-error"
      role="status">
      {{ errorTextResolved() }}
    </p>
  } @else if (loading() || !renderReady()) {
    <div
      class="skeleton"
      aria-hidden="true">
      @for (placeholder of skeletonBars(); track $index) {
        <ds-skeleton
          height="var(--_waterfall-chart-skeleton-height)"
          [shimmer]="loading()" />
      }
    </div>
  } @else if (isEmpty()) {
    <p class="empty">
      {{ emptyTextResolved() }}
    </p>
  } @else {
    <ds-chart
      frame="none"
      [tooltipSwatches]="tooltipSwatches()"
      [categories]="categories()"
      [tickCount]="tickCount()"
      [valueFormat]="valueFormatResolved()"
      [interactive]="interactive()"
      [summary]="accessibleName()">
      <svg:g
        dsWaterfallMarks
        [steps]="steps()"
        [labelValues]="labelValues()"
        [showValues]="showValues()"
        [showConnectors]="showConnectors()"
        [staggerMs]="staggerMs()"
        [valueFormat]="valueFormatResolved()" />

      <svg:g
        dsColumnSeries
        showValues="false"
        soleSeries
        [data]="points()"
        [offsets]="offsets()"
        [interactive]="interactive()"
        [pinOnClick]="pinOnClick()"
        [staggerMs]="staggerMs()"
        [valueFormat]="valueFormatResolved()"
        (pointClicked)="onPointClicked($event)" />
    </ds-chart>

    @if (dataTableResolved() !== 'none') {
      <ds-chart-data-table
        [columns]="[
          intl().chart.stepColumn,
          intl().chart.directionColumn,
          intl().chart.valueColumn,
          intl().chart.runningTotalColumn,
        ]"
        [rows]="dataTableRows()"
        [caption]="caption()"
        [open]="dataTableResolved() === 'visible'" />
    }
  }
</figure>
