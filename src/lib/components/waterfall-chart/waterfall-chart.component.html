<figure
  class="waterfall-chart"
  dsChartStates
  morphGrowth="up"
  messageAxes
  [pinned]="pinned()"
  [caption]="caption()"
  [error]="error()"
  [errorText]="errorTextResolved()"
  [pending]="(loading() && isEmpty()) || !renderReady()"
  [reloading]="loading()"
  [dataTable]="dataTableResolved()"
  [shimmer]="loading()"
  [empty]="isEmpty()"
  [emptyText]="emptyTextResolved()"
  [skeleton]="skeleton"
  [body]="body"
  (release)="series()?.activeMark?.release()">
</figure>

<ng-template #skeleton>
  <ds-chart-skeleton
    marks="steps"
    plotHeight="240px"
    [count]="skeletonMarks()"
    [valueSpace]="skeletonValueSpace"
    [axisGutter]="skeletonAxisGutter"
    [shimmer]="loading()" />
</ng-template>

<ng-template #body>
  <ds-chart
    frame="none"
    [tooltipSwatches]="tooltipSwatches()"
    [categories]="categories()"
    [tickCount]="tickCount()"
    [valueFormat]="valueFormatResolved()"
    [interactive]="interactive()"
    [showAxisReadout]="showAxisReadout()"
    [summary]="accessibleName()">
    <svg:g
      dsWaterfallMarks
      [steps]="steps()"
      [labelValues]="labelValues()"
      [showValues]="showValues()"
      [showConnectors]="showConnectors()"
      [staggerMs]="staggerMs()"
      [valueFormat]="valueFormatResolved()" />

    <svg:g
      dsColumnSeries
      showValues="false"
      soleSeries
      runningTotal
      [data]="points()"
      [offsets]="offsets()"
      [interactive]="interactive()"
      [pinOnClick]="pinOnClick()"
      [dimOthers]="dimOthers()"
      [tooltip]="tooltip()"
      [tooltipLingerMs]="defaults.tooltipLingerMs()"
      [staggerMs]="staggerMs()"
      [valueFormat]="valueFormatResolved()"
      (pointClicked)="onPointClicked($event)" />
  </ds-chart>

  @if (dataTableResolved() !== 'none') {
    <ds-chart-data-table
      [columns]="[
        intl().chart.stepColumn,
        intl().chart.directionColumn,
        intl().chart.valueColumn,
        intl().chart.runningTotalColumn,
      ]"
      [rows]="dataTableRows()"
      [caption]="caption()"
      [open]="dataTableResolved() === 'visible'" />
  }
</ng-template>
