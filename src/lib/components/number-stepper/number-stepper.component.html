<div [class]="stepperClass()">
  <button
    type="button"
    class="step minus"
    [attr.aria-label]="intl().numberStepper.decrease"
    [disabled]="atMin() || disabled()"
    (click)="dec()">
    −
  </button>

  <input
    type="number"
    class="qty"
    [min]="min()"
    [max]="max() ?? undefined"
    [step]="step()"
    [value]="value()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    (input)="setRaw($any($event.target).value)" />

  <button
    type="button"
    class="step plus"
    [attr.aria-label]="intl().numberStepper.increase"
    [disabled]="atMax() || disabled()"
    (click)="inc()">
    +
  </button>
</div>
