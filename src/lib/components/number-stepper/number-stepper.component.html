<div [class]="stepperClass()">
  <button
    type="button"
    class="step minus"
    [disabled]="atMin() || disabled()"
    (click)="dec()"
  >
    −
  </button>

  <input
    type="number"
    class="qty"
    [min]="min()"
    [max]="max() ?? undefined"
    [value]="value()"
    [disabled]="disabled()"
    (input)="setRaw($any($event.target).value)"
  />

  <button
    type="button"
    class="step plus"
    [disabled]="atMax() || disabled()"
    (click)="inc()"
  >
    +
  </button>
</div>
