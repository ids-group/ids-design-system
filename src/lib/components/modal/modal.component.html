@if (rendered() || preview.staticPreview()) {
  <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -- backdrop; keyboard dismissal is (keydown.escape) below, a backdrop isn't a tabbable control -->
  <div
    [class]="preview.staticPreview() ? 'modal-static' : 'modal-backdrop'"
    [class.closing]="closing()"
    (pointerdown)="backdropPress.down($event)"
    (pointerup)="onBackdropRelease($event)"
    (keydown.escape)="onEscape()"
    (animationend)="onLeaveEnd($event)">
    <ds-modal-card
      [cdkTrapFocus]="!preview.staticPreview()"
      [cdkTrapFocusAutoCapture]="!preview.staticPreview()"
      [size]="size()"
      [status]="status()"
      [title]="title()"
      [subtitle]="subtitle()"
      [dividers]="dividersResolved()"
      (closed)="onClose()">
      <ng-container eyebrow>
        <ng-content select="[eyebrow]"></ng-content>
      </ng-container>

      <ng-container title-badge>
        <ng-content select="[title-badge]"></ng-content>
      </ng-container>

      <ng-container body>
        <ng-content select="[body]"></ng-content>

        <ng-content></ng-content>
      </ng-container>

      <ng-container impact>
        <ng-content select="[impact]"></ng-content>
      </ng-container>

      <ng-container actions>
        <ng-content select="[actions]"></ng-content>
      </ng-container>
    </ds-modal-card>
  </div>
}
