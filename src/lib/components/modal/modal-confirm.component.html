<ds-modal-card
  dialogRole="alertdialog"
  cdkTrapFocus
  [title]="options.title"
  [status]="tone === 'error' ? 'error' : null"
  [icon]="options.icon ?? null"
  [showClose]="false"
  [cdkTrapFocusAutoCapture]="true"
  [attr.aria-describedby]="options.message ? messageId : null">
  <ng-container body>
    @if (options.message) {
      <p
        class="message"
        [id]="messageId">
        {{ options.message }}
      </p>
    }

    @if (options.typeToConfirm; as phrase) {
      <label class="confirm-field">
        <span class="confirm-hint">
          {{ intl().dialog.typeToConfirmBefore }} <b>{{ phrase }}</b>
          {{ intl().dialog.typeToConfirmAfter }}
        </span>

        <input
          type="text"
          class="confirm-input"
          autocomplete="off"
          spellcheck="false"
          [value]="typed()"
          (input)="onType($event)" />
      </label>
    }
  </ng-container>

  <ng-container actions>
    <ds-button
      color="neutral"
      variant="outline"
      (pressed)="cancel()">
      {{ options.cancelLabel ?? intl().dialog.cancel }}
    </ds-button>

    <ds-button
      [color]="confirmColor"
      [disabled]="confirmDisabled()"
      (pressed)="confirm()">
      {{ options.confirmLabel ?? intl().dialog.confirm }}
    </ds-button>
  </ng-container>
</ds-modal-card>
