<div [class]="classes()">
  <div class="header">
    <h2 class="title">{{ title() }}</h2>
    @if (showClose()) {
      <button class="close" type="button" (click)="onClose()">
        <ds-icon name="x" [size]="16"></ds-icon>
      </button>
    }
  </div>
  <div class="body">
    <ng-content select="[body]"></ng-content>
    <div class="impact"><ng-content select="[impact]"></ng-content></div>
  </div>
  <div class="actions"><ng-content select="[actions]"></ng-content></div>
</div>
