<div
  aria-modal="true"
  [attr.role]="dialogRole()"
  [class]="classes()"
  [attr.aria-labelledby]="titleId"
>
  <div class="header">
    @if (icon(); as iconName) {
      <span
        class="icon-badge"
        [class.error]="error()"
      >
        <ds-icon
          [name]="iconName"
          [size]="20"
        />
      </span>
    }

    <div class="heading">
      <div class="eyebrow">
        <ng-content select="[eyebrow]"></ng-content>
      </div>

      <h2
        class="title"
        [id]="titleId"
      >
        {{ title() }}
      </h2>
    </div>

    @if (showClose()) {
      <button
        class="close"
        type="button"
        aria-label="Close dialog"
        (click)="onClose()"
      >
        <ds-icon
          name="x"
          [size]="16"
        >
        </ds-icon>
      </button>
    }
  </div>

  <div class="body">
    <ng-content select="[body]"></ng-content>

    <div class="impact">
      <ng-content select="[impact]"></ng-content>
    </div>
  </div>

  <div class="actions">
    <ng-content select="[actions]"></ng-content>
  </div>
</div>
