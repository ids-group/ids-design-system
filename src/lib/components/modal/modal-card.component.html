<div
  aria-modal="true"
  [attr.role]="resolvedRole()"
  [class]="classes()"
  [attr.aria-labelledby]="titleId">
  <div
    #header
    class="header">
    @if (resolvedIcon(); as iconName) {
      <span [class]="status() ? 'icon-badge ' + status() : 'icon-badge'">
        <ds-icon
          [name]="iconName"
          [size]="20" />
      </span>
    }

    <div class="heading">
      <div class="eyebrow">
        <ng-content select="[eyebrow]"></ng-content>
      </div>

      <div class="title-line">
        <h2
          class="title"
          [id]="titleId">
          {{ title() }}
        </h2>

        <ng-content select="[title-badge]"></ng-content>
      </div>

      @if (subtitle()) {
        <p class="subtitle">
          {{ subtitle() }}
        </p>
      }
    </div>

    @if (showClose()) {
      <button
        class="close"
        type="button"
        [attr.aria-label]="intl().dialog.closeDialog"
        (click)="onClose()">
        <ds-icon
          name="x"
          [size]="16">
        </ds-icon>
      </button>
    }
  </div>

  <div class="body">
    <ng-content select="[body]"></ng-content>

    <ng-content></ng-content>

    <div class="impact">
      <ng-content select="[impact]"></ng-content>
    </div>
  </div>

  <div
    #actions
    class="actions">
    <ng-content select="[actions]"></ng-content>
  </div>
</div>
