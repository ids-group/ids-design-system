<!-- No role or aria-live here on purpose. A live region has to exist in the DOM BEFORE
     its text arrives, and a toast is created WITH its message — so these attributes
     announced nothing for the three polite variants. ToastService speaks through the
     CDK LiveAnnouncer instead, whose region is built once at construction. A static
     <ds-toast> placed by hand is therefore silent to a reader by design: it is a
     specimen, not an event. -->
<div [class]="classes()">
  @if (isLoading()) {
    <ds-spinner
      class="icon"
      size="sm"
    />
  } @else {
    <ds-icon
      class="icon"
      [name]="icon() ?? defaultIcon()"
      [size]="16"
    />
  }

  <div class="body">
    @if (title()) {
      <div class="title">
        {{ title() }}
      </div>
    }
    {{ message() }}
    <ng-content></ng-content>
  </div>

  @if (action(); as act) {
    <button
      type="button"
      class="action"
      (click)="onAction(act)"
    >
      {{ act.label }}
    </button>
  }

  <span class="actions">
    <ng-content select="[actions]"></ng-content>
  </span>

  @if (dismissible()) {
    <button
      type="button"
      class="close"
      aria-label="Dismiss"
      (click)="onDismiss()"
    >
      <ds-icon
        name="x"
        [size]="14"
      />
    </button>
  }
</div>
