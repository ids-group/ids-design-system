<!-- No role or aria-live: a region created with its text already in it announces
     nothing, so ToastService speaks through the CDK LiveAnnouncer. A hand-placed
     <ds-toast> is silent to a reader: it is a specimen, not an event. -->
<div [class]="classes()">
  @if (isLoading()) {
    <!-- aria-hidden because ds-spinner is a role="status" of its own: the message is
         announced by ToastService, and a nested live region would speak twice. -->
    <ds-spinner
      class="icon"
      size="sm"
      aria-hidden="true" />
  } @else {
    <ds-icon
      class="icon"
      [name]="icon() ?? defaultIcon()"
      [size]="16" />
  }

  <div class="body">
    @if (title()) {
      <div class="title">
        {{ title() }}
      </div>
    }
    {{ body() }}
    <ng-content></ng-content>
  </div>

  @if (action(); as act) {
    <button
      type="button"
      class="action"
      (click)="onAction(act)">
      {{ act.label }}
    </button>
  }

  <span class="actions">
    <ng-content select="[actions]"></ng-content>
  </span>

  @if (dismissible()) {
    <button
      type="button"
      class="close"
      [attr.aria-label]="intl().dialog.dismiss"
      (click)="onDismiss()">
      <ds-icon
        name="x"
        [size]="14" />
    </button>
  }
</div>
