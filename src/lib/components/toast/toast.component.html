<div
  aria-atomic="true"
  [class]="classes()"
  [attr.role]="role()"
  [attr.aria-live]="role() === 'alert' ? 'assertive' : 'polite'"
>
  @if (isLoading()) {
    <ds-spinner
      class="icon"
      size="sm"
    />
  } @else {
    <ds-icon
      class="icon"
      [name]="icon() ?? defaultIcon()"
      [size]="16"
    />
  }

  <div class="body">
    @if (title()) {
      <div class="title">
        {{ title() }}
      </div>
    }
    {{ message() }}
    <ng-content></ng-content>
  </div>

  @if (action(); as act) {
    <button
      type="button"
      class="action"
      (click)="onAction(act)"
    >
      {{ act.label }}
    </button>
  }

  <span class="actions">
    <ng-content select="[actions]"></ng-content>
  </span>

  @if (dismissible()) {
    <button
      type="button"
      class="close"
      aria-label="Dismiss"
      (click)="onDismiss()"
    >
      <ds-icon
        name="x"
        [size]="14"
      />
    </button>
  }
</div>
