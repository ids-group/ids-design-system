@for (entry of visibleEntries(); track entry.id) {
  <ds-toast
    [variant]="entry.variant"
    [title]="entry.title ?? ''"
    [body]="entry.body"
    [dismissible]="entry.dismissible"
    [action]="entry.action ?? null"
    [class.leaving]="isLeaving(entry.id)"
    (closed)="remove(entry.id)"
  />
}
