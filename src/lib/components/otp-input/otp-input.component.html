<div class="cells">
  @for (cell of cells(); track $index; let i = $index) {
    <input
      #box
      class="cell"
      [type]="mask() ? 'password' : 'text'"
      [attr.inputmode]="mode() === 'numeric' ? 'numeric' : 'text'"
      [attr.autocomplete]="i === 0 ? 'one-time-code' : 'off'"
      [attr.aria-label]="cellLabel(i)"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      [value]="cell"
      [disabled]="isDisabled()"
      (input)="onInput($event, i)"
      (keydown)="onKeydown($event, i)"
      (paste)="onPaste($event, i)"
      (focus)="onFocus($event, i)"
      (blur)="onBlur()"
    />
  }
</div>
<ds-field-message
  [text]="hint()"
  [state]="messageState()"
  [messageId]="hintId()"
/>
