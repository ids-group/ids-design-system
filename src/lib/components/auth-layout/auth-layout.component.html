<div class="auth">
  <header class="masthead">
    <div class="brand">
      <ng-content select="[brand]"></ng-content>

      @if (logoLetter() || brand()) {
        <span
          class="mark"
          aria-hidden="true"
        >
          {{ markGlyph() }}
        </span>
      }

      @if (brand() || hasBrandName()) {
        <span class="brand-name">
          @if (hasBrandName()) {
            <ng-content select="[dsBrandName]"></ng-content>
          } @else {
            {{ brand() }}
          }
        </span>
      }
    </div>

    @if (tagline()) {
      <p class="tagline">
        {{ tagline() }}
      </p>
    }
  </header>

  <ds-card
    class="card"
    [attr.role]="landmark() === 'main' ? 'main' : null"
    [elevation]="cardElevation()"
    [padding]="cardPadding()"
  >
    <ng-content></ng-content>
  </ds-card>

  <footer class="support">
    <ng-content select="[dsAuthSupport]"></ng-content>
  </footer>
</div>
