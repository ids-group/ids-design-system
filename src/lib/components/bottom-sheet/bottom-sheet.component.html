@if (rendered()) {
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- backdrop; click dismisses, keyboard dismisses via Escape (host document:keydown.escape) -->
  <div
    class="sheet-overlay"
    [class.closing]="closing()"
    (click)="close()"
  >
    <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -- (click) only stops propagation to the backdrop; the dialog itself isn't an activatable control -->
    <div
      #sheet
      cdkTrapFocus
      cdkTrapFocusAutoCapture
      class="sheet"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="title() ? titleId : null"
      [class.dragging]="dragOffset() !== null"
      [class.closing]="closing()"
      [class.snapping]="snapPoints().length > 0 && dragOffset() === null"
      [style.transform]="
        dragOffset() ? 'translateY(' + dragOffset() + 'px)' : null
      "
      [style.height]="snapHeight()"
      [style.maxHeight]="snapHeight() ? snapHeight() : null"
      (click)="stop($event)"
      (animationend)="onLeaveEnd($event)"
    >
      <div
        class="grab"
        (pointerdown)="onGrabStart($event)"
        (pointermove)="onGrabMove($event)"
        (pointerup)="onGrabEnd()"
        (pointercancel)="onGrabEnd()"
      >
        <div class="sheet-handle"></div>
      </div>

      @if (title()) {
        <h3
          class="sheet-title"
          [id]="titleId"
        >
          {{ title() }}
        </h3>
      }

      <div class="sheet-body">
        <ng-content />
      </div>

      <div class="sheet-actions">
        <ng-content select="[actions]" />
      </div>
    </div>
  </div>
}
