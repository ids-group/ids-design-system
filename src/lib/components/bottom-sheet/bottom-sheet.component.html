@if (rendered()) {
  <!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -- backdrop; keyboard dismissal is (keydown.escape) on this element, a backdrop isn't a tabbable control -->
  <div
    class="sheet-overlay"
    [class.closing]="closing()"
    (pointerdown)="backdropPress.down($event)"
    (pointerup)="onBackdropRelease($event)"
    (keydown.escape)="onEscape()">
    <div
      #sheet
      cdkTrapFocus
      cdkTrapFocusAutoCapture
      class="sheet"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="title() ? titleId : null"
      [class.dragging]="dragOffset() !== null"
      [class.closing]="closing()"
      [class.snapping]="snapPoints().length > 0 && dragOffset() === null"
      [style.transform]="
        dragOffset() ? 'translateY(' + dragOffset() + 'px)' : null
      "
      [style.height]="snapHeight()"
      [style.maxHeight]="snapHeight() ? snapHeight() : null"
      (animationend)="onLeaveEnd($event)">
      <div
        class="grab"
        (pointerdown)="onGrabStart($event)"
        (pointermove)="onGrabMove($event)"
        (pointerup)="onGrabEnd()"
        (pointercancel)="onGrabEnd()">
        <div class="sheet-handle"></div>
      </div>

      @if (title()) {
        <h3
          class="sheet-title"
          [id]="titleId">
          {{ title() }}
        </h3>
      }

      <div class="sheet-body">
        <ng-content />
      </div>

      <div class="sheet-actions">
        <ng-content select="[actions]" />
      </div>
    </div>
  </div>
}
