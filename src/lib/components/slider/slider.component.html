<div
  #track
  class="track"
  (pointerdown)="onTrackPointerDown($event)"
  (pointermove)="onTrackPointerMove($event)"
  (pointerup)="onTrackPointerUp($event)"
  (pointercancel)="onTrackPointerUp($event)">
  <span
    class="fill"
    [style.left.%]="fill().left"
    [style.width.%]="fill().width">
  </span>

  @for (thumbValue of thumbValues(); track $index; let i = $index) {
    <span
      class="thumb"
      role="slider"
      [attr.tabindex]="isDisabled() ? -1 : 0"
      [style.left.%]="percent(thumbValue)"
      [attr.aria-valuemin]="thumbMin(i)"
      [attr.aria-valuemax]="thumbMax(i)"
      [attr.aria-valuenow]="thumbValue"
      [attr.aria-orientation]="'horizontal'"
      [attr.aria-label]="thumbAriaLabel(i)"
      [attr.aria-disabled]="isDisabled() ? 'true' : null"
      [attr.aria-invalid]="invalidResolved() ? 'true' : null"
      [attr.aria-describedby]="hintId()"
      (keydown)="onThumbKeydown($event, i)">
    </span>
  }
</div>

<ds-field-status
  [pending]="pendingShown()"
  [changed]="changedShown()" />

<ds-field-message
  [icon]="messageIcon()"
  [text]="message().text"
  [state]="message().state"
  [messageId]="hintId()"
  [reserve]="reserveMessageResolved()"
  [changed]="changedShown()" />
