<div [class]="wrapperClasses()">
  @if (label()) {
    <label
      class="label"
      [attr.for]="uid">
      {{ label() }}
      @if (required()) {
        <span
          class="req"
          aria-hidden="true">
          *
        </span>
      } @else if (optional()) {
        <span
          class="optional-marker"
          aria-hidden="true">
          {{ intl().field.optional }}
        </span>
      }
    </label>
  }

  <div
    class="control"
    dsFieldClickFocus>
    <textarea
      #control
      [id]="uid"
      [rows]="rows()"
      [attr.name]="name()"
      [attr.placeholder]="placeholder() || null"
      [attr.aria-label]="resolvedAriaLabel()"
      [attr.aria-invalid]="invalidResolved() ? 'true' : null"
      [attr.aria-describedby]="hintId()"
      [attr.aria-required]="required() ? 'true' : null"
      [attr.maxlength]="maxLength()"
      [attr.minlength]="minLength()"
      [attr.pattern]="patternAttribute()"
      [disabled]="isDisabled()"
      [readOnly]="isReadOnly()"
      [required]="required()"
      [style.resize]="effectiveResize()"
      [style.min-height]="autosizeMinHeight()"
      [style.max-height]="autosizeMaxHeight()"
      [style.overflow-y]="autosize() && maxRows() ? 'auto' : null"
      [(ngModel)]="value"
      (blur)="markTouched()">
    </textarea>
  </div>

  @if (
      reserveMessageResolved() ||
      message().text ||
      maxLength() !== null
    ) {
    <div class="field-footer">
      <ds-field-message
        [icon]="messageIcon()"
        [text]="message().text"
        [state]="message().state"
        [messageId]="hintId()"
        [reserve]="reserveMessageResolved()" />

      @if (maxLength() !== null) {
        <span
          class="char-counter"
          aria-live="polite"
          aria-atomic="true"
          [id]="counterId()">
          {{ currentLength() }}/{{ maxLength() }}
        </span>
      }
    </div>
  }
</div>
