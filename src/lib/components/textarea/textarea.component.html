<div [class]="wrapperClasses()">
  @if (label()) {
    <label
      class="label"
      [attr.for]="uid"
    >
      {{ label() }}
      @if (required()) {
        <span
          class="req"
          aria-hidden="true"
        >
          *
        </span>
      } @else if (optional()) {
        <span
          class="optional-marker"
          aria-hidden="true"
        >
          (optional)
        </span>
      }
    </label>
  }

  <div class="control">
    <textarea
      [id]="uid"
      [rows]="rows()"
      [attr.name]="name()"
      [attr.placeholder]="placeholder() || null"
      [attr.aria-label]="resolvedAriaLabel()"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      [attr.aria-describedby]="hintId()"
      [attr.aria-required]="required() ? 'true' : null"
      [attr.maxlength]="maxLength()"
      [disabled]="isDisabled()"
      [readOnly]="readOnly()"
      [required]="required()"
      [style.resize]="effectiveResize()"
      [style.min-height]="autosizeMinHeight()"
      [style.max-height]="autosizeMaxHeight()"
      [style.overflow-y]="autosize() && maxRows() ? 'auto' : null"
      [(ngModel)]="value"
      (blur)="markTouched()"
    >
    </textarea>
  </div>

  @if (hint() || messageState() !== 'default' || maxLength() !== null) {
    <div class="field-footer">
      <ds-field-message
        [text]="hint()"
        [state]="messageState()"
        [messageId]="hintId()"
      />

      @if (maxLength() !== null) {
        <span
          class="char-counter"
          aria-live="polite"
          aria-atomic="true"
          [id]="counterId()"
        >
          {{ currentLength() }}/{{ maxLength() }}
        </span>
      }
    </div>
  }
</div>
