<div [class]="wrapperClasses()">
  @if (label()) {
    <label
      class="label"
      [attr.for]="uid">
      {{ label() }}
      @if (required()) {
        <span
          class="req"
          aria-hidden="true">
          *
        </span>
      } @else if (optional()) {
        <span
          class="optional-marker"
          aria-hidden="true">
          {{ intl().field.optional }}
        </span>
      }
    </label>
  }

  <div
    class="control"
    dsFieldClickFocus>
    @if (overLimitBy() > 0) {
      <div
        #overflowMirror
        class="overflow-mirror"
        aria-hidden="true">
        <span [textContent]="overflowParts().within"></span>

        <mark [textContent]="overflowParts().over"></mark>

        <span [textContent]="overflowParts().after"></span>
      </div>
    }

    <textarea
      #control
      [id]="uid"
      [rows]="rows()"
      [attr.name]="name()"
      [attr.placeholder]="placeholder() || null"
      [attr.aria-label]="resolvedAriaLabel()"
      [attr.aria-invalid]="invalidResolved() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      [attr.aria-required]="required() ? 'true' : null"
      [attr.maxlength]="nativeMaxLength()"
      [attr.minlength]="minLength()"
      [attr.pattern]="patternAttribute()"
      [disabled]="isDisabled()"
      [readOnly]="isReadOnly()"
      [required]="required()"
      [style.resize]="effectiveResize()"
      [style.min-height]="autosizeMinHeight()"
      [style.max-height]="autosizeMaxHeight()"
      [style.overflow-y]="autosize() && maxRows() ? 'auto' : null"
      [(ngModel)]="value"
      (blur)="markTouched()"
      (scroll)="syncOverflowScroll()">
    </textarea>

    <ds-field-status
      [pending]="pendingShown()"
      [changed]="changedShown()" />
  </div>

  @if (
      reserveMessageResolved() ||
      message().text ||
      changedShown() ||
      maxLength() !== null
    ) {
    <div class="field-footer">
      <ds-field-message
        [icon]="messageIcon()"
        [text]="message().text"
        [state]="message().state"
        [messageId]="hintId()"
        [reserve]="reserveMessageResolved()"
        [changed]="changedShown()" />

      @if (maxLength() !== null) {
        <span
          class="char-counter"
          aria-live="polite"
          aria-atomic="true"
          [class.over-limit]="overLimitBy() > 0"
          [id]="counterId()">
          {{ currentLength() }}/{{ maxLength() }}
          @if (overLimitBy() > 0) {
            <span class="visually-hidden">
              {{ intl().field.overLimit(overLimitBy()) }}
            </span>
          }
        </span>
      }
    </div>
  }
</div>
