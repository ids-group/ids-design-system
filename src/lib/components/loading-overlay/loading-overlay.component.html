<div
  class="content"
  [attr.inert]="loading() && inertContent() ? '' : null">
  <ng-content></ng-content>
</div>

@if (loading()) {
  <div
    class="scrim"
    [class.blur]="blur()"
    [style.top]="insetTop()">
    <ds-spinner [size]="spinnerSize()" />

    @if (label()) {
      <span class="label">
        {{ label() }}
      </span>
    }
  </div>
}
