@for (label of steps(); track $index; let i = $index, last = $last) {
  <span
    role="listitem"
    class="step"
    [class.is-current]="i === current()"
    [attr.aria-current]="i === current() ? 'step' : null"
  >
    @if (!last) {
      <span
        aria-hidden="true"
        [class]="connectorClass(i)"
      >
      </span>
    }

    <span
      aria-hidden="true"
      [class]="nodeClass(i)"
    >
      @if (i < current()) {
        <ds-icon
          name="check"
          [size]="14"
        />
      } @else {
        {{ i + 1 }}
      }
    </span>

    <span
      aria-hidden="true"
      class="step-label"
      >
      {{ label }}
    </span
    >

    <span class="visually-hidden">
      Step {{ i + 1 }}: {{ label }} ({{ stepState(i) }})
    </span>
  </span>
}
