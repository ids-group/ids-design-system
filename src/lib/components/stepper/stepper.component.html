@for (label of steps(); track $index; let i = $index, last = $last) {
  <span
    role="listitem"
    [class]="nodeClass(i)"
    [attr.aria-current]="i === current() ? 'step' : null"
  >
    <span aria-hidden="true">
      @if (i < current()) {
        <ds-icon
          name="check"
          [size]="14"
        />
      } @else {
        {{ i + 1 }}
      }
    </span>

    <span class="visually-hidden">
      Step {{ i + 1 }}: {{ label }} ({{ stepState(i) }})
    </span>
  </span>

  @if (!last) {
    <span
      aria-hidden="true"
      [class]="barClass(i)"
    >
    </span>
  }
}
