<span class="leading">
  <ng-content select="[leading]"></ng-content>
</span>

<!-- `[leading]` and `[trailing]` stay outside the activator: a control nested in a <button> is
     invalid and its click would bubble into `activated`. Legal because `role="listitem"` allows
     interactive descendants, unlike `role="option"`. -->
@if (clickable()) {
  <button
    type="button"
    class="activator"
    [disabled]="disabled()"
    (click)="activated.emit()">
    <ng-container [ngTemplateOutlet]="body"></ng-container>
  </button>
} @else {
  <ng-container [ngTemplateOutlet]="body"></ng-container>
}

<span class="trailing">
  <ng-content select="[trailing]"></ng-content>
</span>

<ng-template #body>
  <span class="body">
    @if (title()) {
      <span class="title">
        {{ title() }}
      </span>
    }

    @if (subtitle()) {
      <span class="subtitle">
        {{ subtitle() }}
      </span>
    }

    <ng-content></ng-content>
  </span>
</ng-template>
