<ng-template #content>
  <span class="leading">
    <ng-content select="[leading]"></ng-content>
  </span>

  <span class="body">
    @if (title()) {
      <span class="title">
        {{ title() }}
      </span>
    }

    @if (subtitle()) {
      <span class="subtitle">
        {{ subtitle() }}
      </span>
    }

    <ng-content></ng-content>
  </span>

  <span class="trailing">
    <ng-content select="[trailing]"></ng-content>
  </span>
</ng-template>

@if (clickable()) {
  <button
    type="button"
    class="activator"
    [disabled]="disabled()"
    [attr.aria-current]="selected() ? 'true' : null"
    (click)="activated.emit()"
  >
    <ng-container [ngTemplateOutlet]="content"></ng-container>
  </button>
} @else {
  <div class="activator">
    <ng-container [ngTemplateOutlet]="content"></ng-container>
  </div>
}
