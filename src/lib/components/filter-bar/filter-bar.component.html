<div
  #row
  class="row"
>
  @for (item of inline(); track item) {
    <div
      class="item"
      [style.width.px]="item.width()"
    >
      <ng-container [ngTemplateOutlet]="item.template" />
    </div>
  }

  @if (collapsed().length) {
    <ds-button
      #moreTrigger
      class="more"
      color="neutral"
      variant="outline"
      icon="filter"
      [size]="triggerSize()"
      [ariaExpanded]="more.opened()"
      (pressed)="more.toggle(moreTrigger.buttonRef().nativeElement)"
    >
      +{{ collapsed().length }} {{ moreLabel() }}
    </ds-button>

    <ds-popover
      #more
      align="end"
      panelRole="dialog"
      [panelLabel]="panelLabel()"
    >
      <div class="panel">
        @for (item of collapsed(); track item) {
          <div
            class="item"
            [style.width.px]="item.width()"
          >
            <ng-container [ngTemplateOutlet]="item.template" />
          </div>
        }
      </div>
    </ds-popover>
  }
</div>

<div class="trailing">
  <ng-content select="[dsFilterBarTrailing]"></ng-content>
</div>

@if (devMode) {
  <span
    dsProjectionDropped="ds-filter-bar"
    reason='a filter belongs in an <ng-template [dsFilterItem]="width">, and anything else needs the dsFilterBarTrailing attribute to reach the trailing edge. Content carrying neither is not rendered.'
  >
    <ng-content></ng-content>
  </span>
}
