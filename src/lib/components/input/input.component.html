<div [class]="wrapperClasses()">
  @if (label() && !floating()) {
    <label
      class="label"
      [attr.for]="uid"
    >
      {{ label() }}
      @if (required()) {
        <span
          class="req"
          aria-hidden="true"
        >
          *
        </span>
      } @else if (optional()) {
        <span
          class="optional-marker"
          aria-hidden="true"
        >
          (optional)
        </span>
      }
    </label>
  }

  <div class="control">
    @if (floating() && label()) {
      <label
        class="floating-label"
        [attr.for]="uid"
      >
        {{ label() }}
      </label>
    }

    <span class="addon-slot prefix">
      <ng-content select="[dsInputPrefix]"></ng-content>
    </span>

    <input
      [id]="uid"
      [type]="effectiveType()"
      [attr.name]="name()"
      [attr.min]="min()"
      [attr.max]="max()"
      [attr.step]="step()"
      [attr.autocomplete]="autocomplete()"
      [attr.autofocus]="autofocus() ? '' : null"
      [attr.placeholder]="placeholder() || null"
      [attr.aria-label]="resolvedAriaLabel()"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      [attr.aria-describedby]="hintId()"
      [attr.aria-required]="required() ? 'true' : null"
      [attr.enterkeyhint]="enterKeyHint()"
      [attr.inputmode]="inputMode()"
      [disabled]="isDisabled()"
      [readOnly]="readOnly()"
      [required]="required()"
      [(ngModel)]="value"
      (blur)="blurred.emit(); markTouched()"
    />

    @if (canClear() && value() && !isDisabled()) {
      <button
        type="button"
        class="clear-btn"
        aria-label="Clear input"
        (click)="clear()"
      >
      </button>
    }

    @if (showPasswordToggle()) {
      <button
        type="button"
        class="password-toggle"
        tabindex="-1"
        [attr.aria-label]="
          passwordVisible() ? 'Hide password' : 'Show password'
        "
        (click)="togglePassword()"
      >
        <ds-icon
          [name]="passwordVisible() ? 'eye-off' : 'eye'"
          [size]="16"
        />
      </button>
    }

    @if (loading()) {
      <ds-spinner size="sm" />
    }

    <span class="addon-slot suffix">
      <ng-content select="[dsInputSuffix]"></ng-content>
    </span>
  </div>

  <ds-field-message
    [text]="hint()"
    [state]="messageState()"
    [messageId]="hintId()"
  />
</div>
