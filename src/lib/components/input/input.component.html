<div [class]="wrapperClasses()">
  @if (label()) {
    <span class="label">
      {{ label() }}
      @if (required()) {
        <span class="req" aria-hidden="true">*</span>
      } @else if (optional()) {
        <span class="optional-marker" aria-hidden="true">(optional)</span>
      }
    </span>
  }
  <div class="control">
    <span class="addon-slot prefix"><ng-content select="[dsInputPrefix]"></ng-content></span>
    <input
      [type]="effectiveType()"
      [(ngModel)]="value"
      [attr.name]="name()"
      [attr.placeholder]="placeholder() || null"
      [attr.enterkeyhint]="enterKeyHint()"
      [attr.inputmode]="inputMode()"
      [disabled]="disabled()"
      [required]="required()"
      (blur)="blurred.emit()"
    />
    @if (canClear() && value() && !disabled()) {
      <button type="button" class="clear-btn" (click)="clear()" tabindex="-1" aria-label="Clear input"></button>
    }
    @if (showPasswordToggle()) {
      <button
        type="button"
        class="password-toggle"
        tabindex="-1"
        [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
        (click)="togglePassword()"
      >
        <ds-icon [name]="passwordVisible() ? 'eye-off' : 'eye'" [size]="16" />
      </button>
    }
    <span class="addon-slot suffix"><ng-content select="[dsInputSuffix]"></ng-content></span>
  </div>
  @if (hint()) {
    <span class="hint">{{ hint() }}</span>
  }
</div>
