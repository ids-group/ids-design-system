<div [class]="wrapperClasses()">
  @if (label()) {
    <label
      class="label"
      [attr.for]="uid">
      {{ label() }}
      @if (required()) {
        <span
          class="req"
          aria-hidden="true">
          *
        </span>
      } @else if (optional()) {
        <span
          class="optional-marker"
          aria-hidden="true">
          {{ intl().field.optional }}
        </span>
      }
    </label>
  }

  <div
    class="control"
    dsFieldClickFocus>
    <span class="addon-slot prefix">
      <ng-content select="[dsInputPrefix]"></ng-content>
    </span>

    <input
      #control
      [id]="uid"
      [type]="effectiveType()"
      [attr.name]="name()"
      [attr.min]="min()"
      [attr.max]="max()"
      [attr.step]="step()"
      [attr.autocomplete]="autocomplete()"
      [attr.autofocus]="autofocus() ? '' : null"
      [attr.placeholder]="placeholder() || null"
      [attr.aria-label]="resolvedAriaLabel()"
      [attr.aria-invalid]="invalidResolved() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      [attr.aria-required]="required() ? 'true' : null"
      [attr.enterkeyhint]="enterKeyHint()"
      [attr.inputmode]="inputMode()"
      [attr.maxlength]="maxLength()"
      [attr.minlength]="minLength()"
      [attr.pattern]="patternAttribute()"
      [disabled]="isDisabled()"
      [readOnly]="isReadOnly()"
      [required]="required()"
      [(ngModel)]="value"
      (blur)="blurred.emit(); markTouched()" />

    @if (
        canClear() &&
        value() &&
        !isDisabled()
      ) {
      <button
        type="button"
        class="clear-btn"
        [attr.aria-label]="intl().field.clearInput"
        (click)="clear()">
      </button>
    }

    @if (showPasswordToggle()) {
      <button
        type="button"
        class="password-toggle"
        tabindex="-1"
        [attr.aria-label]="
          passwordVisible()
            ? intl().field.hidePassword
            : intl().field.showPassword
        "
        (click)="togglePassword()">
        <ds-icon
          [name]="passwordVisible() ? 'eye-off' : 'eye'"
          [size]="16" />
      </button>
    }

    <ds-field-status
      [pending]="loading() || pendingShown()"
      [changed]="changedShown()" />

    <span class="addon-slot suffix">
      <ng-content select="[dsInputSuffix]"></ng-content>
    </span>
  </div>

  @if (
      reserveMessageResolved() ||
      message().text ||
      changedShown() ||
      maxLength() !== null
    ) {
    <div class="field-footer">
      <ds-field-message
        [icon]="messageIcon()"
        [text]="message().text"
        [state]="message().state"
        [messageId]="hintId()"
        [reserve]="reserveMessageResolved()"
        [changed]="changedShown()" />

      @if (maxLength() !== null) {
        <span
          class="char-counter"
          aria-live="polite"
          aria-atomic="true"
          [id]="counterId()">
          {{ currentLength() }}/{{ maxLength() }}
        </span>
      }
    </div>
  }
</div>
