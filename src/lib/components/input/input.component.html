<div [class]="wrapperClasses()">
  @if (label()) {
    <label class="label" [attr.for]="uid">
      {{ label() }}
      @if (required()) {
        <span class="req" aria-hidden="true">*</span>
      } @else if (optional()) {
        <span class="optional-marker" aria-hidden="true">(optional)</span>
      }
    </label>
  }
  <div class="control">
    <span class="addon-slot prefix"><ng-content select="[dsInputPrefix]"></ng-content></span>
    <input
      [id]="uid"
      [type]="type()"
      [(ngModel)]="value"
      [attr.name]="name()"
      [attr.min]="min()"
      [attr.max]="max()"
      [attr.step]="step()"
      [attr.autocomplete]="autocomplete()"
      [attr.autofocus]="autofocus() ? '' : null"
      [attr.placeholder]="placeholder() || null"
      [attr.aria-label]="resolvedAriaLabel()"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      [attr.aria-describedby]="hintId()"
      [attr.aria-required]="required() ? 'true' : null"
      [disabled]="disabled()"
      [required]="required()"
    />
    @if (canClear() && value() && !disabled()) {
      <button type="button" class="clear-btn" (click)="clear()" aria-label="Clear input"></button>
    }
    <span class="addon-slot suffix"><ng-content select="[dsInputSuffix]"></ng-content></span>
  </div>
  @if (hint()) {
    <span class="hint" [id]="hintId()" [attr.role]="invalid() ? 'alert' : null">{{ hint() }}</span>
  }
</div>
