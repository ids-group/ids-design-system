@if (label()) {
  <span class="dropdown-label" [id]="labelId">{{ label() }}</span>
}

<button
  #trigger
  type="button"
  role="combobox"
  aria-haspopup="listbox"
  [class]="wrapperClasses()"
  [attr.name]="name()"
  [attr.aria-expanded]="open() || preview.staticPreview()"
  [attr.aria-controls]="listboxId"
  [attr.aria-activedescendant]="activeDescendant()"
  [attr.aria-labelledby]="label() ? labelId : null"
  [attr.aria-label]="resolvedAriaLabel()"
  [attr.aria-invalid]="error() ? 'true' : null"
  [disabled]="disabled()"
  (click)="toggle()"
  (keydown)="onTriggerKeydown($event)"
>
  <span class="trigger-text" [class.is-placeholder]="!hasValue()">{{ displayLabel() }}</span>
  <span class="chevron"><ds-icon name="chevronDown" [size]="14" /></span>
</button>

@if (preview.staticPreview()) {
  <div class="ds-dropdown-panel">
    <ng-container [ngTemplateOutlet]="panelContentTpl()" />
  </div>
}

<ng-template #panel>
  <ng-container [ngTemplateOutlet]="panelContentTpl()" />
</ng-template>

<ng-template #panelContent>
  <div class="dropdown-panel">
    <ul class="dropdown-list" role="listbox" [id]="listboxId" [attr.aria-labelledby]="label() ? labelId : null">
      @for (opt of options(); track opt.value; let i = $index) {
        <li role="presentation">
          <button
            type="button"
            role="option"
            class="option"
            [id]="optionId(i)"
            [attr.aria-selected]="isSelected(opt)"
            [attr.aria-disabled]="opt.disabled ? 'true' : null"
            [class.is-selected]="isSelected(opt)"
            [class.is-active]="isActive(i)"
            [class.is-disabled]="opt.disabled"
            [disabled]="opt.disabled"
            (click)="pick(opt)"
            (mouseenter)="activeIndex.set(i)"
          >
            @if (opt.icon) {
              <ds-icon class="option-icon" [name]="opt.icon" [size]="16" />
            }
            <span class="option-label">{{ opt.label }}</span>
            @if (isSelected(opt)) {
              <ds-icon class="option-check" name="check" [size]="14" />
            }
          </button>
        </li>
      }
    </ul>
  </div>
</ng-template>
