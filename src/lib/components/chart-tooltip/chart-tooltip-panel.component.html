@if (template(); as projected) {
  <ng-container
    [ngTemplateOutlet]="projected"
    [ngTemplateOutletContext]="{ $implicit: context() }" />
} @else {
  @if (context().category) {
    <p class="category">
      {{ context().category }}
    </p>
  }

  <ul
    class="entries"
    [class.no-swatches]="!showsSwatches()">
    @for (entry of context().entries; track $index) {
      <li class="entry">
        @if (showsSwatches()) {
          <span
            class="swatch"
            [class.hatched]="entry.hatched"
            [style.background-color]="entry.color">
          </span>
        }

        <span class="label">
          {{ entry.label }}
        </span>

        <span class="value">
          {{ entry.formatted }}
        </span>

        @if (entry.detail) {
          <span class="detail">
            {{ entry.detail }}
          </span>
        }
      </li>
    }
  </ul>
}
