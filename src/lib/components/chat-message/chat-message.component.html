@if (timeBreak(); as label) {
  <div class="divider">
    <span class="divider-label">
      {{ label }}
    </span>
  </div>
}

<div class="meta">
  <span
    class="speaker"
    [class.visually-hidden]="!author() || isGrouped()">
    {{ speaker() }}
  </span>

  @if (time()) {
    <span class="time">
      {{ time() }}
    </span>
  }
</div>

<div class="steps">
  <ng-content select="[steps]"></ng-content>
</div>

<div class="bubble">
  <div class="body">
    <ng-content></ng-content>
  </div>

  <div class="attachments">
    <ng-content select="[attachments]"></ng-content>
  </div>
</div>

@switch (status()) {
  @case ('sending') {
    <div
      class="status"
      role="status">
      {{ wording().sending }}
    </div>
  }
  @case ('sent') {
    <div
      class="status"
      role="status">
      <ds-icon
        name="check"
        [size]="12" />
      {{ wording().sent }}
    </div>
  }
  @case ('failed') {
    <div
      class="status is-failed"
      role="status">
      <ds-icon
        name="error"
        [size]="14" />
      {{ wording().notSent }}
      <ds-button
        variant="text"
        size="sm"
        (pressed)="retry.emit()">
        {{ wording().retry }}
      </ds-button>
    </div>
  }
}

@if (!streaming()) {
  <div class="actions">
    <ng-content select="[actions]"></ng-content>
  </div>
}
