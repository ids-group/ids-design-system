<figure class="column-chart">
  @if (series()?.activeMark?.pinned()) {
    <button
      class="pin-reset"
      type="button"
      (click)="series()?.activeMark?.release()">
      Unpin
    </button>
  }

  @if (caption()) {
    <figcaption>
      {{ caption() }}
    </figcaption>
  }

  @if (error()) {
    <p
      class="empty is-error"
      role="status">
      {{ errorTextResolved() }}
    </p>
  } @else if (loading()) {
    <div
      class="skeleton"
      aria-hidden="true">
      @for (placeholder of skeletonColumns(); track $index) {
        <ds-skeleton [height]="skeletonHeightPx()" />
      }
    </div>
  } @else if (isEmpty()) {
    <p class="empty">
      {{ emptyTextResolved() }}
    </p>
  } @else {
    <ds-chart
      frame="none"
      [categories]="categories()"
      [tickCount]="tickCount()"
      [valueFormat]="valueFormat()"
      [interactive]="interactive()"
      [summary]="accessibleName()"
      [plotHeight]="geometry().plotHeight"
      [axisGutter]="geometry().axisGutter"
      [valueSpace]="geometry().valueSpace">
      <svg:g
        dsReferenceLine
        [thresholds]="thresholds()" />

      <svg:g
        #series="dsColumnSeries"
        dsColumnSeries
        [data]="data()"
        [columnWidthRatio]="geometry().columnWidthRatio"
        [showValues]="showValues()"
        [interactive]="interactive()"
        [pinOnClick]="pinOnClick()"
        [dimOthers]="dimOthers()"
        [staggerMs]="staggerMs()"
        [partOfWhole]="partOfWhole()"
        [tooltip]="tooltip()"
        [tooltipAnchor]="tooltipAnchor()"
        [tooltipLingerMs]="tooltipLingerResolved()"
        [valueFormat]="valueFormatResolved()"
        [dsChartTooltip]="series.tooltipContext()"
        [dsChartTooltipExtraGap]="valueClearance()"
        [dsChartTooltipPreferBelow]="series.activeMark.pinned()"
        [dsChartTooltipOrigin]="series.activeMark.origin()"
        [dsChartTooltipTemplate]="tooltipTemplate() ?? null"
        (pointClicked)="pointClicked.emit($event)" />

      <svg:g
        dsReferenceLabel
        [thresholds]="thresholds()" />
    </ds-chart>

    @if (dataTableResolved() !== 'none') {
      <details
        class="data-table"
        [open]="dataTableResolved() === 'visible'">
        <summary>
          Data table
        </summary>

        <table>
          <caption>
            {{
              caption() ?? 'Chart data'
            }}
          </caption>

          <thead>
            <tr>
              <th scope="col">
                Label
              </th>

              <th scope="col">
                Value
              </th>

              @if (partOfWhole()) {
                <th scope="col">
                  Share of total
                </th>
              }
            </tr>
          </thead>

          <tbody>
            @for (row of tableRows(); track row.key) {
              <tr>
                <td>
                  {{ row.label }}
                </td>

                <td>
                  {{ row.formattedValue }}
                </td>

                @if (partOfWhole()) {
                  <td>
                    {{ row.share }}
                  </td>
                }
              </tr>
            }
          </tbody>
        </table>
      </details>
    }
  }
</figure>
