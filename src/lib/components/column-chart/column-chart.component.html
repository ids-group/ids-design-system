<figure
  class="column-chart"
  dsChartStates
  morphGrowth="up"
  messageAxes
  [pinned]="!!pinnedSeries()"
  [caption]="caption()"
  [error]="error()"
  [errorText]="errorTextResolved()"
  [pending]="(loading() && isEmpty()) || !renderReady()"
  [reloading]="loading()"
  [dataTable]="dataTableResolved() !== 'none'"
  [shimmer]="loading()"
  [empty]="isEmpty()"
  [emptyText]="emptyTextResolved()"
  [skeleton]="skeleton"
  [body]="body"
  (release)="pinnedSeries()?.activeMark?.release()">
</figure>

<ng-template #skeleton>
  <ds-chart-skeleton
    [count]="skeletonMarks()"
    [plotHeight]="geometry().plotHeight + 'px'"
    [valueSpace]="geometry().valueSpace"
    [axisGutter]="geometry().axisGutter"
    [shimmer]="loading()" />
</ng-template>

<ng-template #body>
  <ds-chart
    frame="none"
    cursor="none"
    [tooltipSwatches]="tooltipSwatches()"
    [tooltipTemplate]="tooltipTemplate() ?? null"
    [tooltipExtraGap]="valueClearance()"
    [categories]="categories()"
    [tickCount]="tickCount()"
    [valueFormat]="axisFormat()"
    [interactive]="interactive()"
    [selectRange]="selectRange()"
    [axisReadout]="axisReadout()"
    [summary]="accessibleName()"
    [rescaleOnHide]="rescaleOnHide()"
    [min]="heldExtent().min"
    [max]="heldExtent().max"
    [plotHeight]="geometry().plotHeight"
    [axisGutter]="geometry().axisGutter"
    [valueSpace]="geometry().valueSpace">
    @if (thresholds().length) {
      <svg:g
        dsReferenceLine
        [thresholds]="thresholds()" />
    }

    @for (
      series of resolvedSeries();
      track series.key;
      let seriesIndex = $index
    ) {
      <svg:g
        dsColumnSeries
        [data]="series.points"
        [seriesKey]="series.key"
        [highlighted]="spotlitSeries()"
        [hidden]="isHidden(series.key)"
        [slot]="slotCount() > 1 ? seriesIndex : 0"
        [slotCount]="slotCount()"
        [offsets]="offsetsFor(seriesIndex)"
        [seriesColor]="series.color"
        [seriesFill]="series.fill"
        [seriesLabel]="multiSeries() ? series.label : null"
        [columnWidthRatio]="geometry().columnWidthRatio"
        [showValues]="showValues()"
        [interactive]="interactive()"
        [pinOnClick]="pinOnClick()"
        [dimOthers]="dimOthers()"
        [staggerMs]="staggerMs()"
        [partOfWhole]="partOfWhole()"
        [tooltip]="tooltip()"
        [tooltipAnchor]="tooltipAnchor()"
        [tooltipLingerMs]="tooltipLingerResolved()"
        [valueFormat]="valueFormatResolved()"
        (pointClicked)="pointClicked.emit($event)" />
    }

    @if (thresholds().length) {
      <svg:g
        dsReferenceLabel
        [thresholds]="thresholds()" />
    }
  </ds-chart>

  @if (multiSeries()) {
    <ds-chart-legend
      [items]="legendItems()"
      [toggleable]="legendFilters()"
      [mode]="legendMode()"
      [(hidden)]="hiddenSeries"
      [(highlighted)]="highlightedSeries" />
  }

  @if (dataTableResolved() !== 'none') {
    <ds-chart-data-table
      [columns]="dataTableColumns()"
      [rows]="dataTableRows()"
      [caption]="caption()"
      [open]="dataTableResolved() === 'visible'" />
  }
</ng-template>
