<figure class="funnel-chart">
  @if (activeMark.pinned()) {
    <button
      class="pin-reset"
      type="button"
      (click)="activeMark.release()">
      Unpin
    </button>
  }

  @if (caption()) {
    <figcaption>
      {{ caption() }}
    </figcaption>
  }

  @if (error()) {
    <p
      class="empty is-error"
      role="status">
      {{ errorTextResolved() }}
    </p>
  } @else if (loading()) {
    <div
      class="skeleton"
      aria-hidden="true">
      @for (placeholderWidth of skeletonStages(); track $index) {
        <ds-skeleton
          height="calc(var(--_funnel-chart-stage-height) - var(--_funnel-chart-stage-gap))"
          [width]="placeholderWidth" />
      }
    </div>
  } @else if (isEmpty()) {
    <p class="empty">
      {{ emptyTextResolved() }}
    </p>
  } @else {
    <div
      class="shape"
      [class.dims-others]="dimOthers()"
      [attr.role]="interactive() ? 'group' : 'img'"
      [attr.aria-label]="accessibleName()"
      [dsChartTooltip]="tooltipContext()"
      [dsChartTooltipPreferBelow]="activeMark.pinned()"
      [dsChartTooltipOrigin]="activeMark.origin()"
      [dsChartTooltipTemplate]="tooltipTemplate() ?? null">
      <svg
        preserveAspectRatio="none"
        [attr.aria-hidden]="interactive() ? null : true"
        [attr.viewBox]="viewBox"
        [style.block-size]="chartHeight()">
        @for (entry of stages(); track entry.stage.id; let index = $index) {
          <polygon
            class="stage"
            animate.enter="mark-enter"
            animate.leave="mark-leave"
            [attr.stroke-width]="hitGapUnits()"
            [style.--_chart-mark-stagger]="markStagger(index)"
            [class.interactive]="interactive()"
            [class.is-pinned]="
              activeMark.pinned() && activeMark.index() === index
            "
            [class.is-dimmed]="isDimmed(index)"
            [attr.points]="entry.points"
            [attr.fill]="entry.color"
            [attr.role]="interactive() ? 'button' : null"
            [attr.tabindex]="
              interactive() ? (index === tabStopIndex() ? 0 : -1) : null
            "
            [attr.data-mark-index]="index"
            [attr.aria-label]="interactive() ? entryLabel(entry) : null"
            (pointerenter)="activeMark.enter(index, $event)"
            (pointerleave)="activeMark.leave()"
            (focus)="onMarkFocus(index, $event)"
            (blur)="activeMark.leave()"
            (keydown)="onMarkNavigation($event, index)"
            (click)="onMarkClick(entry.stage, index, $event)"
            (keydown.enter)="onStageKey(entry.stage, $event)"
            (keydown.space)="onStageKey(entry.stage, $event)">
          </polygon>
        }
      </svg>

      @if (pinnedCenter(); as center) {
        <span
          class="pin-marker"
          [style.left.%]="center.xPercent"
          [style.top.%]="center.yPercent">
          <ds-icon
            name="pin"
            [size]="13" />
        </span>
      }
    </div>

    @if (showTable()) {
      <table class="stage-table">
        <caption class="visually-hidden">
          Each stage as a percentage of the first, and the drop from the stage
          above it.
        </caption>

        <thead>
          <tr>
            <th scope="col">
              Stage
            </th>

            <th scope="col">
              Value
            </th>

            <th scope="col">
              Percent
            </th>

            @if (drop() !== 'none') {
              <th scope="col">
                Drop
              </th>
            }
          </tr>
        </thead>

        <tbody>
          @for (entry of stages(); track entry.stage.id; let index = $index) {
            <tr
              (pointerenter)="onRowEnter(index, $event)"
              (pointerleave)="activeMark.leave()">
              <th scope="row">
                <span
                  class="swatch"
                  animate.enter="mark-enter"
                  aria-hidden="true"
                  [style.background]="entry.color">
                </span>

                {{ entry.stage.label }}
              </th>

              <td>
                {{ entry.formattedValue }}
              </td>

              <td>
                {{ entry.formattedPercent }}
              </td>

              @if (drop() !== 'none') {
                <td>
                  {{ entry.formattedDrop }}
                </td>
              }
            </tr>
          }
        </tbody>
      </table>
    }

    @if (showDataTable()) {
      <ds-chart-data-table
        [columns]="['Label', 'Value']"
        [rows]="tableRows()"
        [caption]="caption()"
        [open]="dataTableResolved() === 'visible'" />
    }
  }
</figure>
