<details
  class="data-table"
  [open]="open()">
  <summary>
    Data table
  </summary>

  <table>
    <caption>
      {{ caption() ?? 'Chart data' }}
    </caption>

    <thead>
      <tr>
        @for (column of columns(); track column) {
          <th scope="col">
            {{ column }}
          </th>
        }
      </tr>
    </thead>

    <tbody>
      @for (row of rows(); track row.key) {
        <tr>
          @for (cell of row.cells; track $index) {
            @if (rowHeader() && $first) {
              <th scope="row">
                {{ cell }}
              </th>
            } @else {
              <td>
                {{ cell }}
              </td>
            }
          }
        </tr>
      }
    </tbody>
  </table>
</details>
