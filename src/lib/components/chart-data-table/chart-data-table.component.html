<details
  #disclosure
  class="data-table"
  [open]="open()"
  (toggle)="onToggle(disclosure.open)">
  <summary>
    Data table
  </summary>

  @if (built()) {
    <table>
      <caption>
        {{
          caption() ?? 'Chart data'
        }}
      </caption>

      <thead>
        <tr>
          @for (column of columns(); track column) {
            <th scope="col">
              {{ column }}
            </th>
          }
        </tr>
      </thead>

      <tbody>
        @for (row of rows(); track row.key) {
          <tr [class.is-nested]="row.nested">
            @for (cell of row.cells; track $index) {
              @if (rowHeader() && $first) {
                <th scope="row">
                  {{ cell }}
                </th>
              } @else {
                <td>
                  {{ cell }}
                </td>
              }
            }
          </tr>
        }
      </tbody>
    </table>
  }
</details>
