<!-- Single <ng-content> outside any @if: duplicates silently drop children on a non-matching branch.
     Same for [ds-group-icon], so both header branches stamp out ONE template. -->
<ng-template #headerContent>
  @if (icon()) {
    <ds-icon
      class="group-icon"
      [name]="icon()!"
      [size]="18">
    </ds-icon>
  } @else {
    <!-- `[ds-group-icon]` differs from the `[icon]` slots of child sidenav-items so their icons aren't swallowed. -->
    <span class="group-icon">
      <ng-content select="[ds-group-icon]"></ng-content>
    </span>
  }

  @if (label()) {
    <span class="group-title">
      {{ label() }}
    </span>
  }
</ng-template>

@if (headerNavigates()) {
  <div class="group-header-row">
    <a
      class="group-header"
      routerLinkActive="active"
      [routerLink]="routerLink()"
      [ariaCurrentWhenActive]="ariaCurrentResolved()">
      <ng-container [ngTemplateOutlet]="headerContent" />
    </a>

    <button
      type="button"
      class="group-caret-button"
      [attr.aria-expanded]="expanded()"
      [attr.aria-label]="
        expanded()
          ? intl().sidenav.collapseGroup(label())
          : intl().sidenav.expandGroup(label())
      "
      (click)="toggle()">
      <ds-icon
        class="group-caret"
        name="chevronDown"
        [class.open]="expanded()"
        [size]="14">
      </ds-icon>
    </button>
  </div>
} @else if (expandable()) {
  <button
    type="button"
    class="group-header"
    [attr.aria-expanded]="expanded()"
    (click)="toggle()">
    <ng-container [ngTemplateOutlet]="headerContent" />

    <ds-icon
      class="group-caret"
      name="chevronDown"
      [class.open]="expanded()"
      [size]="14">
    </ds-icon>
  </button>
} @else if (label()) {
  <span class="group-label">
    {{ label() }}
  </span>
}

<div
  class="group-body"
  [class.hidden]="expandable() && !expanded()"
  [attr.inert]="expandable() && !expanded() ? '' : null">
  <ng-content></ng-content>
</div>
