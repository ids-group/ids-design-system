<div class="brand">
  <ng-content select="[brand]"></ng-content>

  @if (brand()) {
    <span class="mark">
      {{ logoLetter() || brand().charAt(0) }}
    </span>

    <span class="brand-name">
      @if (hasBrandName()) {
        <ng-content select="[dsBrandName]"></ng-content>
      } @else {
        {{ brand() }}
      }
    </span>
  }
</div>

<ng-content></ng-content>
