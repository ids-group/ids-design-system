<div class="brand">
  <ng-content select="[brand]"></ng-content>

  @if (logoLetter() || brand()) {
    <span
      class="mark"
      aria-hidden="true"
    >
      {{ markGlyph() }}
    </span>
  }

  @if (brand() || hasBrandName()) {
    <span class="brand-name">
      @if (hasBrandName()) {
        <ng-content select="[dsBrandName]"></ng-content>
      } @else {
        {{ brand() }}
      }
    </span>
  }
</div>

<ng-content></ng-content>
