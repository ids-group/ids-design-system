<div class="brand">
  <ng-content select="[brand]"></ng-content>

  @if (brand()) {
    <span class="mark">
      {{ logoLetter() || brand().charAt(0) }}
    </span>

    <span class="brand-name">
      @if (accentParts(); as parts) {
        <span class="brand-accent">{{ parts.accent }}</span
        >{{ parts.rest }}
      } @else {
        {{ brand() }}
      }
    </span>
  }
</div>

<ng-content></ng-content>
