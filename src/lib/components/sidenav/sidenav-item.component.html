<!-- Selector-scoped slots ([icon], [trailing]) coexist with no default
     <ng-content> here — projection goes via attributes only, so consumers
     can compose icon + label + arbitrary trailing content (status pill,
     status icon, etc.). The two <a> variants (routerLink vs href) share one
     #content template so the inner markup isn't duplicated. -->
@if (routerLink()) {
  <a
    #rla="routerLinkActive"
    routerLinkActive="active"
    dsTooltipPlacement="right"
    [routerLink]="disabled() ? null : routerLink()"
    [class]="linkClasses()"
    [attr.aria-label]="collapsedAriaLabel()"
    [attr.aria-current]="rla.isActive ? 'page' : null"
    [attr.aria-disabled]="disabled() ? 'true' : null"
    [attr.tabindex]="disabled() ? -1 : null"
    [dsTooltip]="collapsedTooltip()"
    (click)="onActivate($event)"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else if (href()) {
  <a
    dsTooltipPlacement="right"
    [href]="href()"
    [class]="linkClasses()"
    [attr.aria-label]="collapsedAriaLabel()"
    [attr.aria-current]="active() ? 'page' : null"
    [attr.aria-disabled]="disabled() ? 'true' : null"
    [attr.tabindex]="disabled() ? -1 : null"
    [dsTooltip]="collapsedTooltip()"
    (click)="onActivate($event)"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <!-- No destination, so not a link: an `href="#"` navigates — it rewrites the URL
       and discards the scroll position on every click. An item that only emits
       `activate` is a button. -->
  <button
    type="button"
    dsTooltipPlacement="right"
    [class]="linkClasses()"
    [attr.aria-label]="collapsedAriaLabel()"
    [attr.aria-current]="active() ? 'page' : null"
    [disabled]="disabled()"
    [dsTooltip]="collapsedTooltip()"
    (click)="onActivate($event)"
  >
    <ng-container [ngTemplateOutlet]="content" />
  </button>
}

<ng-template #content>
  @if (icon()) {
    <ds-icon
      class="icon"
      [name]="icon()!"
      [size]="20"
    >
    </ds-icon>
  } @else {
    <span class="icon">
      <ng-content select="[icon]"></ng-content>
    </span>
  }

  @if (label()) {
    <span class="item-label">
      {{ label() }}
    </span>
  }

  <span class="trailing">
    <ng-content select="[trailing]"></ng-content>
  </span>

  @if (badge() !== null) {
    <span class="count">
      {{ badge() }}
    </span>
  }

  @if (hasAlert()) {
    <span class="alert"></span>
  }
</ng-template>
