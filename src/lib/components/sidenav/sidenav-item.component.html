<!-- Projection is by attribute only ([icon], [trailing]); no default <ng-content>.
     The two <a> variants share one #content template. -->
@if (routerLink()) {
  <a
    routerLinkActive="active"
    [dsTooltipConfig]="{ placement: 'right' }"
    [routerLink]="disabled() ? null : routerLink()"
    [class]="linkClasses()"
    [attr.aria-label]="collapsedAriaLabel()"
    [ariaCurrentWhenActive]="ariaCurrentResolved()"
    [attr.aria-disabled]="disabled() ? 'true' : null"
    [attr.tabindex]="disabled() ? -1 : null"
    [dsTooltip]="collapsedTooltip()"
    (click)="onActivate($event)">
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else if (href()) {
  <a
    [dsTooltipConfig]="{ placement: 'right' }"
    [href]="href()"
    [class]="linkClasses()"
    [attr.aria-label]="collapsedAriaLabel()"
    [attr.aria-current]="active() ? 'page' : null"
    [attr.aria-disabled]="disabled() ? 'true' : null"
    [attr.tabindex]="disabled() ? -1 : null"
    [dsTooltip]="collapsedTooltip()"
    (click)="onActivate($event)">
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <!-- No destination, so a button: `href="#"` would rewrite the URL and discard the scroll position. -->
  <button
    type="button"
    [dsTooltipConfig]="{ placement: 'right' }"
    [class]="linkClasses()"
    [attr.aria-label]="collapsedAriaLabel()"
    [attr.aria-current]="active() ? 'page' : null"
    [disabled]="disabled()"
    [dsTooltip]="collapsedTooltip()"
    (click)="onActivate($event)">
    <ng-container [ngTemplateOutlet]="content" />
  </button>
}

<ng-template #content>
  @if (icon()) {
    <ds-icon
      class="icon"
      [name]="icon()!"
      [size]="20">
    </ds-icon>
  } @else {
    <span class="icon">
      <ng-content select="[icon]"></ng-content>
    </span>
  }

  @if (label()) {
    <span class="item-label">
      {{ label() }}
    </span>
  }

  <span class="trailing">
    <ng-content select="[trailing]"></ng-content>
  </span>

  @if (badge() !== null) {
    <span class="count">
      {{ badge() }}
    </span>
  }

  @if (hasAlert()) {
    <span class="alert"></span>
  }
</ng-template>
