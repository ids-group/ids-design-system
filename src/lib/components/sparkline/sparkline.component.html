<svg
  #canvas
  class="sparkline"
  aria-hidden="true"
  [dsChartTooltip]="tooltipContext()"
  [dsChartTooltipOrigin]="tooltipOrigin()"
  (pointermove)="onPointerMove($event)"
  (pointerleave)="clearActive()">
  <svg
    viewBox="0 0 100 100"
    preserveAspectRatio="none"
    width="100%"
    height="100%"
    overflow="visible">
    @if (area()) {
      <path
        class="area"
        [attr.d]="geometry().areaPath" />
    }

    <path
      class="line"
      [attr.d]="geometry().path" />
  </svg>

  @if (shownPoint(); as point) {
    <circle
      class="dot"
      [attr.cx]="point.x + '%'"
      [attr.cy]="point.y + '%'" />
  }
</svg>
