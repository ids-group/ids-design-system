<!-- Border, radius and focus ring live on `.row`, not the host: the message must sit OUTSIDE the bordered box, and the host stacks the two. -->
<div class="row">
  <ng-content></ng-content>
</div>

<ds-field-message
  [icon]="messageIcon()"
  [text]="message().text"
  [state]="message().state"
  [messageId]="messageId()"
  [reserve]="reserveMessageResolved()" />
