<ul class="legend">
  @if (toggleable() && mode() === 'isolate') {
    <li class="legend-item">
      <label class="legend-toggle">
        <input
          type="radio"
          class="legend-radio"
          [attr.name]="groupName"
          [checked]="isolated() === 'all'"
          (change)="showAll()"
          (focus)="highlighted.set(null)" />

        <span class="legend-label">
          {{ intl().chart.legendAll }}
        </span>
      </label>
    </li>
  }

  @for (item of items(); track item.id) {
    <li
      class="legend-item"
      [class.is-hidden]="isHidden(item.id)"
      (pointerenter)="highlight.enter(item.id, $event)"
      (pointerleave)="highlight.leave()">
      @if (toggleable() && mode() === 'isolate') {
        <label class="legend-toggle">
          <input
            type="radio"
            class="legend-radio"
            [attr.name]="groupName"
            [checked]="isolated() === item.id"
            [style.--ds-checkbox-selected-bg-color]="item.color"
            [style.--ds-checkbox-selected-border-color]="item.color"
            (change)="isolate(item.id)"
            (focus)="highlighted.set(item.id)"
            (blur)="highlighted.set(null)" />

          <span class="legend-label">
            {{ item.label }}
          </span>
        </label>
      } @else if (toggleable()) {
        <label class="legend-toggle">
          <input
            type="checkbox"
            class="legend-check"
            [checked]="!isHidden(item.id)"
            [style.--ds-checkbox-selected-bg-color]="item.color"
            [style.--ds-checkbox-selected-border-color]="item.color"
            (change)="toggle(item.id)"
            (focus)="highlighted.set(item.id)"
            (blur)="highlighted.set(null)" />

          <span class="legend-label">
            {{ item.label }}
          </span>
        </label>
      } @else {
        <span
          class="legend-swatch"
          aria-hidden="true"
          [style.background]="item.color">
        </span>

        <span class="legend-label">
          {{ item.label }}
        </span>
      }
    </li>
  }

  @if (toggleable() && mode() === 'isolate') {
    <li class="legend-item">
      <label class="legend-toggle">
        <input
          type="radio"
          class="legend-radio"
          [attr.name]="groupName"
          [checked]="isolated() === 'none'"
          (change)="hideAll()"
          (focus)="highlighted.set(null)" />

        <span class="legend-label">
          {{ intl().chart.legendNone }}
        </span>
      </label>
    </li>
  }
</ul>
