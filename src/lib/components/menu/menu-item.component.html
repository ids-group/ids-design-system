<button
  #button
  class="menu-item"
  type="button"
  role="menuitem"
  [attr.tabindex]="tabbable() ? 0 : -1"
  [disabled]="disabled()"
  [class.danger]="danger()"
  (click)="onClick($event)"
>
  @if (icon()) {
    <ds-icon
      [name]="icon()!"
      [size]="16"
    >
    </ds-icon>
  } @else {
    <span class="menu-item-icon"
      >
      <ng-content select="[icon]"></ng-content
    >
    </span>
  }

  <span>
    <ng-content></ng-content>
  </span>
</button>
