<!-- Every branch must keep #btn: `controlRef` is required, so dropping it from one leaves that
     destination throwing instead of rendering.

     `type`, `loading` and the native `disabled` are button-only — an anchor has neither a form to
     submit nor a native disabled state, which is why the anchors take `aria-disabled` and
     `tabindex="-1"` instead. -->
@switch (destination()) {
  @case ('routerLink') {
    <a
      #btn
      #rla="routerLinkActive"
      routerLinkActive="active"
      [class]="classes()"
      [routerLink]="disabled() ? null : routerLink()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-haspopup]="ariaHasPopup()"
      [attr.aria-expanded]="ariaExpanded()"
      [attr.aria-controls]="ariaControls()"
      [attr.aria-current]="rla.isActive ? 'page' : null"
      [attr.aria-disabled]="disabled() ? 'true' : null"
      [attr.tabindex]="disabled() ? -1 : null"
      [attr.aria-describedby]="describedBy()"
      (click)="onClick($event)">
      <ng-container [ngTemplateOutlet]="content" />
    </a>
  }
  @case ('href') {
    <a
      #btn
      [class]="classes()"
      [href]="href()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-haspopup]="ariaHasPopup()"
      [attr.aria-expanded]="ariaExpanded()"
      [attr.aria-controls]="ariaControls()"
      [attr.aria-disabled]="disabled() ? 'true' : null"
      [attr.tabindex]="disabled() ? -1 : null"
      [attr.aria-describedby]="describedBy()"
      (click)="onClick($event)">
      <ng-container [ngTemplateOutlet]="content" />
    </a>
  }
  @default {
    <button
      #btn
      [class]="classes()"
      [type]="type()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-haspopup]="ariaHasPopup()"
      [attr.aria-expanded]="ariaExpanded()"
      [attr.aria-controls]="ariaControls()"
      [attr.aria-busy]="loading() ? 'true' : null"
      [attr.aria-disabled]="softDisabled() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      [disabled]="(disabled() || loading()) && !softDisabled()"
      (click)="onClick($event)">
      <ng-container [ngTemplateOutlet]="content" />
    </button>
  }
}

<ng-template #content>
  <span class="button-main">
    @if (icon(); as name) {
      <ds-icon [name]="name" />
    }

    <ng-content></ng-content>

    @if (trailingIcon(); as name) {
      <ds-icon [name]="name" />
    }
  </span>

  <span class="subtext-slot">
    <ng-content select="[dsButtonSubtext]"></ng-content>
  </span>

  @if (softDisabled()) {
    <!-- aria-hidden keeps the reason out of the button's accessible NAME; the
         aria-describedby above still reaches it, because a node referenced
         directly is read even when hidden. -->
    <span
      class="reason"
      aria-hidden="true"
      [id]="reasonId">
      {{ disabledReason() }}
    </span>
  }
</ng-template>

<ds-field-message
  [icon]="messageIcon()"
  [text]="message().text"
  [state]="message().state"
  [messageId]="hintId()"
  [reserve]="reserveMessageResolved()" />
