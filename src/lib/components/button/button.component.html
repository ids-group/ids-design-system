<button
  [class]="classes()"
  [type]="type()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-busy]="loading() ? 'true' : null"
  [disabled]="disabled() || loading()"
  (click)="onClick($event)"
>
  @if (icon(); as name) { <ds-icon [name]="name" /> }
  <ng-content></ng-content>
  @if (trailingIcon(); as name) { <ds-icon [name]="name" /> }
</button>
