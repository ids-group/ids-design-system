<button
  [class]="classes()"
  [type]="type()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-busy]="loading() ? 'true' : null"
  [disabled]="disabled() || loading()"
  (click)="onClick($event)"
>
  <span class="button-main"
    >@if (icon(); as name) { <ds-icon [name]="name" /> }<ng-content></ng-content
    >@if (trailingIcon(); as name) { <ds-icon [name]="name" /> }</span
  ><span class="subtext-slot"><ng-content select="[dsButtonSubtext]"></ng-content></span>
</button>
