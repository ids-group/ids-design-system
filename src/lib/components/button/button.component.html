<!-- Every branch must keep #btn: `controlRef` is required, so dropping it makes that destination throw.
     `type`, `loading` and native `disabled` are button-only; anchors take `aria-disabled`, and `tabindex="-1"` unless a
     `disabledReason` must stay reachable. -->
@switch (destination()) {
  @case ('routerLink') {
    <a
      #btn
      routerLinkActive="active"
      [class]="classes()"
      [routerLink]="disabled() ? null : routerLink()"
      [attr.role]="disabled() ? 'link' : null"
      [routerLinkActiveOptions]="routerLinkActiveOptions()"
      [fragment]="fragment()"
      [queryParams]="queryParams()"
      [queryParamsHandling]="queryParamsHandling()"
      [target]="target()"
      [attr.rel]="rel()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-haspopup]="ariaHasPopup()"
      [attr.aria-expanded]="ariaExpanded()"
      [attr.aria-controls]="ariaControls()"
      [ariaCurrentWhenActive]="ariaCurrentResolved()"
      [attr.aria-disabled]="disabled() ? 'true' : null"
      [attr.tabindex]="disabled() ? (softDisabled() ? 0 : -1) : null"
      [attr.aria-describedby]="describedBy()"
      (click)="onClick($event)">
      <ng-container [ngTemplateOutlet]="content" />
    </a>
  }
  @case ('href') {
    <a
      #btn
      [class]="classes()"
      [href]="href()"
      [attr.target]="target()"
      [attr.rel]="rel()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-haspopup]="ariaHasPopup()"
      [attr.aria-expanded]="ariaExpanded()"
      [attr.aria-controls]="ariaControls()"
      [attr.aria-disabled]="disabled() ? 'true' : null"
      [attr.tabindex]="disabled() ? (softDisabled() ? 0 : -1) : null"
      [attr.aria-describedby]="describedBy()"
      (click)="onClick($event)">
      <ng-container [ngTemplateOutlet]="content" />
    </a>
  }
  @default {
    <button
      #btn
      [class]="classes()"
      [type]="type()"
      [attr.aria-label]="ariaLabel()"
      [attr.aria-haspopup]="ariaHasPopup()"
      [attr.aria-expanded]="ariaExpanded()"
      [attr.aria-controls]="ariaControls()"
      [attr.aria-busy]="loading() ? 'true' : null"
      [attr.aria-disabled]="softDisabled() || loading() ? 'true' : null"
      [attr.aria-describedby]="describedBy()"
      [disabled]="disabled() && !softDisabled()"
      (click)="onClick($event)">
      <ng-container [ngTemplateOutlet]="content" />
    </button>
  }
}

<ng-template #content>
  <span class="button-main">
    @if (icon(); as name) {
      <ds-icon
        [name]="name"
        [class.loading-spinner]="loadingIconSlot() === 'leading'" />
    }

    <ng-content></ng-content>

    @if (trailingIcon(); as name) {
      <ds-icon
        [name]="name"
        [class.loading-spinner]="loadingIconSlot() === 'trailing'" />
    }
  </span>

  <span class="subtext-slot">
    <ng-content select="[dsButtonSubtext]"></ng-content>
  </span>

  @if (softDisabled()) {
    <!-- aria-hidden keeps the reason out of the accessible name; aria-describedby still reads it. -->
    <span
      class="reason"
      aria-hidden="true"
      [id]="reasonId">
      {{ disabledReason() }}
    </span>
  }
</ng-template>

<ds-field-message
  [icon]="messageIcon()"
  [text]="message().text"
  [state]="message().state"
  [messageId]="hintId()"
  [reserve]="reserveMessageResolved()" />
