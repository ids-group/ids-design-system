<div class="field">
  @if (label()) {
    <span
      class="label"
      [id]="labelId">
      {{ label() }}
      @if (required()) {
        <span
          class="req"
          aria-hidden="true">
          *
        </span>
      } @else if (optional()) {
        <span
          class="optional-marker"
          aria-hidden="true">
          {{ intl().field.optional }}
        </span>
      }
    </span>
  }

  @if (mode() === 'range') {
    <div class="range-wrap">
      <div class="trigger-wrap">
        <button
          #startTrigger
          type="button"
          aria-haspopup="dialog"
          [class]="triggerClasses()"
          [disabled]="isDisabled()"
          [attr.aria-expanded]="openSegment() === 'start'"
          [attr.aria-label]="ariaLabelFor('start')"
          [attr.aria-required]="required() ? 'true' : null"
          [attr.aria-invalid]="invalidResolved() ? 'true' : null"
          [attr.aria-describedby]="hintId()"
          (click)="onTriggerClick('start')">
          <span class="time-value">
            {{ formatFor(rangeValue()[0]) || placeholder() }}
          </span>

          <ds-icon
            name="clock"
            [size]="16" />
        </button>
      </div>

      <span
        class="range-sep"
        aria-hidden="true">
        –
      </span>

      <div class="trigger-wrap">
        <button
          #endTrigger
          type="button"
          aria-haspopup="dialog"
          [class]="triggerClasses()"
          [disabled]="isDisabled()"
          [attr.aria-expanded]="openSegment() === 'end'"
          [attr.aria-label]="ariaLabelFor('end')"
          [attr.aria-required]="required() ? 'true' : null"
          [attr.aria-invalid]="invalidResolved() ? 'true' : null"
          [attr.aria-describedby]="hintId()"
          (click)="onTriggerClick('end')">
          <span class="time-value">
            {{ formatFor(rangeValue()[1]) || placeholder() }}
          </span>

          <ds-icon
            name="clock"
            [size]="16" />
        </button>
      </div>

      <ds-field-status
        [pending]="pendingShown()"
        [changed]="changedShown()" />
    </div>
  } @else {
    <div class="trigger-wrap">
      <button
        #singleTrigger
        type="button"
        aria-haspopup="dialog"
        [class]="triggerClasses()"
        [disabled]="isDisabled()"
        [attr.aria-expanded]="openSegment() === 'single'"
        [attr.aria-labelledby]="label() ? labelId : null"
        [attr.aria-label]="label() ? null : ariaLabelFor('single')"
        [attr.aria-required]="required() ? 'true' : null"
        [attr.aria-invalid]="invalidResolved() ? 'true' : null"
        [attr.aria-describedby]="hintId()"
        (click)="onTriggerClick('single')">
        <span class="time-value">
          {{ displayValue() }}
        </span>

        <ds-field-status
          [pending]="pendingShown()"
          [changed]="changedShown()" />

        <ds-icon
          name="clock"
          [size]="16" />
      </button>

      @if (clearable() && hasValue()) {
        <button
          type="button"
          class="time-clear"
          [attr.aria-label]="intl().timePicker.clear"
          [disabled]="isDisabled()"
          (click)="clear($event)">
          <ds-icon
            name="x"
            [size]="14" />
        </button>
      }
    </div>
  }

  @if (preview.staticPreview()) {
    <div class="time-static">
      <ng-container [ngTemplateOutlet]="panelTpl()" />
    </div>
  }

  <ds-field-message
    [icon]="messageIcon()"
    [text]="message().text"
    [state]="message().state"
    [messageId]="hintId()"
    [reserve]="reserveMessageResolved()"
    [changed]="changedShown()" />
</div>

<ng-template #panel>
  <div class="time-panel">
    <ds-time-columns
      [value]="panelValue()"
      [format]="resolvedFormat()"
      [minuteStep]="minuteStep()"
      [loop]="loopResolved()"
      [minTime]="panelMinTime()"
      [maxTime]="panelMaxTime()"
      [disabledTime]="disabledTime()"
      (timeChange)="onPick($event)"
      (partPicked)="onPartPicked($event)" />

    <div class="time-footer">
      <button
        type="button"
        class="time-action"
        (click)="setNow()">
        {{ intl().timePicker.now }}
      </button>

      @if (mode() === 'range') {
        <button
          type="button"
          class="time-action primary"
          (click)="onEscape()">
          {{ intl().timePicker.done }}
        </button>
      }
    </div>
  </div>
</ng-template>
