<div class="field">
  @if (mode() === 'range') {
    <div class="range-wrap">
      <div class="trigger-wrap">
        <button
          #startTrigger
          type="button"
          aria-haspopup="dialog"
          [class]="triggerClasses()"
          [disabled]="isDisabled()"
          [attr.aria-expanded]="openSegment() === 'start'"
          [attr.aria-label]="ariaLabelFor('start')"
          [attr.aria-invalid]="invalid() ? 'true' : null"
          [attr.aria-describedby]="hintId()"
          (click)="onTriggerClick('start')"
        >
          <ds-icon
            name="clock"
            [size]="14"
          />

          <span class="time-value">
            {{ formatFor(rangeValue()[0]) || placeholder() }}
          </span>
        </button>
      </div>

      <span
        class="range-sep"
        aria-hidden="true"
      >
        –
      </span>

      <div class="trigger-wrap">
        <button
          #endTrigger
          type="button"
          aria-haspopup="dialog"
          [class]="triggerClasses()"
          [disabled]="isDisabled()"
          [attr.aria-expanded]="openSegment() === 'end'"
          [attr.aria-label]="ariaLabelFor('end')"
          [attr.aria-invalid]="invalid() ? 'true' : null"
          [attr.aria-describedby]="hintId()"
          (click)="onTriggerClick('end')"
        >
          <ds-icon
            name="clock"
            [size]="14"
          />

          <span class="time-value">
            {{ formatFor(rangeValue()[1]) || placeholder() }}
          </span>
        </button>
      </div>
    </div>
  } @else {
    <div class="trigger-wrap">
      <button
        #singleTrigger
        type="button"
        aria-haspopup="dialog"
        [class]="triggerClasses()"
        [disabled]="isDisabled()"
        [attr.aria-expanded]="openSegment() === 'single'"
        [attr.aria-label]="ariaLabelFor('single')"
        [attr.aria-invalid]="invalid() ? 'true' : null"
        [attr.aria-describedby]="hintId()"
        (click)="onTriggerClick('single')"
      >
        <ds-icon
          name="clock"
          [size]="14"
        />

        <span class="time-value">
          {{ displayValue() }}
        </span>
      </button>

      @if (clearable() && hasValue()) {
        <button
          type="button"
          class="time-clear"
          aria-label="Clear"
          [disabled]="isDisabled()"
          (click)="clear($event)"
        >
          <ds-icon
            name="x"
            [size]="14"
          />
        </button>
      }
    </div>
  }

  <ds-field-message
    [text]="hint()"
    [state]="messageState()"
    [messageId]="hintId()"
    [reserve]="reserveMessage()"
  />
</div>

<ng-template #panel>
  <div class="time-panel">
    <ds-time-columns
      [value]="panelValue()"
      [format]="resolvedFormat()"
      [minuteStep]="minuteStep()"
      [minTime]="panelMinTime()"
      [maxTime]="panelMaxTime()"
      [disabledTime]="disabledTime()"
      (timeChange)="onPick($event)"
    />

    <div class="time-footer">
      <button
        type="button"
        class="time-action"
        (click)="setNow()"
      >
        Now
      </button>

      <button
        type="button"
        class="time-action primary"
        (click)="onEscape()"
      >
        Done
      </button>
    </div>
  </div>
</ng-template>
