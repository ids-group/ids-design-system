<div class="field">
  @if (label()) {
    <span class="label">
      {{ label() }}
      @if (required()) {
        <span class="req" aria-hidden="true">*</span>
      } @else if (optional()) {
        <span class="optional-marker" aria-hidden="true">(optional)</span>
      }
    </span>
  }
  <button
    #trigger
    type="button"
    [class]="triggerClasses()"
    [attr.aria-required]="required() ? 'true' : null"
    (click)="open()"
  >
    <ds-icon name="calendar" [size]="14"></ds-icon>
    <span>{{ displayLabel() }}</span>
  </button>
  @if (hint()) {
    <small class="hint">{{ hint() }}</small>
  }
</div>

<ng-template #panel>
  <div class="calendar">
    <div class="head">
      <span class="title">{{ monthLabel() }}</span>
      <span class="nav">
        <button type="button" (click)="prevMonth()">
          <ds-icon name="chevronLeft" [size]="14"></ds-icon>
        </button>
        <button type="button" (click)="nextMonth()">
          <ds-icon name="chevronRight" [size]="14"></ds-icon>
        </button>
      </span>
    </div>
    <div class="grid">
      <span class="dow">Mo</span>
      <span class="dow">Tu</span>
      <span class="dow">We</span>
      <span class="dow">Th</span>
      <span class="dow">Fr</span>
      <span class="dow">Sa</span>
      <span class="dow">Su</span>
      @for (cell of daysGrid(); track $index) {
        <button type="button" [class]="cellClasses(cell)" (click)="selectDay(cell)">
          {{ cell.day }}
        </button>
      }
    </div>
  </div>
</ng-template>
