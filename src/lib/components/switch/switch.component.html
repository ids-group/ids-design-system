<div class="switch-field">
  <span
    class="control-line"
    [class.is-disabled]="isDisabled()"
  >
    <input
      type="checkbox"
      role="switch"
      [class]="classes()"
      [checked]="checked()"
      [attr.aria-checked]="checked()"
      [disabled]="isDisabled()"
      [attr.name]="name()"
      [attr.id]="controlId()"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      [attr.aria-describedby]="hintId()"
      (change)="onCheckedChange($event)"
      (blur)="markTouched()"
    />
    @if (label()) {
      <label
        class="control-text"
        [attr.for]="controlId()"
        >{{ label() }}</label
      >
    }
  </span>
  <ds-field-message
    [text]="hint()"
    [state]="messageState()"
    [messageId]="hintId()"
  />
</div>
