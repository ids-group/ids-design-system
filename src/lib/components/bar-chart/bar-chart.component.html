<figure class="bar-chart">
  @if (activeMark.pinned()) {
    <button
      class="pin-reset"
      type="button"
      (click)="activeMark.release()">
      Unpin
    </button>
  }
  @if (caption()) {
    <figcaption>
      {{ caption() }}
    </figcaption>
  }

  @if (error()) {
    <p
      class="empty is-error"
      role="status">
      {{ errorTextResolved() }}
    </p>
  } @else if (loading()) {
    <div
      class="skeleton"
      aria-hidden="true">
      @for (placeholder of skeletonRows(); track $index) {
        <ds-skeleton height="var(--_bar-chart-track-height)" />
      }
    </div>
  } @else if (isEmpty()) {
    <p class="empty">
      {{ emptyTextResolved() }}
    </p>
  } @else {
    <div
      class="rows"
      [class.dims-others]="dimOthers()"
      [attr.role]="interactive() ? 'group' : 'img'"
      [attr.aria-label]="accessibleName()"
      [dsChartTooltip]="tooltipContext()"
      [dsChartTooltipOrigin]="activeMark.origin()"
      [dsChartTooltipTemplate]="tooltipTemplate() ?? null">
      @for (entry of rows(); track entry.key; let index = $index) {
        <div
          class="row"
          animate.leave="mark-leave"
          [style.--_chart-mark-stagger]="markStagger(index)"
          [class.interactive]="interactive()"
          [class.is-pinned]="activeMark.pinned() && activeMark.index() === index"
          [attr.role]="interactive() ? 'button' : null"
          [attr.tabindex]="
            interactive() ? (index === tabStopIndex() ? 0 : -1) : null
          "
          [attr.data-mark-index]="index"
          [attr.aria-label]="interactive() ? entryLabel(entry) : null"
          (pointerenter)="activeMark.enter(index, $event)"
          (pointerleave)="activeMark.leave()"
          (focus)="onMarkFocus(index, $event)"
          (blur)="activeMark.leave()"
          (keydown)="onMarkNavigation($event, index)"
          (click)="onMarkClick(entry.row, index, $event)"
          (keydown.enter)="onRowKey(entry.row, $event)"
          (keydown.space)="onRowKey(entry.row, $event)">
          <span class="label">
            {{ entry.row.label }}
          </span>

          <span class="value">
            {{ entry.formattedValue }}
          </span>

          @if (showPercent()) {
            <span class="percent">
              {{ entry.formattedPercent }}
            </span>
          }

          <span class="track">
            <span
              class="fill"
              animate.enter="mark-enter"
              [style.width.%]="entry.widthPercent"
              [style.background]="entry.color">
              @if (activeMark.pinned() && activeMark.index() === index) {
                <ds-icon
                  class="pin-marker"
                  name="pin"
                  [size]="14" />
              }
            </span>
          </span>
        </div>
      }
    </div>

    @if (dataTableResolved() !== 'none') {
      <details
        class="data-table"
        [open]="dataTableResolved() === 'visible'">
        <summary>
          Data table
        </summary>

        <table>
          <caption>
            {{
              caption() ?? 'Chart data'
            }}
          </caption>

          <thead>
            <tr>
              <th scope="col">
                Label
              </th>

              <th scope="col">
                Value
              </th>

              @if (partOfWhole()) {
                <th scope="col">
                  Share of total
                </th>
              }
            </tr>
          </thead>

          <tbody>
            @for (entry of rows(); track entry.key) {
              <tr>
                <td>
                  {{ entry.row.label }}
                </td>

                <td>
                  {{ entry.formattedValue }}
                </td>

                @if (partOfWhole()) {
                  <td>
                    {{ entry.share }}
                  </td>
                }
              </tr>
            }
          </tbody>
        </table>
      </details>
    }
  }
</figure>
