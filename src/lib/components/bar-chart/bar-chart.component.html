<figure class="bar-chart">
  @if (caption()) {
    <figcaption>
      {{ caption() }}
    </figcaption>
  }

  @if (loading()) {
    <div
      class="skeleton"
      aria-hidden="true">
      @for (placeholder of skeletonRows(); track $index) {
        <ds-skeleton height="var(--_bar-chart-track-height)" />
      }
    </div>
  } @else if (isEmpty()) {
    <p class="empty">
      {{ emptyText() }}
    </p>
  } @else {
    <div
      class="rows"
      role="img"
      [attr.aria-label]="accessibleName()">
      @for (entry of rows(); track $index) {
        <div
          class="row"
          (click)="rowClick.emit(entry.row)">
          <span class="label">
            {{ entry.row.label }}
          </span>

          <span class="value">
            {{ entry.formattedValue }}
          </span>

          @if (showPercent()) {
            <span class="percent">
              {{ entry.formattedPercent }}
            </span>
          }

          <span class="track">
            <span
              class="fill"
              [style.width.%]="entry.widthPercent"
              [style.background]="entry.color">
            </span>
          </span>
        </div>
      }
    </div>

    @if (dataTable() !== 'none') {
      <details
        class="data-table"
        [open]="dataTable() === 'visible'">
        <summary>
          Data table
        </summary>

        <table>
          <caption>
            {{
              caption() ?? 'Chart data'
            }}
          </caption>

          <thead>
            <tr>
              <th scope="col">
                Label
              </th>

              <th scope="col">
                Value
              </th>
            </tr>
          </thead>

          <tbody>
            @for (entry of rows(); track $index) {
              <tr>
                <td>
                  {{ entry.row.label }}
                </td>

                <td>
                  {{ entry.formattedValue }}
                </td>
              </tr>
            }
          </tbody>
        </table>
      </details>
    }
  }
</figure>
