@if (imageUrl()) {
  <img
    alt=""
    [src]="imageUrl()"
  />
} @else if (initials()) {
  {{ initials() }}
} @else if (fallbackIcon()) {
  <ds-icon
    [name]="fallbackIcon()!"
    [size]="16"
  />
}

@if (status()) {
  <span
    role="img"
    [class]="'status-dot status-dot--' + status()"
    [attr.aria-label]="statusAriaLabel()"
  >
  </span>
}
