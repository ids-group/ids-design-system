@if (imageUrl() && !imageFailed()) {
  <img
    alt=""
    [src]="imageUrl()"
    (error)="imageFailed.set(true)" />
} @else if (initialsText()) {
  {{ initialsText() }}
} @else if (fallbackIcon()) {
  <ds-icon
    [name]="fallbackIcon()!"
    [size]="16" />
}

@if (status()) {
  <span
    role="img"
    [class]="'status-dot status-dot--' + status()"
    [attr.aria-label]="statusAriaLabel()">
  </span>
}
