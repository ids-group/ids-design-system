<nav
  class="pagination"
  aria-label="Pagination">
  @if (showLabel()) {
    <span class="label">
      {{ rangeLabel() }}
    </span>
  }

  <button
    class="pagination-button"
    type="button"
    aria-label="Previous page"
    [disabled]="currentPage() === 1"
    (click)="goTo(currentPage() - 1)">
    <ds-icon
      name="chevronLeft"
      [size]="14">
    </ds-icon>
  </button>

  @for (item of pageItems(); track $index) {
    @if (item === 'ellipsis') {
      <span
        class="ellipsis"
        aria-hidden="true">
        …
      </span>
    } @else {
      <button
        class="pagination-button"
        type="button"
        [class.active]="item === currentPage()"
        [attr.aria-label]="'Page ' + item"
        [attr.aria-current]="item === currentPage() ? 'page' : null"
        (click)="goTo(item)">
        {{ item }}
      </button>
    }
  }

  <button
    class="pagination-button"
    type="button"
    aria-label="Next page"
    [disabled]="currentPage() === totalPages()"
    (click)="goTo(currentPage() + 1)">
    <ds-icon
      name="chevronRight"
      [size]="14">
    </ds-icon>
  </button>

  @if (showPageSize()) {
    <!-- reserveMessage pinned off: a page-size dropdown shows neither hint nor
         error, so there is nothing to reserve, and inheriting the app-level
         default would push the control off the page buttons' baseline. -->
    <ds-select
      class="size"
      ariaLabel="Rows per page"
      size="sm"
      [reserveMessage]="false"
      [options]="sizeOptions()"
      [value]="pageSizeStr()"
      (valueChange)="onSizeChange($event)">
    </ds-select>
  }
</nav>
