<nav
  [attr.aria-label]="intl().pagination.label"
  [attr.aria-busy]="loading() ? 'true' : null"
  [class]="navClass()">
  @if (showLabel()) {
    <span class="label">
      @if (loading()) {
        <ds-skeleton
          width="120px"
          height="1em"
          [inline]="true" />
      } @else {
        {{ rangeLabel() }}
      }
    </span>
  }

  <button
    class="pagination-button"
    type="button"
    [attr.aria-label]="intl().pagination.previous"
    [disabled]="loading() || currentPage() === 1"
    (click)="goTo(currentPage() - 1)">
    <ds-icon
      name="chevronLeft"
      [size]="14">
    </ds-icon>
  </button>

  @for (item of pageItems(); track $index) {
    @if (item === 'ellipsis') {
      <span
        class="ellipsis"
        aria-hidden="true">
        …
      </span>
    } @else {
      <button
        class="pagination-button"
        type="button"
        [class.active]="item === currentPage() && total() !== 0"
        [disabled]="loading() || total() === 0"
        [attr.aria-label]="intl().pagination.page(item)"
        [attr.aria-current]="item === currentPage() && total() !== 0 ? 'page' : null"
        (click)="goTo(item)">
        {{ item }}
      </button>
    }
  }

  <button
    class="pagination-button"
    type="button"
    [attr.aria-label]="intl().pagination.next"
    [disabled]="loading() || currentPage() === totalPages()"
    (click)="goTo(currentPage() + 1)">
    <ds-icon
      name="chevronRight"
      [size]="14">
    </ds-icon>
  </button>

  @if (showPageSize()) {
    <!-- reserveMessage pinned off: a page-size dropdown shows neither hint nor
         error, so there is nothing to reserve, and inheriting the app-level
         default would push the control off the page buttons' baseline. -->
    <ds-select
      class="size"
      size="sm"
      [ariaLabel]="intl().pagination.rowsPerPage"
      [reserveMessage]="false"
      [disabled]="loading()"
      [options]="sizeOptions()"
      [value]="pageSizeStr()"
      (valueChange)="onSizeChange($event)">
    </ds-select>
  }
</nav>
