<nav class="pagination">
  @if (showLabel()) {
    <span class="label">{{ rangeLabel() }}</span>
  }
  <button class="pagination-button" type="button" [disabled]="currentPage() === 1" (click)="goTo(currentPage() - 1)">
    <ds-icon name="chevronLeft" [size]="14"></ds-icon>
  </button>
  @for (item of pageItems(); track $index) {
    @if (item === 'ellipsis') {
      <span class="ellipsis">…</span>
    } @else {
      <button
        class="pagination-button"
        type="button"
        [class.active]="item === currentPage()"
        (click)="goTo(item)"
      >{{ item }}</button>
    }
  }
  <button class="pagination-button" type="button" [disabled]="currentPage() === totalPages()" (click)="goTo(currentPage() + 1)">
    <ds-icon name="chevronRight" [size]="14"></ds-icon>
  </button>
  <ds-select
    class="size"
    [options]="sizeOptions()"
    [value]="pageSizeStr()"
    (valueChange)="onSizeChange($event)"
    size="sm"
  ></ds-select>
</nav>
