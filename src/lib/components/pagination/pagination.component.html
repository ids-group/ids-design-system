<nav
  #nav
  [attr.aria-label]="intl().pagination.label"
  [attr.aria-busy]="loading() ? 'true' : null"
  [class]="navClass()">
  @if (showLabel()) {
    <span class="label">
      @if (loading()) {
        <ds-skeleton
          width="120px"
          height="1em"
          [inline]="true" />
      } @else {
        {{ rangeLabel() }}
      }
    </span>
  }

  <button
    class="pagination-button"
    type="button"
    [attr.aria-label]="intl().pagination.previous"
    [attr.aria-disabled]="loading() ? 'true' : null"
    [disabled]="empty() || currentPage() === 1"
    (click)="goTo(currentPage() - 1, nav)">
    <ds-icon
      name="chevronLeft"
      [size]="14">
    </ds-icon>
  </button>

  @for (item of pageItems(); track $index) {
    @if (item === 'ellipsis') {
      <span
        class="ellipsis"
        aria-hidden="true">
        …
      </span>
    } @else {
      <button
        class="pagination-button"
        type="button"
        [class.active]="item === currentPage() && !empty()"
        [attr.aria-disabled]="loading() ? 'true' : null"
        [disabled]="empty()"
        [attr.aria-label]="intl().pagination.page(item)"
        [attr.aria-current]="item === currentPage() && !empty() ? 'page' : null"
        (click)="goTo(item, nav)">
        {{ item }}
      </button>
    }
  }

  <button
    class="pagination-button"
    type="button"
    [attr.aria-label]="intl().pagination.next"
    [attr.aria-disabled]="loading() ? 'true' : null"
    [disabled]="empty() || currentPage() === totalPages()"
    (click)="goTo(currentPage() + 1, nav)">
    <ds-icon
      name="chevronRight"
      [size]="14">
    </ds-icon>
  </button>

  @if (showPageSize()) {
    <!-- reserveMessage pinned off: the app-level default would push the control off the page buttons' baseline. -->
    <ds-select
      class="size"
      size="sm"
      [ariaLabel]="intl().pagination.rowsPerPage"
      [reserveMessage]="false"
      [disabled]="loading()"
      [options]="sizeOptions()"
      [value]="pageSizeStr()"
      (valueChange)="onSizeChange($event)">
    </ds-select>
  }
</nav>
