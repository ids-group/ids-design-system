<div [class]="'chat-input layout-' + layout()">
  <div class="attachments">
    <ng-content select="[attachments]" />
  </div>

  @if (statusAbove()) {
    <div
      class="status status-above"
      aria-live="polite">
      {{ statusText() }}
    </div>
  }

  <div
    class="frame"
    dsFieldClickFocus
    [class.disabled]="disabled()">
    <div class="box"></div>

    <div class="chips">
      <ng-content select="[chips]" />
    </div>

    <ds-textarea
      autosize
      resize="none"
      [rows]="minRows()"
      [minRows]="minRows()"
      [maxRows]="maxRows()"
      [placeholder]="placeholder()"
      [ariaLabel]="textareaLabel()"
      [disabled]="disabled()"
      [(value)]="value"
      (keydown)="onKeydown($event)"
      (paste)="onPaste($event)" />

    <div class="actions">
      <ng-content select="[actions]" />
    </div>

    @if (!statusAbove()) {
      <span
        class="status status-bar"
        aria-live="polite">
        {{ statusText() }}
      </span>
    }

    <div
      class="send"
      [class.queue]="queueShown()">
      @if (queueShown()) {
        <ds-icon-button
          icon="send"
          size="sm"
          [ariaLabel]="redirectLabel()"
          [dsTooltip]="redirectLabel()"
          (pressed)="redirect()" />

        @if (stoppable()) {
          <ds-icon-button
            icon="stop"
            size="sm"
            [ariaLabel]="stopLabel()"
            [dsTooltip]="stopLabel()"
            (pressed)="stopRequested.emit()" />
        }
      }

      <ng-content select="[send]">
        <ds-button
          size="sm"
          class="send-button"
          loadingMode="icon"
          [class.stop]="stopShown()"
          [icon]="mainIcon()"
          [ariaLabel]="mainLabel()"
          [dsTooltip]="stopShown() || queueShown() ? mainLabel() : ''"
          [disabled]="disabled()"
          [loading]="busy() && !stopShown() && !queueShown()"
          (pressed)="onSendPressed()" />
      </ng-content>
    </div>
  </div>
</div>
