<label
  [class]="classes()"
  [attr.aria-disabled]="disabled() ? 'true' : null"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave()"
  (drop)="onDrop($event)">
  <input
    type="file"
    class="dz-input"
    [attr.aria-label]="intl().dropzone.label"
    [attr.accept]="accept() || null"
    [multiple]="multiple()"
    [disabled]="disabled()"
    (change)="onPickerChange($event)" />

  @if (files().length === 0) {
    <ds-icon
      name="upload"
      [size]="24">
    </ds-icon>

    <div class="title">
      {{ intl().dropzone.title }}
    </div>

    <div class="hint">
      {{ intl().dropzone.hint }}
    </div>

    <ng-content select="[hint]"></ng-content>
  } @else {
    <div class="file-list">
      @for (file of files(); track file.id) {
        <div [class]="'file ' + file.state">
          <ds-icon
            class="icon"
            [name]="fileIcon(file.state)"
            [size]="20">
          </ds-icon>

          <div class="main">
            <div class="name">
              {{ file.name }}
            </div>

            <div class="meta">
              {{ fileMeta(file) }}
            </div>

            @if (file.state === 'uploading') {
              <div class="progress">
                <div
                  class="progress-fill"
                  [style.width.%]="file.progress">
                </div>
              </div>
            }
          </div>

          <button
            class="remove"
            type="button"
            [attr.aria-label]="intl().dropzone.remove(file.name)"
            (click)="
              onRemove(file); $event.preventDefault(); $event.stopPropagation()
            ">
            <ds-icon
              name="x"
              [size]="14">
            </ds-icon>
          </button>
        </div>
      }
    </div>
  }
</label>
