<button
  #trigger
  type="button"
  class="trigger"
  aria-haspopup="dialog"
  [attr.aria-expanded]="open() || preview.staticPreview()"
  [attr.aria-label]="ariaLabelResolved()"
  [attr.aria-invalid]="invalidResolved() ? 'true' : null"
  [attr.aria-describedby]="hintId()"
  [disabled]="isDisabled()"
  (click)="toggle()">
  <span
    class="swatch"
    [style.background-color]="displayHex()">
  </span>

  <span class="hex">
    {{ displayHex() }}
  </span>

  <ds-field-status
    [pending]="pendingShown()"
    [changed]="changedShown()" />

  <ds-icon
    class="chevron"
    name="chevronDown"
    [size]="16" />
</button>

@if (preview.staticPreview()) {
  <ng-container [ngTemplateOutlet]="panelTpl()" />
}

<ds-field-message
  [icon]="messageIcon()"
  [text]="message().text"
  [state]="message().state"
  [messageId]="hintId()"
  [reserve]="reserveMessageResolved()"
  [changed]="changedShown()" />

<ng-template #panel>
  <div
    class="panel"
    role="dialog"
    [attr.aria-label]="ariaLabelResolved()">
    <div
      class="sv-plane"
      tabindex="0"
      [attr.aria-label]="intl().colorPicker.saturationBrightness"
      [style.background-color]="hueColor()"
      (pointerdown)="onSvPointerDown($event)"
      (pointermove)="onSvPointerMove($event)"
      (pointerup)="onSvPointerUp($event)"
      (pointercancel)="onSvPointerUp($event)"
      (keydown)="onSvKeydown($event)">
      <span
        class="sv-thumb"
        [style.left.%]="svThumb().left"
        [style.top.%]="svThumb().top">
      </span>
    </div>

    <div
      class="hue-track"
      role="slider"
      tabindex="0"
      [attr.aria-label]="intl().colorPicker.hue"
      [attr.aria-valuemin]="0"
      [attr.aria-valuemax]="360"
      [attr.aria-valuenow]="hsv().h"
      (pointerdown)="onHuePointerDown($event)"
      (pointermove)="onHuePointerMove($event)"
      (pointerup)="onHuePointerUp($event)"
      (pointercancel)="onHuePointerUp($event)"
      (keydown)="onHueKeydown($event)">
      <span
        class="hue-thumb"
        [style.left.%]="huePercent()">
      </span>
    </div>

    <div class="fields">
      <span
        class="preview"
        [style.background-color]="displayHex()">
      </span>

      <input
        type="text"
        class="hex-input"
        spellcheck="false"
        autocomplete="off"
        [attr.aria-label]="intl().colorPicker.hexValue"
        [value]="displayHex()"
        (input)="onHexInput($event)" />
    </div>

    <div
      class="presets"
      role="group"
      [attr.aria-label]="intl().colorPicker.presets">
      @for (preset of presets(); track preset) {
        <button
          type="button"
          class="preset"
          [class.selected]="isSelected(preset)"
          [style.background-color]="preset"
          [attr.aria-label]="preset"
          [attr.aria-pressed]="isSelected(preset)"
          (click)="selectPreset(preset)">
        </button>
      }
    </div>
  </div>
</ng-template>
