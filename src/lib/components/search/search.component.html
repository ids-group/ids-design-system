<div
  class="search"
  dsFieldClickFocus
  [class]="size()"
>
  @if (showIcon()) {
    <ds-icon
      name="search"
      [size]="16"
    >
    </ds-icon>
  }

  <input
    #searchInput
    class="search-input"
    [placeholder]="placeholder()"
    [attr.aria-label]="ariaLabel() || placeholder() || null"
    [ngModel]="text()"
    (ngModelChange)="onText($event)"
    (keydown.enter)="onSubmit()"
  />

  @if (clearable() && text()) {
    <button
      type="button"
      class="search-clear"
      aria-label="Clear search"
      (click)="clear()"
    >
      <ds-icon
        name="x"
        [size]="14"
      >
      </ds-icon>
    </button>
  }

  @if (shortcut()) {
    <kbd class="kbd">
      {{ shortcut() }}
    </kbd>
  }
</div>
