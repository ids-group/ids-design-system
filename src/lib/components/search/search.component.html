<div
  class="search"
  [class.sm]="size() === 'sm'"
  [class.md]="size() === 'md'"
  [class.lg]="size() === 'lg'"
  dsFieldClickFocus
>
  @if (showIcon()) {
    <ds-icon
      name="search"
      [size]="16"
    >
    </ds-icon>
  }

  <input
    #searchInput
    class="search-input"
    [placeholder]="placeholder()"
    [attr.aria-label]="ariaLabel() || placeholder() || null"
    [(ngModel)]="value"
    (keydown.enter)="onSubmit()"
  />

  @if (clearable() && value()) {
    <button
      type="button"
      class="search-clear"
      aria-label="Clear search"
      (click)="clear()"
    >
      <ds-icon
        name="x"
        [size]="14"
      >
      </ds-icon>
    </button>
  }

  @if (shortcut()) {
    <kbd class="kbd">
      {{ shortcut() }}
    </kbd>
  }
</div>
