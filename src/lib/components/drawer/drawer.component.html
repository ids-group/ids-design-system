@if (rendered() || preview.staticPreview()) {
  <div
    [class]="preview.staticPreview() ? 'drawer-static' : 'drawer-root'"
    [class.closing]="closing()">
    @if (!preview.staticPreview()) {
      <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- scrim; click dismisses, keyboard dismisses via Escape (host document:keydown.escape) -->
      <div
        class="drawer-scrim"
        [class.closing]="closing()"
        (click)="onClose()">
      </div>
    }

    <div
      role="dialog"
      [attr.aria-modal]="preview.staticPreview() ? null : 'true'"
      [cdkTrapFocus]="!preview.staticPreview()"
      [cdkTrapFocusAutoCapture]="!preview.staticPreview()"
      [class]="classes()"
      [class.closing]="closing()"
      [attr.aria-labelledby]="title() ? titleId : null"
      (keydown.escape)="onClose()"
      (animationend)="onLeaveEnd($event)">
      <header class="header">
        <h4
          class="title"
          [id]="titleId">
          {{ title() }}
        </h4>

        <button
          type="button"
          class="close"
          [attr.aria-label]="intl().dialog.close"
          (click)="onClose()">
          <ds-icon
            name="x"
            [size]="16" />
        </button>
      </header>

      <div class="body">
        <ng-content select="[drawer-body], [body]"></ng-content>

        <ng-content></ng-content>
      </div>

      <div class="footer">
        <ng-content select="[drawer-footer], [actions]"></ng-content>
      </div>
    </div>
  </div>
}
