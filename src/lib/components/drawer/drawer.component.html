@if (open()) {
  <div
    class="drawer-scrim"
    (click)="onClose()"
  ></div>

  <div
    role="dialog"
    aria-modal="true"
    cdkTrapFocus
    cdkTrapFocusAutoCapture
    [class]="classes()"
    [attr.aria-labelledby]="title() ? titleId : null"
    (keydown.escape)="onClose()"
  >
    <header class="header">
      <h4
        class="title"
        [id]="titleId"
      >
        {{ title() }}
      </h4>

      <button
        type="button"
        class="close"
        aria-label="Close"
        (click)="onClose()"
      >
        <ds-icon
          name="x"
          [size]="16"
        />
      </button>
    </header>

    <div class="body">
      <ng-content select="[drawer-body]"></ng-content>
    </div>

    <div class="footer">
      <ng-content select="[drawer-footer]"></ng-content>
    </div>
  </div>
}
