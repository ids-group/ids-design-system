@if (label()) {
  <span class="label">
    {{ label() }}
    <ds-field-status
      [pending]="pendingShown()"
      [changed]="changedShown()" />
  </span>
}

<div class="radios">
  <ng-content />
</div>

@if (!label()) {
  <ds-field-status
    [pending]="pendingShown()"
    [changed]="changedShown()" />
}

<ds-field-message
  [icon]="messageIcon()"
  [text]="message().text"
  [state]="message().state"
  [messageId]="hintId()"
  [reserve]="reserveMessageResolved()"
  [changed]="changedShown()" />
