<figure
  class="donut-chart"
  [style.--_donut-chart-hole-fraction]="hole()">
  @if (caption()) {
    <figcaption>
      {{ caption() }}
    </figcaption>
  }

  @if (error()) {
    <div class="empty">
      <div
        class="empty-ring"
        aria-hidden="true">
      </div>

      <p
        class="empty-text is-error"
        role="status">
        {{ errorTextResolved() }}
      </p>
    </div>
  } @else if (loading()) {
    <div
      class="skeleton"
      aria-hidden="true"
      [class.legend-bottom]="legend() === 'bottom'">
      <ds-skeleton
        circle
        width="var(--_donut-chart-size)"
        height="var(--_donut-chart-size)" />

      @if (legend() !== 'none') {
        <div class="skeleton-legend">
          @for (placeholder of skeletonRows(); track $index) {
            <ds-skeleton height="var(--_donut-chart-legend-row-height)" />
          }
        </div>
      }
    </div>
  } @else if (isEmpty()) {
    <div class="empty">
      <div
        class="empty-ring"
        aria-hidden="true">
      </div>

      <p class="empty-text">
        {{ emptyTextResolved() }}
      </p>
    </div>
  } @else {
    <div
      class="chart"
      [attr.role]="interactive() ? 'group' : 'img'"
      [class.legend-bottom]="legend() === 'bottom'"
      [attr.aria-label]="accessibleName()"
      [dsChartTooltip]="tooltipContext()"
      [dsChartTooltipOrigin]="activeMark.origin()"
      [dsChartTooltipTemplate]="tooltipTemplate() ?? null">
      <div
        class="ring"
        [class.ring-outline]="total() === 0">
        <svg
          class="ring-svg"
          animate.enter="mark-enter"
          [class.dims-others]="dimOthers()"
          [attr.aria-hidden]="ringCarriesTheRoute() ? null : true"
          [attr.viewBox]="viewBox">
          @for (entry of slices(); track entry.slice.id; let index = $index) {
            <path
              class="slice"
              [class.interactive]="interactive()"
              [class.is-pinned]="activeMark.pinned() && activeMark.index() === index"
              [class.focusable]="ringCarriesTheRoute()"
              [attr.d]="entry.path"
              [style.fill]="entry.color"
              [attr.role]="ringCarriesTheRoute() ? 'button' : null"
              [attr.tabindex]="
                ringCarriesTheRoute()
                  ? index === tabStopIndex()
                    ? 0
                    : -1
                  : null
              "
              [attr.data-mark-index]="index"
              [attr.aria-label]="
                ringCarriesTheRoute() ? entryLabel(entry) : null
              "
              (pointerenter)="activeMark.enter(index, $event)"
              (pointerleave)="activeMark.leave()"
              (focus)="onMarkFocus(index, $event)"
              (blur)="activeMark.leave()"
              (keydown)="onMarkNavigation($event, index, '.ring-svg')"
              (click)="onMarkClick(entry.slice)"
              (keydown.enter)="onSliceKey(entry.slice, $event)"
              (keydown.space)="onSliceKey(entry.slice, $event)">
            </path>
          }
        </svg>

        <div class="center">
          <span class="center-value">
            {{ resolvedCenterValue() }}
          </span>

          @if (centerLabel()) {
            <span class="center-label">
              {{ centerLabel() }}
            </span>
          }
        </div>
      </div>

      @if (legend() !== 'none') {
        <ul class="legend">
          @for (entry of slices(); track entry.slice.id; let index = $index) {
            <li
              class="legend-item"
              [class.interactive]="interactive()"
              [attr.role]="interactive() ? 'button' : null"
              [attr.tabindex]="
                interactive() ? (index === tabStopIndex() ? 0 : -1) : null
              "
              [attr.data-mark-index]="index"
              [attr.aria-label]="interactive() ? entryLabel(entry) : null"
              (pointerenter)="activeMark.enter(index, $event)"
              (pointerleave)="activeMark.leave()"
              (focus)="onMarkFocus(index, $event)"
              (blur)="activeMark.leave()"
              (keydown)="onMarkNavigation($event, index, '.legend')"
              (click)="onMarkClick(entry.slice)"
              (keydown.enter)="onSliceKey(entry.slice, $event)"
              (keydown.space)="onSliceKey(entry.slice, $event)">
              <span
                class="swatch"
                animate.enter="mark-enter"
                [style.background]="entry.color">
              </span>

              <span class="legend-label">
                {{ entry.slice.label }}
              </span>

              <span class="legend-value">
                {{ entry.formattedValue }}
              </span>

              <span class="legend-percent">
                {{ entry.formattedPercent }}
              </span>
            </li>
          }
        </ul>
      }
    </div>

    @if (dataTableResolved() !== 'none') {
      <details
        class="data-table"
        [open]="dataTableResolved() === 'visible'">
        <summary>
          Data table
        </summary>

        <table>
          <caption>
            {{
              caption() ?? 'Chart data'
            }}
          </caption>

          <thead>
            <tr>
              <th scope="col">
                Label
              </th>

              <th scope="col">
                Value
              </th>

              <th scope="col">
                Share
              </th>
            </tr>
          </thead>

          <tbody>
            @for (entry of slices(); track entry.slice.id) {
              <tr>
                <td>
                  {{ entry.slice.label }}
                </td>

                <td>
                  {{ entry.formattedValue }}
                </td>

                <td>
                  {{ entry.formattedPercent }}
                </td>
              </tr>
            }
          </tbody>
        </table>
      </details>
    }
  }
</figure>
