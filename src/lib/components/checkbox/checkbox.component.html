<div [class]="fieldClass()">
  <span
    class="control-line"
    [class.is-disabled]="isDisabled()">
    <input
      type="checkbox"
      class="check"
      [checked]="checked()"
      [indeterminate]="indeterminate()"
      [disabled]="isDisabled()"
      [attr.name]="name()"
      [attr.id]="controlId()"
      [attr.aria-label]="resolvedAriaLabel()"
      [attr.aria-invalid]="invalidResolved() ? 'true' : null"
      [attr.aria-describedby]="hintId()"
      [attr.aria-required]="required() ? 'true' : null"
      (change)="onCheckedChange($event)"
      (blur)="markTouched()" />

    <label
      class="control-text"
      [attr.for]="controlId()">
      @if (label()) {
        {{ label() }}
        @if (required()) {
          <span
            class="req"
            aria-hidden="true">
            *
          </span>
        }
      } @else {
        <ng-content></ng-content>
      }
    </label>

    <ds-field-status
      [pending]="pendingShown()"
      [changed]="changedShown()" />
  </span>

  <ds-field-message
    [icon]="messageIcon()"
    [text]="message().text"
    [state]="message().state"
    [messageId]="hintId()"
    [reserve]="reserveMessageResolved()"
    [changed]="changedShown()" />
</div>
