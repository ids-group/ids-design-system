<div [class]="fieldClass()">
  <span
    class="control-line"
    [class.is-disabled]="isDisabled()"
  >
    <input
      type="checkbox"
      class="check"
      [checked]="checked()"
      [indeterminate]="indeterminate()"
      [disabled]="isDisabled()"
      [attr.name]="name()"
      [attr.id]="controlId()"
      [attr.aria-invalid]="invalidResolved() ? 'true' : null"
      [attr.aria-describedby]="hintId()"
      [attr.aria-required]="required() ? 'true' : null"
      (change)="onCheckedChange($event)"
      (blur)="markTouched()"
    />

    @if (label()) {
      <label
        class="control-text"
        [attr.for]="controlId()"
      >
        {{ label() }}
        @if (required()) {
          <span
            class="req"
            aria-hidden="true"
          >
            *
          </span>
        }
      </label>
    }

    @if (devMode) {
      <span dsProjectionDropped="ds-checkbox">
        <ng-content></ng-content>
      </span>
    }
  </span>

  <ds-field-message
    [text]="message().text"
    [state]="message().state"
    [messageId]="hintId()"
    [reserve]="reserveMessageResolved()"
  />
</div>
