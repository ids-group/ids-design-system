<div [class]="fieldClass()">
  <span
    class="control-line"
    [class.is-disabled]="isDisabled()"
  >
    <input
      type="checkbox"
      class="check"
      [checked]="checked()"
      [indeterminate]="indeterminate()"
      [disabled]="isDisabled()"
      [attr.name]="name()"
      [attr.id]="controlId()"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      [attr.aria-describedby]="hintId()"
      [attr.aria-required]="required() ? 'true' : null"
      (change)="onCheckedChange($event)"
      (blur)="markTouched()"
    />

    @if (label()) {
      <label
        class="control-text"
        [attr.for]="controlId()"
      >
        {{ label() }}
        @if (required()) {
          <span
            class="req"
            aria-hidden="true"
          >
            *
          </span>
        }
      </label>
    }
  </span>

  <ds-field-message
    [text]="hint()"
    [state]="messageState()"
    [messageId]="hintId()"
    [reserve]="reserveMessage()"
  />
</div>
