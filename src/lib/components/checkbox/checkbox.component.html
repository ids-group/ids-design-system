<div [class]="fieldClass()">
  <span
    class="control-line"
    [class.is-disabled]="isDisabled()"
  >
    <input
      type="checkbox"
      class="check"
      [checked]="checked()"
      [indeterminate]="indeterminate()"
      [disabled]="isDisabled()"
      [attr.name]="name()"
      [attr.id]="controlId()"
      [attr.aria-invalid]="invalid() ? 'true' : null"
      [attr.aria-describedby]="hintId()"
      [attr.aria-required]="required() ? 'true' : null"
      (change)="onCheckedChange($event)"
      (blur)="markTouched()"
    />

    @if (label()) {
      <label
        class="control-text"
        [attr.for]="controlId()"
      >
        {{ label() }}
        @if (required()) {
          <span
            class="req"
            aria-hidden="true"
          >
            *
          </span>
        }
      </label>
    }

    <!-- Dev-only probe, NOT projection support. The caption comes from [label],
         so content written between the tags would vanish silently; this is the
         only <ng-content> in the component and it exists purely so the warning
         can see that content was passed. Production renders no extra node.
         Implementing real projection is still open — see docs/todo.md. -->
    @if (devMode) {
      <span
        #projectionProbe
        class="projection-probe"
      >
        <ng-content></ng-content>
      </span>
    }
  </span>

  <ds-field-message
    [text]="hint()"
    [state]="messageState()"
    [messageId]="hintId()"
    [reserve]="reserveMessageResolved()"
  />
</div>
