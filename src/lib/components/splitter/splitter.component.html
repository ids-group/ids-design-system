<div
  class="pane pane-start"
  [id]="startId">
  <ng-content select="[start]" />
</div>

<div
  #handle
  class="handle"
  role="separator"
  tabindex="0"
  [class.dragging]="dragging()"
  [style.cursor]="cursor()"
  [attr.aria-orientation]="lineOrientation()"
  [attr.aria-label]="label()"
  [attr.aria-controls]="pane() === 'start' ? startId : endId"
  [attr.aria-valuenow]="current()"
  [attr.aria-valuemin]="min()"
  [attr.aria-valuemax]="max()"
  (pointerdown)="onPointerDown($event)"
  (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)"
  (lostpointercapture)="onPointerUp($event)"
  (dblclick)="reset()"
  (keydown)="onKeydown($event)">
</div>

<div
  class="pane pane-end"
  [id]="endId">
  <ng-content select="[end]" />
</div>

@if (dragFog()) {
  <div
    #fogStart
    class="fog fog-start"
    aria-hidden="true">
  </div>

  <div
    #fogEnd
    class="fog fog-end"
    aria-hidden="true">
  </div>
}
