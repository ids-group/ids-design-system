<ds-loading-overlay
  spinnerSize="lg"
  [loading]="variant() === 'loading'"
  [blur]="true">
  <span [class]="classes()">
    <span class="icon-tile">
      <ds-icon
        [name]="resolvedIcon()"
        [size]="28">
      </ds-icon>
    </span>

    @if (title()) {
      <span
        class="title"
        [class.clip]="titleOverflow() === 'clip'"
        [dsTooltipWhenClipped]="titleOverflow() === 'clip'">
        {{ title() }}
      </span>
    }

    @if (body()) {
      <span class="body">
        {{ body() }}
      </span>
    }

    <span class="cta">
      <ng-content select="[actions]"></ng-content>
    </span>
  </span>
</ds-loading-overlay>
